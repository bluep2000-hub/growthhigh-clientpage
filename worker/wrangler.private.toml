name = "growthhigh-clientpage-private"
main = "src/private-index.js"
compatibility_date = "2026-09-01"

# 자체 도메인 전환 후에는 위프코리아 경로만 이 Worker가 처리한다.
# workers.dev 주소는 전환 직전까지 유지하고, 전환 검증 후 별도로 끈다.
# 실제 기업 데이터·비밀번호·토큰은 설정이나 GitHub에 넣지 않는다.
workers_dev = true
preview_urls = false

routes = [
  { pattern = "client.growthhigh.co.kr/whiffkorea*", zone_name = "growthhigh.co.kr" }
]

[vars]
GOOGLE_CLIENT_ID = "832213026018-053lt0linfjtqjge6b11nnj3ajdkhr4e.apps.googleusercontent.com"
APP_ORIGIN = "https://client.growthhigh.co.kr"
INTERNAL_USERS_DB_ID = "3df815d7-12b9-8174-812e-f72174dacc99"
NOTION_VERSION = "2022-06-28"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[d1_databases]]
binding = "PRIVATE_DB"
database_name = "growthhigh-clientpage-private"
database_id = "a8fbbb00-fb49-4eb0-85c2-96d5b03a3bd4"
migrations_dir = "private-migrations"

[[d1_databases]]
binding = "DB"
database_name = "growthhigh-clientpage-notices"
database_id = "4ebde80e-7c34-4f36-9a18-8789fbbaf16e"
migrations_dir = "migrations"
