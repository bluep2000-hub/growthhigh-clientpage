name = "growthhigh-clientpage-relay"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 비밀값은 여기 적지 않는다. 이 파일은 레포에 커밋되고, 레포 루트는 통째로
# GitHub Pages 로 서빙되므로 여기 적은 것은 누구나 읽는다.
#
#   npx wrangler secret put NOTION_TOKEN
#   npx wrangler secret put EDITOR_PASSWORD
#   npx wrangler secret put GITHUB_DISPATCH_TOKEN
#   npx wrangler secret put BUILD_TOKEN
#   npx wrangler secret put AUTOMATION_TOKEN
#
# 로컬에서는 .dev.vars 에 넣는다 (.gitignore 에 들어 있다).

[vars]
# 값이 새어도 무해한 것만 여기 둔다.
NOTION_VERSION = "2022-06-28"
GITHUB_REPO = "bluep2000-hub/growthhigh-clientpage"

# 공지 저장소. 공지의 원본이 노션에서 이리로 옮겨 온다
# (../docs/adr/0004-공지-원본-이사.md).
#
# database_id 는 이미 붙어 있다(`wrangler d1 create` 로 만든 것). 비밀값이
# 아니다 — 이 값만으로는 아무것도 열리지 않고, 붙으려면 Cloudflare 계정 인증이
# 따로 필요하다. 표를 세우는 것은 따로다.
#
#   npx wrangler d1 migrations apply growthhigh-clientpage-notices --remote   # 배포본
#   npx wrangler d1 migrations apply growthhigh-clientpage-notices --local    # npm run dev
[[d1_databases]]
binding = "DB"
database_name = "growthhigh-clientpage-notices"
database_id = "4ebde80e-7c34-4f36-9a18-8789fbbaf16e"
migrations_dir = "migrations"
