        ['- ', '글머리'], ['1. ', '번호'], ['[] ', '할 일 (<code>[x] </code> 는 켜 둔 채로)'],
        ['# ## ### ', '제목 1 · 2 · 3'], ['&gt; ', '토글'], ['&quot; ', '인용'],
        ['/', '목록에서 고르기 — 표 · 코드 · 새 칸도 여기'],
      ]],
      ['줄 종류 — 단축키', [
        ['Ctrl + Shift + 0', '본문'],
        ['Ctrl + Shift + 1 2 3', '제목 1 · 2 · 3'],
        ['Ctrl + Shift + 4', '할 일'],
        ['Ctrl + Shift + 5', '글머리'],
        ['Ctrl + Shift + 6', '번호'],
        ['Ctrl + Shift + 7', '토글'],
        ['Ctrl + Shift + 8', '코드'],
      ]],
      ['서식', [
        ['Ctrl + B / I / U', '굵게 · 기울임 · 밑줄'],
        ['Ctrl + Shift + S', '취소선'],
        ['Ctrl + E', '코드'],
        ['Ctrl + K', '링크'],
        ['**굵게** *기울임*', '치는 대로 서식이 된다'],
        ['`코드` ~~취소~~', '치는 대로 서식이 된다'],
        ['색 · 형광펜', '글자를 고르면 뜨는 막대의 🎨'],
        ['주소 붙여넣기', '글자를 고른 채로 붙이면 링크가 된다'],
      ]],
      ['옮기기 · 고르기', [
        ['Tab / Shift + Tab', '들여쓰기 · 내어쓰기'],
        ['Ctrl + Shift + ↑ ↓', '줄 옮기기'],
        ['↑ ↓', '줄 사이 이동'],
        ['Shift + ↑ ↓', '여러 줄 잡기 — 잡은 뒤 Tab · 옮기기 · Backspace 가 모두에 걸린다'],
        ['줄 왼쪽 ⠿', '끌어서 옮기기'],
      ]],
      ['표 · 할 일', [
        ['Tab', '표 안에서 다음 칸 · 마지막 칸이면 행이 는다'],
        ['Ctrl + Enter', '할 일 체크'],
        ['표 밑 단추', '행 · 열 늘리고 줄이기'],
      ]],
    ];
    return `<details class="ed-help"><summary>손놀림 안내 — 담당자만 보입니다</summary>
      <div class="ed-help-b">${rows.map(([name, list]) => `<section>
        <h4>${name}</h4><dl>${list.map(([key, what]) =>
          `<dt>${key}</dt><dd>${what}</dd>`).join('')}</dl></section>`).join('')}
      <p class="ed-help-n">손댄 것은 「저장」을 눌러야 나갑니다.
        저장하면 1~2분 뒤 클라이언트 화면에 닿습니다.</p></div></details>`;
  }

  /* ══ 편집 모드 ═══════════════════════════════════════════════════
     담당자가 공지 화면에서 공지 전체를 고친다. 원본은 중계 서버의 저장소이고,
     여기서 고친 것이 곧 원본이므로 다음 빌드가 덮어쓰지 않는다.

     클라이언트에게는 이 아래 어느 것도 보이지 않는다. 편집 모드는 담당자
     공용 비밀번호를 통과해야만 켜지고, 그 비밀번호는 중계 서버만 안다.

     봉투가 평문인 클라이언트(샘플)에서는 아예 켜지 않는다. 평문이면 항목
     주소가 그대로 노출되고, 그 화면은 비밀번호 없이 누구나 연다. */
  const ED = {
    /* 공지가 **한 건도 없어도** 열린다. 첫 공지를 페이지에서 만들기 때문이다 —
       예전에는 노션에 공지가 있어야만 열려, 첫 공지는 노션에서 만들어야 했다 */
    can(){ return !!(CLIENT && !SAMPLE && ENV && ENV.enc !== false); },
    token(){ try { return sessionStorage.getItem(EKEY) || ''; } catch(_){ return ''; } },
    on(){ return this.can() && !!this.token(); },
    /* 비밀번호는 base64(UTF-8) 로 싣는다. HTTP 헤더는 바이트 하나가 한 글자라
       한글이 든 비밀번호를 그대로 넣으면 브라우저가 요청을 못 만든다 */
    pack(pw){ return btoa(String.fromCharCode(...new TextEncoder().encode(pw))); },
    async call(method, path, body){
      const res = await fetch(RELAY + path, {
        method,
        headers: Object.assign({'Authorization': 'Bearer ' + this.token()},
                               body ? {'Content-Type':'application/json'} : {}),
        body: body ? JSON.stringify(body) : undefined,
      });
      let data = null;
      try { data = await res.json(); } catch(_){}
      if(!res.ok){
        const err = new Error((data && data.detail) || (data && data.error) || res.status);
        err.status = res.status;
        err.code = data && data.error;
        /* 거절하며 건네준 것을 버리지 않는다 — 판이 어긋났을 때 저장소의 지금
           문서가 여기 실려 온다 */
        err.data = data;
        throw err;
      }
      return data;
    },
    async unlock(pw){
      const keep = this.token();
      sessionStorage.setItem(EKEY, this.pack(pw));
      try { await this.call('POST', '/auth'); return true; }
      catch(e){
        if(keep) sessionStorage.setItem(EKEY, keep); else sessionStorage.removeItem(EKEY);
        throw e;
      }
    },
  };

  /* 편집 모드 스위치. 공지 화면 제목 옆에만 둔다 */
  function editSwitch(){
    if(!ED.can()) return '';
    /* 켜 둔 세션이면 ?edit 가 없어도 계속 보인다 — 화면을 옮길 때마다
       주소를 다시 붙이게 만들지 않는다 */
    if(!EDITQ && !ED.token()) return '';
    if(ED.on()) return `<span class="edt"><span class="edt-on">편집 모드</span>
      <button class="edt-b" data-edoff>끄기</button></span>`;
    return `<span class="edt"><button class="edt-b" data-edon>담당자 편집</button></span>`;
  }

  function bindEditSwitch(){
    const off = document.querySelector('[data-edoff]');
    /* 붙잡기가 먼저다. 열쇠부터 지우면 담당자가 「두고 나가기」를 취소해도
       편집 모드는 이미 꺼져 있고, 고쳐 둔 줄은 다음 그리기에 사라진다 */
    if(off) off.onclick = () => {
      if(!edMayLeave()) return;
      edForgetAll();
      sessionStorage.removeItem(EKEY);
      go('notice');
    };

    const on = document.querySelector('[data-edon]');
    if(!on) return;
    on.onclick = () => {
      const box = on.parentElement;
      box.innerHTML = `<input type="password" placeholder="담당자 비밀번호"
        aria-label="담당자 비밀번호" autocomplete="off">
        <button class="edt-b" data-edgo>확인</button><span class="err"></span>`;
      const inp = box.querySelector('input'), err = box.querySelector('.err');
      inp.focus();
      const submit = async () => {
        if(!inp.value) return;
        err.textContent = '확인 중…';
        try { await ED.unlock(inp.value); go('notice'); }
        catch(e){
          err.textContent = e.status === 401 ? '비밀번호가 다릅니다'
                          : '연결하지 못했습니다';
          inp.select();
        }
      };
      box.querySelector('[data-edgo]').onclick = submit;
      inp.onkeydown = e => {
        if(e.key === 'Enter'){ e.preventDefault(); submit(); }
        if(e.key === 'Escape'){ box.innerHTML = ''; box.outerHTML = editSwitch(); bindEditSwitch(); }
      };
    };
  }

  /* ══ 공지 편집기 ═══════════════════════════════════════════════════
     편집 모드를 켜면 공지 전체가 그 자리에서 편집된다. 고치기·보태기·지우기가
     모두 화면에 쌓였다가 「저장」을 눌러야 한 번에 나간다 — 그래서 저장 전에
     되돌릴 수 있고, 재빌드도 한 번만 돈다.

     **공지의 원본은 저장소다**(docs/adr/0004-공지-원본-이사.md). 편집을 열 때
     `GET /notice/doc` 으로 공지 문서를 통째로 받아 **그것으로 화면을 다시
     그린다.** 봉투로 그린 화면을 고치지 않는 까닭은, 봉투가 지난 빌드의 것이라
     그 사이에 저장된 것을 화면이 모르기 때문이다 — 그대로 저장하면 남이
     적어 둔 줄이 소리 없이 사라진다.

     저장은 **문서를 통째로** 보낸다. 줄마다 따로 보내지 않으므로 무게 상한도,
     부분 실패도, 「이 줄만 저장 안 됨」도 없다. 화면을 걸어 다니며 지금 보이는
     그대로를 문서로 다시 지어 보내고, 저장소는 그것을 통째로 덮어쓴다.

     문서는 **판 번호**를 안고 있다. 편집을 연 뒤 판이 올랐으면(다른 담당자가
     먼저 저장했으면) 저장이 통째로 거절되고 저장소의 지금 문서가 함께 온다.
     화면에 적어 둔 글은 그대로 둔다 — 담당자가 견주고 고른다.

     저장할 때 브라우저가 만든 DOM 을 그대로 보내지는 않는다. contenteditable
     은 <b>·<font>·style 을 제멋대로 내놓는데, 중계 서버는 아는 태그만 받고
     모르는 것이 하나라도 섞이면 통째로 거절한다. edSerialize() 가 DOM 을
     걸어 다니며 중계 서버가 아는 어휘로만 다시 쓴다. */

  /** 저장소에서 받아 둔 공지 문서. 화면은 이것으로 그려진다 */
  let edDoc = null;
  /** 한 번이라도 받아 봤는가. 「공지가 없다」는 답도 받은 것이다 */
  let edLoaded = false;

  /** 블록 주소 → 항목 하나(`edItem`). 순서는 화면 순서다 */
  let edItems = new Map();

  /**
   * 손대 둔 것을 통째로 잊는다.
   *
   * 화면을 다시 그리기 **직전에** 부른다. 남겨 두면 그 장부가 사라질 DOM 을
   * 가리킨 채로 「저장하지 않은 것이 있다」고 한 번 더 묻고, 담당자가 거기서
   * 취소하면 화면과 장부가 서로 다른 것을 가리키게 된다.
   */
  function edForgetAll(){
    edSlHide();
    edItems = new Map();
    edSecs = new Map();
    edTitle = null;
  }

  /**
   * 칸 주소 → 칸 하나. 줄의 장부(`edItems`)와 짝이다.
   *
   *   base  손대기 전의 제목. 고쳤는지를 이것과 견준다
   *   home  처음 앉아 있던 자리. 옮겼는지를 이것과 견준다
   */
  let edSecs = new Map();
  let edSecSeq = 0;

  /**
   * 항목 하나가 안고 다니는 것. 노션에서 온 줄과 방금 보탠 줄이 같은 모양이어야
   * 한다 — 두 곳에 따로 적어 두면 칸을 하나 보태는 날 한쪽만 고치게 된다.
   *
   *   display  처음 그렸던 **표시용** HTML. 커스텀 이모지를 꺼내 올 곳이다
   *   base     손대기 전의 편집용 HTML. 고쳤는지를 이것과 견준다
   *   home     처음 앉아 있던 자리. 옮겼는지를 이것과 견준다
   *   type     그 줄의 종류. 저장할 때 문서에 그대로 실린다
   *   retype   바꾸려는 종류. 저장 전까지 화면에만 있다
   */
  /** 장부에 오르는 것 — 줄과 표의 칸. 둘 다 고치고 저장에 실린다 */
  const ED_ROWS = '.ck li[data-nid], .ck td[data-nid]';

  const edItem = (li, nx, extra) => Object.assign(
    {li, nx, display: '', base: null,
     isNew: false, del: false, checked: false, checkBase: false,
     type: '', home: null, moved: false, retype: null}, extra);
  let edWired = false;

  /** 공지 제목 칸. {input, base, seen} — 줄이 아니라 공지 한 건의 것이라 따로 둔다 */
  let edTitle = null;

  /* 줄바꿈은 태그로 싣는다. 그냥 두면 편집기가 공백으로 뭉갠다 —
     중계 서버의 escText() 와 같은 규칙이다 */
  const edEscText = s => esc(s).replace(/\n/g, '<br>');

  /* 글자 하나가 어떤 서식 속에 있는지. 태그 이름만 보지 않고 style 까지 본다 —
     편집기는 <b> 를 낼 때도 있고 style="font-weight:bold" 를 낼 때도 있다 */
  function edState(from, root){
    const st = {bold:false, italic:false, underline:false, strike:false, code:false,
                href:null, color:null, o:null, ot:''};
    for(let el = from; el; el = el.parentElement){
      const tag = el.tagName;
      if(tag === 'B' || tag === 'STRONG') st.bold = true;
      else if(tag === 'I' || tag === 'EM') st.italic = true;
      else if(tag === 'U') st.underline = true;
      else if(tag === 'S' || tag === 'DEL' || tag === 'STRIKE') st.strike = true;
      else if(tag === 'CODE') st.code = true;
      else if(tag === 'A' && st.href === null) st.href = el.getAttribute('href');
      const d = el.dataset || {};
      if(d.o !== undefined && st.o === null){ st.o = d.o; st.ot = d.ot || ''; }
      if(d.c && st.color === null) st.color = d.c;
      const s = el.style || {};
      if(/^(bold|[6-9]00)$/.test(s.fontWeight || '')) st.bold = true;
      if(s.fontStyle === 'italic') st.italic = true;
      const dec = (s.textDecoration || '') + ' ' + (s.textDecorationLine || '');
      if(dec.indexOf('underline') >= 0) st.underline = true;
      if(dec.indexOf('line-through') >= 0) st.strike = true;
      if(el === root) break;
    }
    return st;
  }

  /* 불투명 조각은 절대 이웃과 합치지 않는다 — 조각 하나가 rich_text 한 칸이다 */
  const edSame = (a, b) => a.o === null && b.o === null
    && a.bold === b.bold && a.italic === b.italic && a.underline === b.underline
    && a.strike === b.strike && a.code === b.code && a.href === b.href && a.color === b.color;

  /** DOM → 중계 서버가 받는 편집용 HTML. 감싸는 순서는 중계 서버와 같다 */
  function edSerialize(root){
    const runs = [];
    const push = (st, text) => {
      /* 글이 빈 불투명 조각도 싣는다. 빠뜨리면 그 멘션이 노션에서 사라진다 */
      if(!text && st.o === null) return;
      const last = runs[runs.length - 1];
      if(last && edSame(last.st, st)) last.text += text;
      else runs.push({st, text});
    };
    const visit = node => {
      if(node.nodeType === 3){
        /* 편집기는 줄 끝 공백을 &nbsp; 로 넣는다. 그대로 실으면 노션에
           눈에 보이지 않는 글자가 남는다 */
        push(edState(node.parentElement, root),
             node.nodeValue.replace(/\u00a0/g, ' ').replace(/\u200b/g, ''));
        return;
      }
      if(node.nodeType !== 1) return;
      const d = node.dataset || {};
      /* 불투명 조각은 안을 들여다보지 않는다. 화면에 무엇이 그려져 있든 —
         커스텀 이모지는 그림이다 — 중계 서버에 돌아가는 것은 받은 글 그대로다 */
      if(d.o !== undefined){ push(edState(node, root), d.ot || ''); return; }
      if(node.tagName === 'BR'){ push(edState(node.parentElement, root), '\n'); return; }
      /* 편집기가 만들어 낼 수 있는 덩어리. 줄바꿈으로 받는다 — 그냥 지나치면
         두 줄이 소리 없이 한 줄로 붙는다 */
      if((node.tagName === 'DIV' || node.tagName === 'P') && runs.length){
        push(edState(node.parentElement, root), '\n');
      }
      for(const kid of node.childNodes) visit(kid);
    };
    for(const kid of root.childNodes) visit(kid);

    /* 편집기는 마지막 줄이 보이게 하려고 끝에 가짜 <br> 를 넣는다. 그것까지
       실으면 저장할 때마다 빈 줄이 하나씩 늘어난다. 기준선도 같은 길로
       만들므로, 이 손질 때문에 고치지 않은 줄이 고쳐진 것으로 잡히지는 않는다 */
    const tail = runs[runs.length - 1];
    if(tail && tail.st.o === null){
      tail.text = tail.text.replace(/\n+$/, '');
      if(!tail.text) runs.pop();
    }

    let out = '';
    for(const r of runs){
      const st = r.st;
      if(st.o !== null){
        out += `<span data-o="${esc(st.o)}">${edEscText(r.text)}</span>`;
        continue;
      }
      let h = edEscText(r.text);
      if(st.code) h = `<code>${h}</code>`;
      if(st.underline) h = `<u>${h}</u>`;
      if(st.italic) h = `<em>${h}</em>`;
      if(st.strike) h = `<s>${h}</s>`;
      if(st.bold) h = `<strong>${h}</strong>`;
      if(st.color && st.color !== 'default') h = `<span data-c="${esc(st.color)}">${h}</span>`;
      if(st.href) h = `<a href="${esc(st.href)}">${h}</a>`;
      out += h;
    }
    return out;
  }

  /* 불투명 조각의 본디 글. textContent 로는 안 된다 — 조각의 글에 줄바꿈이
     있으면 <br> 로 실려 오는데 textContent 는 그것을 지운다. 지워진 채로
     돌려보내면 중계 서버가 「손대어졌다」며 그 줄을 영영 거절한다 */
  function edPlain(el){
    let out = '';
    el.childNodes.forEach(n => {
      if(n.nodeType === 3) out += n.nodeValue;
      else if(n.nodeType === 1) out += n.tagName === 'BR' ? '\n' : edPlain(n);
    });
    return out;
  }

  /* 편집용 HTML 을 항목에 갈아 끼운다. 불투명 조각은 손댈 수 없게 잠그고,
     표시용 HTML 에 있던 커스텀 이모지 그림을 도로 얹는다 — 안 그러면 고치는
     동안만 이모지가 「:도장:」이 되어 보인다 */
  function edPaint(it, html){
    const bin = document.createElement('div');
    bin.innerHTML = it.display;
    const imgs = Array.from(bin.querySelectorAll('img.cem'));

    it.nx.innerHTML = html;
    edSeal(it.nx);
    it.nx.querySelectorAll('[data-o]').forEach(sp => {
      const hit = imgs.findIndex(im => `:${im.alt}:` === sp.dataset.ot);
      if(hit >= 0){ sp.textContent = ''; sp.appendChild(imgs.splice(hit, 1)[0]); }
    });
    it.base = edSerialize(it.nx);
  }

  /**
   * 공지 문서 → 화면이 그릴 수 있는 모양.
   *
   * 빌더가 봉투를 짓는 규칙과 같다(`notice_from_doc`). 다른 것은 **빈 줄을
   * 버리지 않는 것** 하나다 — 담당자가 방금 Enter 로 만든 줄이 그것이고,
   * 화면에서 사라지면 적을 곳이 없어진다.
   */
  function edDocView(doc){
    const items = list => (list || []).map(i => ({
      id: i.id, type: i.type, html: i.html || '',
      checked: i.type === 'todo' ? !!i.checked : null,
      cols: i.type === 'table' ? i.cols : undefined,
      children: items(i.items),
      toggle: i.type === 'toggle' && (i.items || []).length ? true : undefined,
    }));
    return {
      title: doc.title || '', date: doc.date || '',
      sections: (doc.sections || []).map(s => ({
        id: s.id, heading: (s.title || '').trim() || null, items: items(s.items),
      })),
    };
  }

  /** 주소 → 문서 속 그 항목. 화면의 줄에 글을 갈아 끼울 때 짝을 맞춘다 */
  function edDocIndex(doc){
    const map = new Map();
    const walk = list => (list || []).forEach(i => { map.set(i.id, i); walk(i.items); });
    (doc.sections || []).forEach(s => walk(s.items));
    return map;
  }

  /* 지난번에 붙여 둔 자국을 걷어낸다. 안 걷으면 줄을 하나 보태 다시 불러올
     때마다 같은 딱지가 하나씩 늘어난다 */
  function edReset(it){
    it.li.classList.remove('ed-fail');
    it.nx.removeAttribute('contenteditable');
    const mv = it.nx.parentElement.querySelector(':scope>.nx-mv');
    if(mv) mv.remove();
    it.retype = null;
    edRtChip(it);
    edClearNote(it);
  }

  /**
   * 편집을 연다.
   *
   * 처음 한 번은 저장소에서 공지 문서를 받아 **그것으로 화면을 다시 그린다.**
   * 다시 그리면 이 함수가 또 불리는데, 그때는 문서를 이미 들고 있으므로 화면의
   * 줄에 편집용 글을 갈아 끼우는 일만 한다.
   *
   * 손대 둔 것을 지키려 들지 않는다. 화면을 다시 그리는 길은 `go` 하나뿐이고,
   * 그 앞에 「저장하지 않고 떠나시겠습니까」가 서 있다.
   */
  async function edLoad(){
    if(!document.getElementById('edbar')) return;

    if(!edLoaded){
      edStatus('공지를 불러오는 중…');
      let doc = null;
      try { doc = await ED.call('GET', '/notice/doc?slug=' + encodeURIComponent(CLIENT)); }
      catch(e){
        if(e.status !== 404){
          edMsg(edErr(e, '공지를 불러오지 못했습니다'), true);
          edStatus('불러오지 못했습니다 — 편집 모드를 껐다 켜 주세요');
          return;
        }
        /* 공지가 한 건도 없는 기업이다. 실패가 아니라 만들어야 할 까닭이다 */
      }
      edLoaded = true;
      edDoc = doc;
      /* 저장소의 문서로 화면을 다시 그린다. 봉투로 그린 화면은 지난 빌드의
         것이라, 그 위에서 고쳐 저장하면 그 사이에 저장된 줄이 사라진다 */
      notice = doc ? edDocView(doc) : null;
      edForgetAll();
      go('notice');
      return;
    }

    /* 화면은 방금 그려졌고 장부는 비어 있다 — `go` 가 함께 버린다. 그래서
       여기서 하는 일은 지금 화면에 있는 줄을 장부에 올리는 것뿐이다 */
    const next = new Map();
    /* 표의 칸도 장부에 올린다. 줄이 아니라 `td` 지만, 고치고 · 자국을 붙이고 ·
       저장에 실어 보내는 일은 줄과 똑같다 */
    document.querySelectorAll(ED_ROWS).forEach(li => {
      const nx = li.querySelector(':scope>.nx, :scope>.tgh>.nx');
      if(!nx) return;
      /* 처음 그려진 **표시용** HTML 을 지켜 둔다. 곧 편집용으로 갈아 끼우므로
         지금 아니면 커스텀 이모지 그림을 꺼내 올 곳이 없어진다 */
      next.set(li.dataset.nid, edItem(li, nx, {display: nx.innerHTML}));
    });
    edItems = next;

    edSecsLoad();

    if(!edDoc){
      /* 공지가 없다. 「＋ 새 공지」만이 할 일이다 */
      edStatus('공지가 없습니다 — 「＋ 새 공지」로 만들어 주세요');
      return;
    }
    const index = edDocIndex(edDoc);
    edTitleOpen(edDoc.title || '');
    edItems.forEach((it, id) => edOpen(it, index.get(id)));
    edSeedLines();
    edMvSync();
    edStatus();
  }

  /**
   * 줄이 하나도 없는 칸에 빈 줄 하나를 세운다.
   *
   * 노션은 빈 페이지를 열어도 **커서가 놓일 자리가 이미 있다.** 여기는
   * 「＋ 줄 추가」를 눌러야 적을 곳이 생겨, 담당자가 처음 보는 것이 글이
   * 아니라 서식이었다.
   *
   * 커서를 빼앗지 않는다(`quiet`) — 「＋ 새 공지」 직후에는 커서가 제목에
   * 가 있어야 하고, 접어 둔 칸에 커서를 두면 보이지 않는 곳에서 글이 써진다.
   * 이 빈 줄은 저장에 나가지도, 「바뀐 것」으로 세지도 않는다.
   */
  function edSeedLines(){
    document.querySelectorAll('.notice[data-nsec]').forEach(box => {
      if(box.querySelector('li[data-nid]')) return;
      const list = sectionList(box.querySelector(':scope>.bd'));
      if(list) edAdd(li => list.appendChild(li), {quiet: true});
    });
  }

  /* 제목 칸에 저장소의 지금 제목을 넣는다. 봉투의 제목은 지난 빌드의 것이고,
     빌더가 빈 제목을 「공지사항」으로 갈아 끼우기까지 해서 그대로 두면
     담당자가 손대지 않은 글자가 저장소에 들어간다.

     손대 둔 제목은 덮지 않는다 */
  function edTitleOpen(text){
    const inp = document.getElementById('ntitle');
    if(!inp) return;
    const now = String(text || '');
    inp.value = now;
    edTitle = {input: inp, base: now};
    inp.oninput = () => edStatus();
    /* 제목은 한 줄이다. Enter 는 **커서를 첫 줄로 내려보낸다** — 제목을 치고
       바로 내용을 적는 것이 노션에서 손이 하는 일이다 */
    inp.onkeydown = e => {
      if(e.isComposing || e.keyCode === 229) return;
      if(e.key === 'Escape'){ e.preventDefault(); inp.blur(); return; }
      if(e.key !== 'Enter') return;
      e.preventDefault();
      const first = document.querySelector('.ck li[data-nid]');
      const it = first && edItems.get(first.dataset.nid);
      if(it && it.nx.isContentEditable) edFocusEnd(it.nx); else inp.blur();
    };
  }

  /** 제목이 손대어졌는가. 화면을 다시 그리면 그 칸은 사라진다 */
  const edTitleDirty = () =>
    !!(edTitle && edTitle.input.isConnected && edTitle.input.value.trim() !== edTitle.base);

  /* 항목 하나를 고칠 수 있게, 또는 왜 못 고치는지 밝히며 잠긴 채로 연다 */
  /**
   * 화면의 한 줄을 편집할 수 있게 연다.
   *
   * **잠기는 줄이 없다.** 노션이 쓰기를 받지 않던 것이 없어졌으므로 그 개념
   * 자체가 함께 사라졌다. 화면이 문서로 그려졌으니 짝이 없는 줄도 없다.
   */
  function edOpen(it, node){
    edReset(it);
    if(!node) return;
    edPaint(it, node.html || '');
    it.type = node.type || 'bullet';
    if(it.type !== 'cell'){
      it.checked = it.checkBase = node.type === 'todo' && !!node.checked;
      it.home = edWhereKey(it);
      it.moved = false;
    }
    edWire(it);
    if(it.type === 'table'){
      /* 열 때의 격자를 본으로 떠 둔다. 「되돌리기」가 돌아갈 곳이 여기다 */
      const body = it.li.querySelector('tbody');
      it.tbase = body ? body.cloneNode(true) : null;
    }
  }

  /**
   * 줄 하나에 손을 걸어 준다. **글은 손대지 않는다.**
   *
   * 저장소에서 받아 열 때(`edOpen`)와 한 걸음 되돌린 뒤(`edSnapPut`)가 같은
   * 길을 지나야 한다 — 갈라 두면 한쪽만 고쳐지는 날이 오고, 그날 되돌린
   * 화면에서는 단추가 죽어 있다.
   */
  function edWire(it){
    it.nx.contentEditable = 'true';
    it.nx.spellcheck = false;
    /* 표의 칸은 줄이 아니다. 옮기지도, 종류를 바꾸지도, 혼자 지워지지도
       않는다 — 표가 그것을 데리고 다닌다 */
    if(it.type === 'cell'){ edBindCell(it); return; }
    edBindItem(it);
    edMvBox(it);
    if(it.type === 'table'){ edTableBind(it); return; }
    /* 표에는 안내 글자를 띄우지 않는다. 글 칸이 비어 있는 것이 정상이고,
       비었다고 「보탬」 표시를 걷으면 새로 세운 표가 눈에 띄지 않는다 */
    edHint(it);
  }

  /* 폭 없는 글자. 서식 조각 바로 다음에 커서를 세우려고 놓는다 —
     화면에 보이지 않고 저장에도 실리지 않는다 */
  const ED_ZW = '\u200b';

  /* 글이 하나도 없는 줄. 노션 전용 조각과 그림은 글이 없어도 내용이다 */
  const edEmpty = nx =>
    !nx.textContent.replace(/\u200b/g, '').trim() && !nx.querySelector('[data-o],img');

  /* 빈 줄임을 표시해 둔다. 커서가 놓였거나 칸에 하나뿐인 빈 줄에만 안내
     글자가 뜨는데, 그 자리를 CSS 가 알아보려면 클래스가 있어야 한다 —
     `:empty` 로는 안 된다. 편집기가 빈 줄에도 <br> 를 남기기 때문이다 */
  function edHint(it){
    const blank = edEmpty(it.nx);
    it.nx.classList.toggle('ed-hint', blank);
    /* 아직 아무것도 쓰지 않은 줄에는 「보탰다」 표시를 붙이지 않는다. 열자마자
       세워 주는 빈 줄까지 초록 줄이 그이면, 손대지도 않고 무언가 한 것이 된다 */
    it.li.classList.toggle('ed-blank', blank);
  }

  /* 이 줄이 그 칸에 하나뿐인가. 하나뿐인 빈 줄은 걷지 않는다 — 걷으면
     적을 곳이 없어진다 */
  const edLone = li => (li.closest('.notice') || document)
    .querySelectorAll('li[data-nid]').length === 1;

  /* 커서를 그 줄 끝으로. 새 줄로 넘어갈 때와 빈 줄을 지우고 돌아올 때 쓴다 */
  function edFocusEnd(nx){
    nx.focus();
    const r = document.createRange();
    r.selectNodeContents(nx);
    r.collapse(false);
    const sel = document.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  }

  /* 커서를 그 줄 처음으로. 줄을 쪼개고 뒤쪽 줄로 넘어갈 때 쓴다 —
     쪼갠 자리가 곧 커서 자리여야 손이 멈추지 않는다 */
  function edFocusStart(nx){
    nx.focus();
    const r = document.createRange();
    r.selectNodeContents(nx);
    r.collapse(true);
    const sel = document.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  }

  /**
   * 노션에서만 만들 수 있는 조각을 잠근다.
   *
   * 글을 갈아 끼우는 곳마다 불러야 한다 — 줄을 쪼개거나 합치면 그 조각이
   * 새 칸으로 건너가는데, 잠그지 않으면 담당자가 그 안을 고칠 수 있게 되고
   * 중계 서버는 「손대어졌다」며 그 줄을 통째로 거절한다.
   */
  function edSeal(nx){
    nx.querySelectorAll('[data-o]').forEach(sp => {
      sp.dataset.ot = edPlain(sp);
      sp.className = 'ed-o';
      sp.contentEditable = 'false';
      sp.title = '노션에서만 만들 수 있는 조각입니다 — 그대로 남습니다';
    });
  }

  /* ── 커서 ──
     노션이 쉬운 까닭은 기능이 많아서가 아니라 **키보드가 글에서 떠나지 않기**
     때문이다. 줄 하나하나가 따로 떨어진 입력칸이라 그냥 두면 ↑ ↓ 가 그 줄
     안에서만 움직이고, 담당자는 줄마다 마우스로 찍어야 한다. 아래 셋이
     그 벽을 없앤다 — 지금 커서가 줄의 끝 줄에 있는가, 이웃 줄은 어디인가,
     그 줄의 같은 가로 자리는 어디인가. */

  /** 지금 커서의 네모. 없으면 null — 커서가 이 화면에 없다는 뜻이다 */
  function edCaretRect(){
    const sel = document.getSelection();
    if(!sel || !sel.rangeCount) return null;
    const r = sel.getRangeAt(0).cloneRange();
    const box = r.getClientRects()[0];
    if(box) return box;
    /* 빈 줄에는 잴 네모가 없다. 그 자리에 빈 글자를 잠깐 놓아 재고 걷는다 */
    const probe = document.createElement('span');
    probe.textContent = '​';
    r.insertNode(probe);
    const at = probe.getBoundingClientRect();
    const keep = {x: at.left, top: at.top, bottom: at.bottom, left: at.left};
    probe.remove();
    return keep;
  }

  /** 커서가 이 칸의 첫 줄(위) · 끝 줄(아래)에 닿아 있는가 */
  function edAtEdge(nx, dir){
    const at = edCaretRect();
    if(!at) return true;
    const box = nx.getBoundingClientRect();
    /* 한 줄 높이의 절반을 자로 쓴다. 글자 크기가 달라도 함께 따라간다 */
    const half = Math.max(4, (at.bottom - at.top) / 2);
    return dir === 'up' ? at.top - box.top < half : box.bottom - at.bottom < half;
  }

  /**
   * 그 칸의 같은 가로 자리에 커서를 놓는다.
   *
   * 늘 줄 끝으로 보내지 않는 까닭은, 문단 가운데를 고치다 ↓ 를 눌렀을 때
   * 커서가 저 멀리 끝으로 튀면 다시 찾아 와야 하기 때문이다.
   */
  function edCaretTo(nx, dir, x){
    nx.focus();
    const box = nx.getBoundingClientRect();
    const half = Math.max(4, box.height / 4);
    const y = dir === 'up' ? box.bottom - half : box.top + half;
    const hit = document.caretRangeFromPoint
      ? document.caretRangeFromPoint(x, y)
      : (document.caretPositionFromPoint ? (() => {
          const p = document.caretPositionFromPoint(x, y);
          if(!p) return null;
          const r = document.createRange();
          r.setStart(p.offsetNode, p.offset);
          return r;
        })() : null);
    /* 짚지 못했거나 남의 칸을 짚었으면 그 줄 끝으로. 빈 줄이 그렇다 */
    if(!hit || !nx.contains(hit.startContainer)){ edFocusEnd(nx); return; }
    hit.collapse(true);
    const sel = document.getSelection();
    sel.removeAllRanges();
    sel.addRange(hit);
  }

  /**
   * 커서 자리를 지킨 채로 그 줄을 움직인다.
   *
   * DOM 에서 옮기면 브라우저가 초점을 거둔다. 그대로 두면 **방금 보탠 빈 줄이
   * `onblur` 에 걷혀 사라지고**, 담당자는 Tab 한 번에 쓰던 줄을 잃는다.
   */
  function edKeepCaret(nx, run){
    const at = edOffset(nx);
    edHolding = true;
    try { run(); } finally { edHolding = false; }
    nx.focus();
    edSeek(nx, at);
  }

  /** 옮기는 중인가. 그동안의 `onblur` 는 못 본 척한다 */
  let edHolding = false;

  /** 커서가 이 칸의 몇 글자째에 있는가 */
  function edOffset(nx){
    const sel = document.getSelection();
    if(!sel || !sel.rangeCount || !nx.contains(sel.anchorNode)) return null;
    const r = sel.getRangeAt(0).cloneRange();
    r.selectNodeContents(nx);
    r.setEnd(sel.anchorNode, sel.anchorOffset);
    return r.toString().length;
  }

  /** 그 글자 수만큼 들어간 자리에 커서를 놓는다 */
  function edSeek(nx, at){
    if(at === null || at === undefined){ edFocusEnd(nx); return; }
    const walk = document.createTreeWalker(nx, NodeFilter.SHOW_TEXT);
    let left = at, node = null;
    while(walk.nextNode()){
      node = walk.currentNode;
      if(left <= node.nodeValue.length) break;
      left -= node.nodeValue.length;
    }
    if(!node){ edFocusEnd(nx); return; }
    const r = document.createRange();
    r.setStart(node, Math.min(left, node.nodeValue.length));
    r.collapse(true);
    const sel = document.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  }

  /** 줄 처음부터 커서까지의 글. 커서가 이 칸에 없으면 null */
  function edBefore(nx){
    const sel = document.getSelection();
    if(!sel || !sel.rangeCount || !nx.contains(sel.anchorNode)) return null;
    const r = document.createRange();
    r.selectNodeContents(nx);
    r.setEnd(sel.anchorNode, sel.anchorOffset);
    return r.toString();
  }

  /** 줄 처음부터 커서까지의 글. 그 앞이 비어 있을 때만 종류 단축으로 읽는다 */
  function edHead(nx){
    const at = edOffset(nx);
    if(!at) return '';
    const head = edBefore(nx);
    /* 커서 앞이 곧 줄 전체일 때만이다. 문장 가운데에서 「>」를 치고 빈칸을
       누르는 것까지 종류 바꾸기로 읽으면 글을 쓸 수가 없다 */
    return head !== null && head.length === at ? head : '';
  }

  /**
   * 커서 바로 앞 글자 n 개를 걷는다. `/` 로 부른 목록에서 하나를 골랐을 때
   * 쳐 두었던 「/할」을 지우는 일이 이것이다.
   *
   * 자리를 재어 범위를 만들지 않고 편집기에게 한 글자씩 물리라고 시킨다 —
   * 줄바꿈이 든 줄에서 글자 수와 노드 속 자리가 어긋나는 것을 피한다.
   */
  function edCutBack(n){
    for(let i = 0; i < n; i += 1) document.execCommand('delete');
  }

  /** 줄 앞의 그 글자들을 걷는다 */
  function edCutHead(nx, n){
    const r = document.createRange();
    r.selectNodeContents(nx);
    const sel = document.getSelection();
    r.setEnd(sel.anchorNode, sel.anchorOffset);
    r.setStart(nx, 0);
    r.deleteContents();
    const put = document.createRange();
    put.setStart(nx, 0);
    put.collapse(true);
    sel.removeAllRanges();
    sel.addRange(put);
  }

  /** 화면에서 이웃한, 글을 고칠 수 있는 줄. 안에 든 줄과 다음 칸까지 넘어간다 */
  function edNextEditable(li, dir){
    const all = [...document.querySelectorAll('.ck li[data-nid]')];
    const at = all.indexOf(li);
    if(at < 0) return null;
    const step = dir === 'up' ? -1 : 1;
    for(let i = at + step; i >= 0 && i < all.length; i += step){
      /* 접어 둔 토글 안은 건너뛴다. 보이지 않는 줄에 커서를 두면 담당자는
         글자가 어디로 갔는지 알 수 없다 */
      if(!all[i].offsetParent) continue;
      const it = edItems.get(all[i].dataset.nid);
      if(it && !it.del && it.nx.isContentEditable) return it;
    }
    return null;
  }

  /* 바로 위에 있는 고칠 수 있는 줄. Backspace 로 빈 줄을 지운 뒤 갈 곳이다 */
  function edPrev(li){
    for(let sib = li.previousElementSibling; sib; sib = sib.previousElementSibling){
      if(!sib.matches('li[data-nid]')) continue;
      const it = edItems.get(sib.dataset.nid);
      if(it && !it.del && it.nx.isContentEditable) return it;
    }
    return null;
  }

  /* ── 칸(섹션) ──
     칸은 제목 하나와 줄 묶음이다. 담당자가 여기서 만들고, 이름을 고치고,
     지우고, 순서를 바꾼다. 줄과 마찬가지로 **저장을 눌러야** 나간다 —
     저장이 화면을 걸어 다니며 문서를 다시 지으므로, 화면의 차례가 곧 문서의
     차례이고 화면에서 지운 칸은 문서에서 사라진다. */

  /** 지금 화면의 칸들을 장부에 올린다. 줄의 장부와 같이 언제나 새로 짓는다 */
  function edSecsLoad(){
    const next = new Map();
    document.querySelectorAll('.notice').forEach(box => {
      const id = box.dataset.nsec;
      if(id === undefined) return;                 /* 편집 모드가 아닌 상자 */
      const nsx = box.querySelector(':scope>h3>[data-nsx]');
      if(!nsx) return;
      const sec = {box, nsx, base: nsx.textContent.trim(),
                   home: edSecWhere(box), moved: false, isNew: false, del: false};
      next.set(id, sec);
      edSecBind(sec);
    });
    edSecs = next;
    edSecSync();
  }

  /** 이 칸이 지금 앉은 자리. 바로 위 칸의 주소, 맨 위면 `first` */
  function edSecWhere(box){
    const up = edSecSib(box, 'up');
    return up ? up.dataset.nsec : 'first';
  }

  function edSecSib(box, dir){
    const step = b => (dir === 'up' ? b.previousElementSibling : b.nextElementSibling);
    for(let b = step(box); b; b = step(b)){
      if(b.matches('.notice')) return b;
    }
    return null;
  }

  const edSecOf = el => {
    const box = el.closest('.notice');
    return box ? edSecs.get(box.dataset.nsec) : null;
  };

  /** 그 칸 안에 든 줄의 수. 지울 때 무엇이 함께 가는지 말해 주려고 센다 */
  const edSecLines = box => box.querySelectorAll('li[data-nid]').length;

  /** 눌러서 옮겨 놓았고, 아직 제자리로 돌아오지 않았는가.
      옮긴 칸만 센다 — 옆 칸의 자리도 함께 바뀌지만 담당자가 손댄 것은 하나다 */
  const edSecMoved = sec => !!(sec.moved && edSecWhere(sec.box) !== sec.home);

  const edSecDirty = sec =>
    sec.isNew || sec.del || sec.nsx.textContent.trim() !== sec.base || edSecMoved(sec);

  function edSecBind(sec){
    const {box, nsx} = sec;
    nsx.contentEditable = 'true';
    nsx.spellcheck = false;
    /* 제목을 누르면 커서만 간다. 그대로 두면 머리말이 접혀 안엣줄이 사라진다 */
    nsx.onclick = e => e.stopPropagation();
    nsx.oninput = () => { edSecSync(); edStatus(); };
    /* 칸 이름은 한 줄이다. Enter 는 줄을 만드는 대신 **커서를 그 칸의 첫
       줄로 내려보낸다** — 이름을 붙이고 나면 다음에 할 일이 그것이라,
       노션에서 제목을 치고 Enter 를 누르는 것과 같은 손놀림이다 */
    nsx.onkeydown = e => {
      if(e.isComposing || e.keyCode === 229) return;
      if(e.key === 'Escape'){ e.preventDefault(); nsx.blur(); return; }
      if(e.key !== 'Enter') return;
      e.preventDefault();
      const first = box.querySelector('li[data-nid]');
      const it = first && edItems.get(first.dataset.nid);
      if(it && it.nx.isContentEditable) edFocusEnd(it.nx); else nsx.blur();
    };
    box.querySelectorAll(':scope>h3>.ns-mv [data-nsmv]').forEach(b => {
      b.onclick = e => { e.stopPropagation(); edSecMove(sec, b.dataset.nsmv); };
    });
    const del = box.querySelector(':scope>h3>.ns-mv [data-nsdel]');
    if(del) del.onclick = e => { e.stopPropagation(); edSecDel(sec); };
  }

  /** 지금 무엇을 누를 수 있는지. 칸 하나가 움직이면 이웃도 함께 바뀐다 */
  function edSecSync(){
    edSecs.forEach(sec => {
      const mv = sec.box.querySelector(':scope>h3>.ns-mv');
      if(!mv) return;
      mv.querySelector('[data-nsmv="up"]').disabled = sec.del || !edSecSib(sec.box, 'up');
      mv.querySelector('[data-nsmv="down"]').disabled = sec.del || !edSecSib(sec.box, 'down');
      const del = mv.querySelector('[data-nsdel]');
      del.textContent = sec.del ? '↺' : '✕';
      del.title = sec.del ? '지우기를 물린다' : '이 칸 지우기';
      sec.box.classList.toggle('ed-secdel', sec.del);
      sec.box.classList.toggle('ed-dirty', edSecDirty(sec) && !sec.del);
      sec.nsx.contentEditable = sec.del ? 'false' : 'true';
    });
  }

  function edSecMove(sec, dir){
    edMark();
    const sib = edSecSib(sec.box, dir);
    if(!sib) return;
    sec.box.parentElement.insertBefore(
      sec.box, dir === 'up' ? sib : sib.nextElementSibling);
    sec.moved = true;
    sec.box.scrollIntoView({block: 'nearest'});
    edSecSync();
    edStatus();
  }

  /**
   * 칸을 지운다. **안에 든 줄도 함께 간다** — 무엇이 딸려 가는지 먼저 말한다.
   *
   * 저장 전까지는 그어진 채로 남아 그 자리에서 물릴 수 있다. 줄을 지울 때와
   * 같은 규칙이다.
   */
  function edSecDel(sec){
    edMark();
    if(sec.del){                                   /* 물리기 */
      sec.del = false;
      edSecSync();
      edStatus();
      return;
    }
    if(sec.isNew){ edSecForget(sec); return; }
    const n = edSecLines(sec.box);
    const name = sec.nsx.textContent.trim() || '(이름 없는 칸)';
    if(!confirm(`이 칸을 지웁니다.\n\n${name}` +
                (n ? `\n\n안에 든 ${n}줄도 함께 지워집니다.` : '') +
                '\n\n「저장」을 눌러야 실제로 사라집니다.')) return;
    sec.del = true;
    edSecSync();
    edStatus();
  }

  /** 옮긴 칸을 제자리로. 제자리를 찾지 못하면 false 다 */
  function edSecUndo(sec){
    const home = sec.home;
    if(home === 'first'){
      const first = document.querySelector('.notice');
      if(!first) return false;
      first.parentElement.insertBefore(sec.box, first);
    } else {
      const ref = document.querySelector(`.notice[data-nsec="${home}"]`);
      if(!ref || ref === sec.box) return false;
      ref.parentElement.insertBefore(sec.box, ref.nextElementSibling);
    }
    sec.moved = false;
    edSecSync();
    return true;
  }

  /** 만들어만 두고 쓰지 않은 칸을 걷는다. 저장에는 나가지 않는다 */
  function edSecForget(sec){
    sec.box.querySelectorAll('li[data-nid]').forEach(li => {
      const it = edItems.get(li.dataset.nid);
      if(it) edForget(it);
    });
    edSecs.delete(sec.box.dataset.nsec);
    sec.box.remove();
    edSecEnsure();
    edSecSync();
    edStatus();
  }

  /**
   * 칸이 하나도 남지 않았으면 빈 칸 하나를 세워 둔다.
   *
   * 마지막 칸을 지우고 나면 줄을 적을 곳이 통째로 사라진다 — 갓 만든 공지에
   * 빈 칸 하나를 세워 주는 것과 같은 까닭이다.
   */
  function edSecEnsure(){
    if(!document.getElementById('edbar')) return;
    if(document.querySelector('.notice')) return;
    edSecAdd();
  }

  /** 빈 칸 하나를 세우고 커서를 이름으로 보낸다 */
  function edSecAdd(){
    edMark();
    const bar = document.querySelector('.nsadd');
    if(!bar) return;
    edSecSeq += 1;
    const box = document.createElement('div');
    box.className = 'notice open ed-new';
    box.dataset.nsec = `new-s${edSecSeq}`;
    box.innerHTML = `<h3><i class="tw">▸</i><span class="nsx" data-nsx></span>
      <span class="ns-mv">
        <button data-nsmv="up" title="칸을 위로">↑</button>
        <button data-nsmv="down" title="칸을 아래로">↓</button>
        <button data-nsdel title="이 칸 지우기">✕</button>
      </span></h3><div class="bd">
      <ul class="ck"></ul>
      <div class="ntail" data-ntail></div>
      </div>`;
    bar.parentElement.insertBefore(box, bar);
    const nsx = box.querySelector('[data-nsx]');
    const sec = {box, nsx, base: '', home: edSecWhere(box), isNew: true, del: false};
    edSecs.set(box.dataset.nsec, sec);
    edSecBind(sec);
    bindNoticeBox(box);
    edSeedLines();               /* 세우자마자 적을 자리가 있어야 한다 */
    box.scrollIntoView({block: 'nearest'});
    edFocusEnd(nsx);
    edSecSync();
    edStatus();
    return sec;
  }

  /* ── 옮기기 · 들여쓰기 · 종류 바꾸기 ──
     **화면에서 옮기면 그것으로 끝이다.** 저장이 화면을 걸어 다니며 문서를 다시
     지으므로, 옮기기는 배열의 원소를 옮기는 일이고 종류 바꾸기는 값 하나를
     고치는 일이다. 안에 든 줄이 몇 개든 상관없고, 그 줄의 주소도 바뀌지 않는다.

     예전에는 둘 다 「지우고 다시 만들기」였다 — 노션에 블록을 옮기는 창구도
     종류를 바꾸는 창구도 없었기 때문이다(ADR 0003). 원본이 저장소로 오면서
     그 제약이 통째로 사라졌다(ADR 0004). */

  /** 글이 아니라 자리와 종류를 손댄 것. 「되돌리기」가 이 둘만 다르게 물린다 */
  const edStruct = op => op === 'move' || op === 'retype';

  /** 그 줄 안의 목록. 없으면 세운다 — 들여쓴 줄이 갈 곳이다 */
  function edSubList(li){
    let sub = li.querySelector(':scope>ul');
    if(!sub){ sub = document.createElement('ul'); li.appendChild(sub); }
    return sub;
  }

  /** 화면에서 이웃한 줄 */
  function edSib(li, dir){
    const step = s => (dir === 'up' ? s.previousElementSibling : s.nextElementSibling);
    for(let s = step(li); s; s = step(s)){
      if(s.matches('li[data-nid]')) return s;
    }
    return null;
  }

  /** 이 줄을 품고 있는 줄 */
  const edParentLi = li => li.parentElement.closest('li[data-nid]');

  /**
   * 이 줄이 지금 앉은 자리 — 「이 줄 다음」 · 「이 줄 앞」 · 「이 줄 안」.
   *
   * 저장에 실려 나가지 않는다. 자리는 화면의 차례가 그대로 문서의 차례가
   * 되므로 따로 짚을 것이 없다. 여기서 재는 것은 **옮겼는가** 하나뿐이다 —
   * 처음 앉았던 자리와 견주어 저장 창구가 「1줄 옮김」을 센다.
   */
  function edWhere(li){
    const near = edSib(li, 'up');
    if(near) return {after: near.dataset.nid};
    const next = edSib(li, 'down');
    if(next) return {before: next.dataset.nid};
    const up = edParentLi(li);
    return up ? {into: up.dataset.nid} : null;
  }
  const edWhereKey = it => JSON.stringify(edWhere(it.li));

  /** 눌러서 옮겨 놓았고, 아직 제자리로 돌아오지 않았는가 */
  const edMoved = it => !!(it.moved && edWhereKey(it) !== it.home);

  /** 화면에서 한 칸 옮긴다. **저장소에는 나가지 않는다** — 저장이 함께 내보낸다 */
  function edMove(it, dir, quiet){
    edMark();
    const li = it.li;
    if(dir === 'up' || dir === 'down'){
      const sib = edSib(li, dir);
      if(!sib) return;
      li.parentElement.insertBefore(li, dir === 'up' ? sib : sib.nextSibling);
    } else if(dir === 'in'){
      const sib = edSib(li, 'up');
      if(!sib) return;
      edSubList(sib).appendChild(li);
    } else {
      const up = edParentLi(li);
      if(!up) return;
      up.parentElement.insertBefore(li, up.nextSibling);
    }
    edSettle(it, !quiet);
  }

  /* 옮기고 난 뒤 장부와 화면을 맞춘다. 손으로 끌어 옮긴 것과 단추로 옮긴 것이
     같은 자리를 지나가게 한다 — 갈라 두면 한쪽만 고쳐지는 날이 온다 */
  function edSettle(it, scroll){
    it.moved = true;
    it.li.classList.toggle('ed-moved', edMoved(it));
    edTrimLists();
    if(scroll) it.li.scrollIntoView({block: 'nearest'});
    edMvSync();
    edStatus();
  }

  /* ── 끌어서 옮기기 ──
     줄 왼쪽에 마우스를 얹으면 나오는 손잡이를 잡아 끈다. 단추로도 되고
     키보드로도 되지만, 여러 칸을 한 번에 옮길 때는 이것이 가장 빠르다.

     끌어다 놓는 자리는 **가리킨 줄의 위나 아래, 그 줄과 같은 깊이**다.
     가로 자리로 깊이까지 정하지 않는다 — 놓을 자리가 두 가지 뜻을 갖는
     순간 담당자는 어디에 떨어질지 모른 채 손을 놓게 된다. 깊이는 Tab 이다. */
  let edDrag = null;      /* 지금 끌고 있는 줄 */
  let edDrop = null;      /* {li, after} — 지금 가리키는 자리 */

  function edDropMark(li, after){
    if(edDrop) edDrop.li.classList.remove('ed-dropup', 'ed-dropdn');
    edDrop = li ? {li, after} : null;
    if(edDrop) li.classList.add(after ? 'ed-dropdn' : 'ed-dropup');
  }

  /** 끌기를 끝낸다. 놓았든 물렀든 자국을 남기지 않는다 */
  function edDragEnd(){
    if(edDrag) edDrag.li.classList.remove('ed-dragging');
    edDrag = null;
    edDropMark(null);
  }

  /**
   * 끌어다 놓을 수 있는 자리인가. 낼 수 있는 답은 하나뿐이라 여기서 다 본다.
   *
   * **제 안으로는 못 들어간다.** 줄이 제 자손 밑으로 가면 그 줄과 딸린 것이
   * 화면에서 통째로 사라진다.
   */
  function edDropAt(e){
    if(!edDrag) return null;
    const el = e.target && e.target.nodeType === 1 ? e.target : (e.target || {}).parentElement;
    const li = el && el.closest('.ck li[data-nid]');
    if(!li || li === edDrag.li || edDrag.li.contains(li)) return null;
    /* 접어 둔 칸이나 접힌 토글 안은 자리로 쳐 주지 않는다. 보이지 않는 줄
       옆에 떨어뜨리면 담당자는 방금 옮긴 줄이 어디로 갔는지 알 수 없다 */
    if(!li.offsetParent) return null;
    const it = edItems.get(li.dataset.nid);
    if(!it || it.del) return null;
    const box = li.getBoundingClientRect();
    /* 안에 든 줄이 있으면 그 줄만의 높이로 잰다. 통째로 재면 위쪽 절반이
       자식들 몫까지 먹어, 바로 아래에 놓으려 해도 위로만 붙는다 */
    const head = li.querySelector(':scope>ul');
    const bottom = head ? head.getBoundingClientRect().top : box.bottom;
    return {li, after: e.clientY > (box.top + bottom) / 2};
  }

  /* 화면 전체에 한 번만 건다. 줄은 저장할 때마다 새로 나므로 줄마다 걸면
     걸어 둔 것이 남아 쌓인다 */
  function edDragWire(){
    if(edDragWired) return;
    edDragWired = true;
    document.addEventListener('dragover', e => {
      const at = edDropAt(e);
      if(!at){ edDropMark(null); return; }
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      edDropMark(at.li, at.after);
    });
    document.addEventListener('drop', e => {
      const at = edDropAt(e);
      const it = edDrag;
      edDragEnd();
      if(!at || !it) return;
      e.preventDefault();
      edMark();
      at.li.parentElement.insertBefore(it.li, at.after ? at.li.nextSibling : at.li);
      edSettle(it);
    });
    document.addEventListener('dragend', edDragEnd);
  }
  let edDragWired = false;

  /* 마지막 줄을 밖으로 내면 빈 목록이 남는다. 그대로 두면 다음 들여쓰기가
     그 빈 껍데기 안으로 들어가 화면에만 한 겹이 더 생긴다 */
  function edTrimLists(){
    document.querySelectorAll('.ck li>ul').forEach(ul => {
      if(!ul.querySelector(':scope>li')) ul.remove();
    });
  }

  /** 줄의 종류. 공지 문서가 싣는 여섯 가지다 */
  const ED_TYPES = [['bullet','글머리'], ['number','번호'], ['todo','할 일'],
                    ['paragraph','본문'], ['quote','인용'], ['toggle','토글'],
                    ['heading1','제목 1'], ['heading2','제목 2'], ['heading3','제목 3'],
                    ['code','코드']];

  /**
   * 줄 앞에서 이것을 치고 빈칸을 누르면 그 종류가 된다.
   *
   * **노션과 같은 글자다.** 담당자가 이미 손에 익힌 것이라 새로 배울 것이
   * 없다 — 그것이 이 표의 값어치 전부다. 숫자는 아무거나 받는다(`1.` `3.`).
   */
  const ED_MD = {'-':'bullet', '*':'bullet', '+':'bullet',
                 '[]':'todo', '[ ]':'todo', '[x]':'todo', '>':'toggle', '"':'quote',
                 '#':'heading1', '##':'heading2', '###':'heading3'};
  const edMdKind = (head) => ED_MD[head] || (/^\d+\.$/.test(head) ? 'number' : null);

  /**
   * `Ctrl+Shift+숫자` 로 바꿀 종류. **노션과 같은 짝이다** — 담당자가 이미
   * 손에 익힌 것이라 새로 외울 것이 없다.
   *
   * 노션의 9(새 페이지)는 여기 없다. 공지 안에 페이지라는 것이 없다.
   * 인용에는 노션에도 숫자가 없어 `" ` 와 `/` 로만 간다.
   */
  const ED_NUM = {0: 'paragraph', 1: 'heading1', 2: 'heading2', 3: 'heading3',
                  4: 'todo', 5: 'bullet', 6: 'number', 7: 'toggle', 8: 'code'};

  /**
   * 눌린 키가 숫자 단축키인가. `e.key` 가 아니라 `e.code` 를 본다 —
   * Shift 를 쥐면 `1` 이 `!` 로 오고, 자판마다 그 글자가 다르다.
   */
  function edNumKind(e){
    if(!(e.ctrlKey || e.metaKey) || !e.shiftKey || e.altKey) return null;
    const hit = /^(?:Digit|Numpad)(\d)$/.exec(e.code || '');
    return hit ? (ED_NUM[hit[1]] || null) : null;
  }

  /**
   * 종류를 바꾼다. 고르개를 돌렸을 때와 `/` 로 골랐을 때가 여기로 모인다.
   *
   * **보탠 줄에는 딱지를 붙이지 않는다.** 되돌아갈 본디 종류가 없어 「무엇에서
   * 무엇으로」가 성립하지 않는다 — 그 줄은 그냥 그 종류다.
   */
  function edRetype(it, kind){
    edMark();
    if(it.isNew){ it.type = kind; it.retype = null; }
    else it.retype = kind === it.type ? null : kind;
    edSkin(it);
    edRtChip(it);
    edMvSync();
    edStatus();
  }

  /**
   * 바꾼 종류대로 그 줄을 그 자리에서 다시 입힌다.
   *
   * 예전에는 화면을 그대로 두고 딱지만 붙였다. 그러면 담당자는 「번호」를
   * 골라 놓고도 점이 찍힌 줄을 보게 되어, 골라졌는지를 딱지로만 짐작한다.
   * 클라이언트 화면을 그리는 표를 그대로 쓰므로 다음 빌드와 어긋나지 않는다.
   *
   * 안에 든 줄을 접는 토글(`li.tg`)만 건드리지 않는다 — 그 줄은 뼈대가 달라
   * 클래스 한 줄로는 갈아입힐 수 없다. 그 줄에는 딱지가 그대로 남는다.
   */
  function edSkin(it){
    const li = it.li;
    /* 표와 그 칸은 클래스 한 줄로 갈아입힐 수 있는 것이 아니다 — 격자가
       뼈대이고, 종류를 바꿀 수 있는 것도 아니다 */
    if(it.type === 'table' || it.type === 'cell') return;
    if(li.classList.contains('tg')) return;
    const kind = it.retype || it.type;
    const keep = ['ed-new', 'ed-dirty', 'ed-fail', 'ed-del', 'ed-moved']
      .filter(c => li.classList.contains(c));
    /* 체크해 둔 할 일은 체크한 채로. 종류가 할 일에서 떠나면 함께 떨어진다 */
    if(kind === 'todo' && li.classList.contains('on')) keep.unshift('on');
    li.className = [edNewCls(kind), ...keep].join(' ');
  }

  /**
   * 줄 왼쪽의 끌기 손잡이. 노션의 그 자리다.
   *
   * `.nx` 바깥에 둔다 — 안에 두면 고치는 글의 일부가 되어 저장소에 딸려
   * 들어간다. 편집 모드에서만 그려지는 `.notice[data-nsec]` 안에서 목록이
   * 오른쪽으로 밀려나 이 손잡이가 앉을 자리가 난다.
   */
  function edGrab(it){
    if(it.li.querySelector(':scope>.nx-gr')) return;
    edDragWire();
    const g = document.createElement('span');
    g.className = 'nx-gr';
    g.draggable = true;
    g.textContent = '⠿';
    g.title = '끌어서 옮깁니다';
    g.ondragstart = e => {
      edDrag = it;
      it.li.classList.add('ed-dragging');
      e.dataTransfer.effectAllowed = 'move';
      /* 빈 값이라도 실어야 한다. 아무것도 안 실으면 파이어폭스가 끌기를
         시작조차 하지 않는다 */
      e.dataTransfer.setData('text/plain', it.li.dataset.nid);
      e.dataTransfer.setDragImage(it.li, 8, 8);
    };
    it.li.insertBefore(g, it.li.firstChild);
  }

  /* 옮기기 단추와 종류 고르개. 지우기 단추 옆에 함께 둔다 */
  function edMvBox(it){
    edGrab(it);
    const anchor = it.nx.parentElement.querySelector(':scope>.nx-del') || it.nx;
    const box = document.createElement('span');
    box.className = 'nx-mv';
    box.innerHTML = `
      <button data-nmv="up" title="한 칸 위로">↑</button>
      <button data-nmv="down" title="한 칸 아래로">↓</button>
      <button data-nmv="out" title="내어쓰기">⇤</button>
      <button data-nmv="in" title="들여쓰기">⇥</button>`;
    /* **종류 고르개를 두지 않는다.** 종류를 바꾸는 길이 셋이나 되고(`/`,
       줄 앞 글자, Ctrl+Shift+숫자) 전부 손이 글에서 떠나지 않는데, 줄마다
       고르개를 달아 두면 읽는 데 방해가 되기만 한다 */
    box.querySelectorAll('[data-nmv]').forEach(b => {
      b.onclick = e => { e.stopPropagation(); edMove(it, b.dataset.nmv); };
    });
    anchor.parentElement.insertBefore(box, anchor.nextSibling);
    edMvSync();
  }

  /**
   * 지금 무엇을 누를 수 있는지 다시 셈한다. 줄 하나가 움직이면 그 이웃들의
   * 사정도 함께 바뀌므로 통째로 훑는다.
   */
  function edMvSync(){
    edItems.forEach(it => {
      const box = it.nx && it.nx.parentElement.querySelector(':scope>.nx-mv');
      if(!box) return;
      /* 들여쓰면 **바로 위 줄** 안으로 들어간다. 그 줄이 방금 보탠 줄이어도
         상관없다 — 저장이 화면을 걸어 다니며 문서를 짓기 때문에, 화면에
         들어가 있으면 문서에도 들어가 있다 */
      const can = {
        up: !!edSib(it.li, 'up'),
        down: !!edSib(it.li, 'down'),
        in: !!edSib(it.li, 'up'),
        out: !!edParentLi(it.li),
      };
      /* 안에 든 줄이 있어도 막지 않는다. 옮기기가 배열의 원소를 옮기는 일이
         되어 안엣것이 딸려 가는 것이 곧 옳은 결과다. 옮기기와 종류 바꾸기를
         함께 걸어도 된다 — 지우고 다시 만들기가 아니라 값 하나를 고치는
         일이라 서로를 밟지 않는다 */
      box.querySelectorAll('[data-nmv]').forEach(b => {
        b.disabled = it.del || !can[b.dataset.nmv];
      });
    });
  }

  /** 종류의 이름. 모르는 것은 노션이 부르는 대로 둔다 */
  const edTypeName = t => (ED_TYPES.find(([v]) => v === t) || [, t])[1];

  /**
   * 바꾸려는 종류를 그 줄에 적어 둔다 — 「종류 → 번호」.
   *
   * 저장하고 나면 걷는다. 봉투가 종류를 실어 클라이언트 화면이 그 종류대로
   * 그리므로, 바뀐 것은 화면 자체가 말해 준다.
   */
  function edRtChip(it){
    const top = it.nx.closest('.tgh') || it.nx;
    const old = top.parentElement.querySelector(':scope>.ed-rt');
    if(old) old.remove();
    if(!it.retype) return;
    const tag = document.createElement('span');
    tag.className = 'ed-rt';
    tag.textContent = `종류 → ${edTypeName(it.retype)}`;
    top.parentElement.insertBefore(tag, top.nextSibling);
  }

  /**
   * 옮긴 줄을 제자리로, 바꾸려던 종류를 물린다. 저장 전이라 노션은 그대로다.
   *
   * @returns {boolean} 되돌렸는가. 제자리를 찾지 못하면 false 다
   */
  function edUndoOne(it){
    if(it.checked !== it.checkBase){
      it.checked = it.checkBase;
      it.li.classList.toggle('on', it.checked);
    }
    if(it.retype){
      it.retype = null;
      edSkin(it);                 /* 본디 모양으로 돌아온다 */
      edRtChip(it);
    }
    if(it.moved){
      /* 제자리로 돌려놓지 못했으면 「되돌렸다」고 말하지 않는다. 표시를
         걷어 버리면 줄은 옮긴 자리에 남은 채 「바뀐 것 없음」이 된다 */
      if(!edPlaceAt(it.li, it.home ? JSON.parse(it.home) : null)){
        edMsg('제자리를 찾지 못해 그대로 두었습니다 — 저장하면 이 자리로 옮겨집니다', true);
        edMvSync();
        return false;
      }
      it.moved = false;
      edTrimLists();
    }
    it.li.classList.remove('ed-moved', 'ed-fail');
    edMvSync();
    return true;
  }

  /**
   * 적어 둔 자리로 돌려놓는다. 발판이던 줄이 화면에 없으면 그대로 둔다 —
   * 억지로 옮기면 담당자가 놓지 않은 자리에 놓인다.
   *
   * 발판은 사라질 수 있다. 그 줄을 지워 두었으면 화면에 없다.
   *
   * @returns {boolean} 돌려놓았는가
   */
  function edPlaceAt(li, home){
    if(!home) return false;
    const id = home.after || home.before || home.into;
    const ref = document.querySelector(`.ck li[data-nid="${id}"]`);
    if(!ref || ref === li || li.contains(ref)) return false;
    if(home.after) ref.parentElement.insertBefore(li, ref.nextSibling);
    else if(home.before) ref.parentElement.insertBefore(li, ref);
    else edSubList(ref).appendChild(li);
    return true;
  }


  /* ── 노션식 손놀림 ──
     여기까지는 「줄을 보태는 단추」가 있어야 줄이 생겼다. 노션이 자유롭게
     느껴지는 까닭은 단추가 아니라 **글자 치는 일 자체가 구조를 만들기**
     때문이다 — 가운데서 Enter 를 치면 줄이 갈라지고, 줄 처음에서 Backspace
     를 치면 도로 붙고, 붙여넣은 것이 줄 수만큼 줄이 되고, `/` 한 글자가
     종류를 부른다. 아래 넷이 그것이다. */

  /**
   * 줄을 커서 자리에서 쪼갠다. 뒤쪽 글이 새 줄로 내려가고 커서가 따라간다.
   *
   * 종류를 물려준다 — 글머리 가운데서 Enter 를 치면 아랫동강도 글머리다.
   * **안에 든 줄은 윗동강에 남는다.** 노션이 그러하고, 그러지 않으면 딸린
   * 줄들이 방금 만든 아랫동강 밑으로 통째로 끌려간다.
   */
  function edSplit(it){
    const nx = it.nx;
    const kind = it.retype || it.type || 'bullet';
    const below = li => it.li.parentElement.insertBefore(li, it.li.nextSibling);
    const sel = document.getSelection();
    /* 커서를 잃었으면 그냥 빈 줄 하나를 아래에 세운다 */
    if(!sel || !sel.rangeCount || !nx.contains(sel.anchorNode)){
      edAdd(below, {type: kind});
      return;
    }
    /* 고른 글이 있으면 그것부터 지운다 — 노션이 하는 그대로다 */
    const at = sel.getRangeAt(0);
    at.deleteContents();
    const tail = document.createRange();
    tail.setStart(at.startContainer, at.startOffset);
    tail.setEnd(nx, nx.childNodes.length);
    const bin = document.createElement('div');
    bin.appendChild(tail.extractContents());
    const html = edSerialize(bin);
    edTouch(it);
    edAdd(below, {type: kind, html, atStart: true});
  }

  /**
   * 줄 처음에서 Backspace. **노션과 같은 차례로 한 겹씩 벗긴다** —
   * 종류를 벗고, 내어쓰고, 그 다음에야 윗줄과 합친다.
   *
   * 곧장 합치지 않는 까닭은, 합치기가 이 셋 중 유일하게 줄 하나를 없애는
   * 일이기 때문이다. 잘못 눌렀을 때 벗겨지기만 하는 편이 낫다.
   */
  function edBack(it){
    const kind = it.retype || it.type || 'bullet';
    if(kind !== 'paragraph'){ edRetype(it, 'paragraph'); return; }
    if(edParentLi(it.li)){ edKeepCaret(it.nx, () => edMove(it, 'out')); return; }
    edJoin(it);
  }

  /**
   * 윗줄과 합친다. 이 줄의 글이 윗줄 끝에 붙고 이 줄은 사라진다.
   *
   * **안에 든 줄이 있으면 하지 않는다** — 그릇이 없어지면 딸린 줄이 갈 곳을
   * 잃는다. 사라지는 줄을 그어 두지 않고 화면에서 아예 걷는 것은, 글이 이미
   * 윗줄로 갔기 때문이다. 그대로 두면 같은 글이 두 번 보인다. 저장은 화면을
   * 걸어 다니며 문서를 다시 지으므로, 화면에서 걷힌 줄은 저장소에서도 간다.
   */
  function edJoin(it){
    if(it.li.querySelector('li[data-nid]')) return;
    const back = edNextEditable(it.li, 'up');
    if(!back) return;
    /* 칸을 넘어가서까지 합치지 않는다. 칸은 담당자가 세운 주제의 경계라,
       윗칸 마지막 줄에 글이 붙으면 옮긴 것이 아니라 잃은 것으로 보인다 */
    if(back.li.closest('.notice') !== it.li.closest('.notice')) return;
    const at = back.nx.textContent.length;
    back.nx.innerHTML = edSerialize(back.nx) + edSerialize(it.nx);
    edSeal(back.nx);
    edTouch(back);
    edForget(it);
    back.nx.focus();
    edSeek(back.nx, at);
  }

  /* 붙여넣은 글 한 줄을 읽는다. 종류를 부르는 글자는 손으로 칠 때와 같다 */
  function edPasted(raw){
    const line = raw.replace(/\s+$/, '');
    const m = /^\s*(\S+)\s+([\s\S]*)$/.exec(line);
    const kind = m && edMdKind(m[1]);
    return kind ? {kind, text: m[2]} : {kind: null, text: line.replace(/^\s+/, '')};
  }

  /**
   * 여러 줄을 붙여넣으면 **여러 줄로 들어간다.**
   *
   * 지금까지는 한 칸에 통째로 뭉쳐 들어가, 회의록을 옮겨 붙이면 담당자가
   * 줄마다 손으로 갈라야 했다. 첫 동강은 커서 자리에 넣고 나머지는 아래로
   * 세운다 — 놓은 자리가 곧 저장될 자리다.
   */
  function edPasteLines(it, parts){
    /* 글머리 글자가 없는 줄은 **붙여넣기를 시작한 줄**의 종류가 된다.
       바로 위 줄을 따르게 하면, 목록 하나가 토글로 시작했다는 이유로 그
       아래 예사 줄까지 줄줄이 토글이 된다 */
    const base = it.retype || it.type || 'bullet';
    let anchor = it;
    parts.forEach((raw, i) => {
      const cut = edPasted(raw);
      if(i === 0){
        /* 빈 줄에 붙여넣은 첫 동강만 종류를 받는다. 쓰던 줄 가운데에
           붙여넣은 것까지 종류를 갈면 남의 줄을 건드리는 것이 된다 */
        if(cut.kind && !edBefore(anchor.nx)) edRetype(anchor, cut.kind);
        document.execCommand('insertText', false, cut.text);
        edTouch(anchor);
        return;
      }
      if(!cut.text) return;                  /* 사이의 빈 줄은 버린다 */
      const after = anchor;
      anchor = edAdd(li => after.li.parentElement.insertBefore(li, after.li.nextSibling),
                     {type: cut.kind || base});
      document.execCommand('insertText', false, cut.text);
      edTouch(anchor);
    });
  }

  /* ── `/` 로 부르는 종류 목록 ──
     노션의 그 창구다. 고르개는 마우스를 얹어야 나타나고 눈으로 찾아야 하는데,
     이것은 치던 자리에서 그대로 열린다. 목록에 없는 것을 치면 조용히 닫힌다 —
     `/` 로 시작하는 글을 쓰는 일까지 막지는 않는다. */
  let edSl = null;      /* 목록 상자. 한 번만 만든다 */
  let edSlAt = null;    /* {it, n, hits, hit} — 지금 무엇을 고르는 중인가 */

  function edSlBox(){
    if(edSl) return edSl;
    edSl = document.createElement('div');
    edSl.className = 'ed-sl';
    edSl.onmousedown = e => e.preventDefault();   /* 눌러도 커서를 잃지 않게 */
    edSl.onclick = e => {
      const b = e.target.closest('[data-slk]');
      if(b) edSlPick(b.dataset.slk);
    };
    document.body.appendChild(edSl);
    return edSl;
  }

  function edSlHide(){
    edSlAt = null;
    if(edSl) edSl.classList.remove('on');
  }

  /* 줄의 종류가 아니라 칸을 세우는 자리. 목록에만 있고 고르개에는 없다 —
     고르개는 그 줄 하나의 종류를 고르는 것이지 공지의 뼈대를 세우는 것이 아니다 */
  const ED_SL_SEC = '@sec';
  const ED_SL_TBL = '@table';

  /** 쳐 넣은 글자로 추린다. 한글 이름과 저장소가 쓰는 이름을 함께 본다 */
  const edSlHits = q => [...ED_TYPES, [ED_SL_TBL, '표'], [ED_SL_SEC, '새 칸']]
    .filter(([v, name]) => !q || name.indexOf(q) === 0 || v.indexOf(q.toLowerCase()) === 0);

  /** 지금 커서 앞이 「/무엇」인가. 맞으면 목록을 띄운다 */
  function edSlScan(it){
    const head = edBefore(it.nx);
    /* 줄 처음이거나 빈칸 다음의 `/` 만 본다. 주소를 치다 나오는 `/` 까지
       잡으면 목록이 글 위로 튀어나온다 */
    const m = head === null ? null : /(?:^|\s)\/([^\s/]{0,10})$/.exec(head);
    const hits = m ? edSlHits(m[1]) : [];
    if(!hits.length){ edSlHide(); return; }
    edSlAt = {it, n: m[1].length + 1, hits, hit: 0};
    edSlDraw();
  }

  function edSlDraw(){
    const box = edSlBox();
    box.innerHTML = edSlAt.hits.map(([v, name], i) =>
      `<button data-slk="${v}"${i === edSlAt.hit ? ' class="on"' : ''}>${name}</button>`)
      .join('');
    box.classList.add('on');
    const at = edCaretRect();
    if(!at) return;
    const under = at.bottom + 6;
    box.style.left =
      Math.max(8, Math.min(at.left, innerWidth - box.offsetWidth - 8)) + 'px';
    /* 아래에 자리가 없으면 커서 위로 올린다 */
    box.style.top = (under + box.offsetHeight > innerHeight - 8
      ? Math.max(8, at.top - box.offsetHeight - 6) : under) + 'px';
  }

  /** 하나를 골랐다. 쳐 두었던 「/할」을 걷고 그 종류로 바꾼다 */
  function edSlPick(kind){
    if(!edSlAt) return;
    const {it, n} = edSlAt;
    edSlHide();
    it.nx.focus();
    edCutBack(n);
    edTouch(it);
    /* 칸을 세우면 커서가 그 이름으로 간다. 쳐 두었던 `/새 칸` 만 걷고 이 줄은
       그대로 둔다 — 빈 줄이면 떠나면서 저절로 걷힌다 */
    if(kind === ED_SL_SEC){ edSecAdd(); return; }
    if(kind === ED_SL_TBL){ edTableAdd(it); return; }
    edRetype(it, kind);
  }

  /** 목록이 떠 있는 동안의 키. 삼켰으면 true — 그 키는 글에 닿지 않는다 */
  function edSlKey(e){
    if(!edSlAt) return false;
    if(e.key === 'Escape'){ e.preventDefault(); edSlHide(); return true; }
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      const n = edSlAt.hits.length;
      edSlAt.hit = (edSlAt.hit + (e.key === 'ArrowDown' ? 1 : n - 1)) % n;
      edSlDraw();
      return true;
    }
    if(e.key === 'Enter' || e.key === 'Tab'){
      e.preventDefault();
      edSlPick(edSlAt.hits[edSlAt.hit][0]);
      return true;
    }
    return false;
  }

  /**
   * 할 일에 체크를 켜고 끈다.
   *
   * 체크 표시는 요소가 아니라 `::before` 로 그려진다. 그래서 그 자리를 누르면
   * 이벤트의 과녁이 줄(li) 자신이 된다 — 글을 누른 것과 이렇게 갈린다.
   * 글 쪽은 `nx.onclick` 이 거기서 멈춰 세운다.
   */
  function edCheckBind(it){
    it.li.onclick = e => {
      if(e.target !== it.li || it.del) return;
      if((it.retype || it.type) !== 'todo') return;
      edMark();
      /* 표시가 그려진 왼쪽 여백 안에서만이다. 글 오른쪽의 빈 자리까지 받으면
         줄 끝을 누르려던 손이 체크를 켠다 */
      const box = it.li.getBoundingClientRect();
      if(e.clientX - box.left > (parseFloat(getComputedStyle(it.li).paddingLeft) || 22)) return;
      it.checked = !it.checked;
      it.li.classList.toggle('on', it.checked);
      edStatus();
    };
  }

  /* ── 여러 줄 잡기 ──
     줄 하나하나가 따로 떨어진 입력칸이라, 여러 줄에 걸쳐 글을 골라도 편집기는
     그것을 한 덩어리로 다루지 못한다. 그래서 걸쳐 있는 줄을 우리가 세어
     들여쓰기·옮기기·지우기를 그 모두에 건다. 글자 서식은 걸지 않는다 —
     편집기가 남의 칸에는 손을 못 대므로 반만 먹히는 일이 생긴다. */
  let edPicked = [];

  /** 지금 골라 놓은 줄들. 둘 미만이면 여러 줄 잡기가 아니다 */
  function edPick(){
    const sel = document.getSelection();
    if(!sel || !sel.rangeCount || sel.isCollapsed) return [];
    const r = sel.getRangeAt(0);
    const out = [];
    document.querySelectorAll('.ck li[data-nid]').forEach(li => {
      const it = edItems.get(li.dataset.nid);
      if(!it || it.del || !li.offsetParent) return;
      /* 줄의 **글 칸**이 걸쳐 있을 때만 잡는다. li 로 재면 안에 든 줄을
         스치기만 해도 그릇까지 잡혀, 눈에 안 보이는 줄이 함께 움직인다 */
      if(r.intersectsNode(it.nx)) out.push(it);
    });
    return out.length > 1 ? out : [];
  }

  /** 잡힌 줄에 표시를 붙이고 뗀다. 무엇에 걸리는지 눈에 보여야 한다 */
  function edPickPaint(){
    const now = edPick();
    edPicked.forEach(it => { if(now.indexOf(it) < 0) it.li.classList.remove('ed-pick'); });
    now.forEach(it => it.li.classList.add('ed-pick'));
    edPicked = now;
  }

  function edPickClear(){
    edPicked.forEach(it => it.li.classList.remove('ed-pick'));
    edPicked = [];
  }

  /**
   * 여러 줄을 옮긴다.
   *
   * 안에 든 줄은 그릇이 데려가므로 **그릇만 움직인다** — 함께 잡혔다고 따로
   * 부르면 같은 줄이 두 번 옮겨진다.
   */
  function edManyMove(many, dir){
    const tops = many.filter(it => !many.some(o => o !== it && o.li.contains(it.li)));
    if(!tops.length) return;
    if(dir === 'in'){ tops.forEach(it => edMove(it, 'in', true)); return; }
    /* 내어쓰기는 뒤에서부터다. 앞에서부터 내면 뒤엣것이 앞엣것을 앞질러
       순서가 뒤집힌다 — 저마다 「부모 바로 다음」으로 가기 때문이다 */
    if(dir === 'out'){ [...tops].reverse().forEach(it => edMove(it, 'out', true)); return; }
    /* 위·아래는 묶음째다. 한 줄씩 부르면 서로를 밟고 넘어 차례가 섞인다 */
    const edge = dir === 'up' ? tops[0].li : tops[tops.length - 1].li;
    const near = edSib(edge, dir);
    if(!near) return;
    let ref = near;
    tops.forEach(it => {
      if(dir === 'up') ref.parentElement.insertBefore(it.li, ref);
      else { ref.parentElement.insertBefore(it.li, ref.nextSibling); ref = it.li; }
      edSettle(it);
    });
  }

  /**
   * 옮기는 동안 골라 둔 것을 지킨다.
   *
   * DOM 에서 자리만 바꾸는 것이라 글 조각 자체는 그대로 살아 있다. 그래서
   * 자리를 적어 두었다 그대로 다시 고르면 된다 — 못 지키면 Tab 한 번마다
   * 담당자가 다시 끌어서 골라야 한다.
   */
  function edKeepPick(run){
    const sel = document.getSelection();
    const keep = sel && sel.rangeCount
      ? {a: sel.anchorNode, ao: sel.anchorOffset, f: sel.focusNode, fo: sel.focusOffset}
      : null;
    edHolding = true;
    try { run(); } finally { edHolding = false; }
    if(keep){
      try { sel.setBaseAndExtent(keep.a, keep.ao, keep.f, keep.fo); } catch(_){}
    }
    edPickPaint();
  }

  /** 여러 줄이 잡혀 있을 때의 키. 삼켰으면 true */
  function edManyKey(e, many){
    const mod = e.ctrlKey || e.metaKey;
    /* 종류 바꾸기는 잡힌 줄 모두에 걸린다. 표와 그 칸만 빼고 — 표는 종류를
       바꿀 수 있는 것이 아니고, 칸은 표가 데리고 다닌다 */
    const numbered = edNumKind(e);
    if(numbered){
      e.preventDefault();
      edKeepPick(() => many.forEach(it => {
        const kind = it.retype || it.type;
        if(kind !== 'table' && kind !== 'cell') edRetype(it, numbered);
      }));
      return true;
    }
    if(e.key === 'Tab'){
      e.preventDefault();
      edKeepPick(() => edManyMove(many, e.shiftKey ? 'out' : 'in'));
      return true;
    }
    if(mod && e.shiftKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')){
      e.preventDefault();
      edKeepPick(() => edManyMove(many, e.key === 'ArrowUp' ? 'up' : 'down'));
      return true;
    }
    if(e.key === 'Backspace' || e.key === 'Delete'){
      e.preventDefault();
      /* 여러 줄은 먼저 묻는다. 한 줄은 그 자리에 「되돌리기」가 있지만,
         여러 줄이 한꺼번에 그어지면 무엇이 사라졌는지 짚기 어렵다 */
      const kids = many.reduce((n, it) =>
        n + it.li.querySelectorAll('li[data-nid]').length, 0);
      if(!confirm(`고른 ${many.length}줄을 지웁니다.` +
            (kids ? `\n\n안에 든 줄까지 하면 더 사라집니다.` : '') +
            '\n\n「저장」을 눌러야 실제로 사라집니다.')) return true;
      many.forEach(it => edMarkDel(it, true));
      edPickClear();
      return true;
    }
    return false;
  }

  /* ── 표 ──
     문서에는 칸이 한 줄로 늘어서 있고 몇 칸마다 줄을 바꾸는지가 `cols` 다.
     화면에서는 그것이 `<table>` 이고, **화면이 곧 문서다** — 저장이 표를
     걸어 다니며 칸을 순서대로 주워 담는다. 그래서 행을 보태고 지우는 일이
     장부를 건드리지 않고 DOM 만 고치는 일로 끝난다. */

  /** 그 표의 칸들. 화면에 보이는 차례 그대로 — 그것이 곧 문서의 차례다 */
  const edCells = li => [...li.querySelectorAll('td[data-nid]')];

  /** 그 표의 열 수. 첫 행이 말해 준다 */
  const edCols = li => {
    const head = li.querySelector('tr');
    return head ? head.querySelectorAll('td').length : 1;
  };

  /** 빈 칸 하나. 장부에 올리고 고칠 수 있게 열어 둔다 */
  function edCellNew(){
    edSeq += 1;
    const td = document.createElement('td');
    td.dataset.nid = `new-${edSeq}`;
    td.innerHTML = '<span class="nx"></span>';
    const nx = td.querySelector('.nx');
    const it = edItem(td, nx, {base: '', isNew: true, type: 'cell'});
    edItems.set(td.dataset.nid, it);
    nx.contentEditable = 'true';
    nx.spellcheck = false;
    edBindCell(it);
    return td;
  }

  /** 빈 표 하나. 세우자마자 적을 자리가 있어야 한다 */
  function edTableNew(rows, cols){
    edSeq += 1;
    const li = document.createElement('li');
    li.className = 'tbl ed-new';
    li.dataset.nid = `new-${edSeq}`;
    li.innerHTML = `<span class="nx" hidden></span>
      <div class="ntbw"><table class="ntb"><tbody></tbody></table></div>
      <div class="ntbc">
        <button data-tb="row+" title="아래에 행 하나">＋ 행</button>
        <button data-tb="col+" title="오른쪽에 열 하나">＋ 열</button>
        <button data-tb="row-" title="마지막 행 지우기">− 행</button>
        <button data-tb="col-" title="마지막 열 지우기">− 열</button></div>`;
    const body = li.querySelector('tbody');
    for(let r = 0; r < rows; r += 1){
      const tr = document.createElement('tr');
      for(let c = 0; c < cols; c += 1) tr.appendChild(edCellNew());
      body.appendChild(tr);
    }
    return li;
  }

  /**
   * 표 하나를 세운다. **저장소에는 나가지 않는다** — 저장이 함께 내보낸다.
   *
   * 세운 자리는 부른 줄의 바로 아래다. 그 줄이 아직 빈 줄이면 표가 그 자리를
   * 대신하므로, 떠날 때 빈 줄은 저절로 걷힌다.
   */
  function edTableAdd(it){
    const li = edTableNew(2, 2);
    it.li.parentElement.insertBefore(li, it.li.nextSibling);
    const box = edItem(li, li.querySelector(':scope>.nx'),
                       {base: '', isNew: true, type: 'table'});
    edItems.set(li.dataset.nid, box);
    edCheckBind(box);
    bindDelete(box.nx);
    edMvBox(box);
    edTableBind(box);
    li.scrollIntoView({block: 'nearest'});
    const first = edCells(li)[0];
    if(first) edFocusEnd(edItems.get(first.dataset.nid).nx);
    edMvSync();
    edStatus();
    return box;
  }

  /** 행·열 단추. 표를 다시 그리지 않고 그 자리에서 고친다 */
  function edTableBind(it){
    it.li.querySelectorAll(':scope>.ntbc>[data-tb]').forEach(b => {
      b.onclick = e => { e.stopPropagation(); edTableEdit(it, b.dataset.tb); };
    });
  }

  function edTableEdit(it, what){
    edMark();
    const body = it.li.querySelector('tbody');
    const rows = [...body.querySelectorAll('tr')];
    const cols = edCols(it.li);
    if(what === 'row+'){
      const tr = document.createElement('tr');
      for(let c = 0; c < cols; c += 1) tr.appendChild(edCellNew());
      body.appendChild(tr);
      const first = tr.querySelector('td');
      if(first) edFocusEnd(edItems.get(first.dataset.nid).nx);
    } else if(what === 'col+'){
      if(cols >= MAX_COLS){
        edMsg(`한 줄에 ${MAX_COLS}칸까지입니다 — 더 넣으면 가로로 흘러 읽기 나쁩니다`, true);
        return;
      }
      rows.forEach(tr => tr.appendChild(edCellNew()));
    } else if(what === 'row-'){
      /* 마지막 하나는 남긴다. 다 지우면 표가 아니라 빈 껍데기가 되고,
         저장소도 칸 없는 표를 받지 않는다 — 지우려면 표를 지운다 */
      if(rows.length < 2){ edTableTooSmall(); return; }
      if(!edTableMayLose(rows[rows.length - 1].querySelectorAll('td'))) return;
      edCellsForget(rows.pop());
    } else if(what === 'col-'){
      if(cols < 2){ edTableTooSmall(); return; }
      const last = rows.map(tr => tr.lastElementChild).filter(Boolean);
      if(!edTableMayLose(last)) return;
      last.forEach(td => edCellsForget(td));
    }
    /* 표에는 글 칸이 없어 `edTouch` 의 자로는 바뀐 것이 잡히지 않는다.
       행·열을 고친 것이 곧 손질이므로 여기서 자국을 붙인다 */
    if(!it.isNew) it.li.classList.add('ed-dirty');
    edStatus();
  }

  /**
   * 표를 열 때의 모습으로 돌려놓는다.
   *
   * 글 한 줄이 아니라 격자라 `edPaint` 로는 되돌릴 수가 없다. 열 때 떠 둔
   * 본을 도로 심고, 그 안의 칸들을 장부에 다시 올린다 — 심은 칸은 열 때의
   * 글을 그대로 지니므로 기준선도 그 자리에서 다시 세워진다.
   */
  function edTableUndo(it){
    if(!it.tbase) return;
    const body = it.li.querySelector('tbody');
    if(!body) return;
    edCells(it.li).forEach(td => edItems.delete(td.dataset.nid));
    const fresh = it.tbase.cloneNode(true);
    body.replaceWith(fresh);
    edCells(it.li).forEach(td => {
      const nx = td.querySelector(':scope>.nx');
      if(!nx) return;
      const kid = edItem(td, nx, {type: 'cell', base: edSerialize(nx)});
      edItems.set(td.dataset.nid, kid);
      nx.contentEditable = 'true';
      nx.spellcheck = false;
      edBindCell(kid);
    });
    it.li.classList.remove('ed-dirty', 'ed-fail');
  }

  const edTableTooSmall = () =>
    edMsg('마지막 하나는 남깁니다 — 표째로 지우려면 표의 ✕ 를 눌러 주세요', true);

  /* 글이 든 칸이 사라지려 하면 먼저 묻는다. 빈 칸은 잃을 것이 없어 그냥 간다 */
  function edTableMayLose(cells){
    const said = [...cells].filter(td => {
      const kid = edItems.get(td.dataset.nid);
      return kid && !edEmpty(kid.nx);
    }).length;
    return !said || confirm(`글이 든 칸 ${said}개가 함께 사라집니다.\n\n계속할까요?`);
  }

  /* 화면과 장부에서 함께 걷는다. 장부에만 남으면 다음 저장이 없는 칸을 찾는다 */
  function edCellsForget(node){
    (node.matches && node.matches('td') ? [node] : [...node.querySelectorAll('td')])
      .forEach(td => edItems.delete(td.dataset.nid));
    node.remove();
  }

  /** 옆 칸으로. 마지막 칸에서 Tab 을 누르면 행이 하나 는다 — 노션과 같다 */
  function edCellHop(it, step){
    const li = it.li.closest('li.tbl');
    if(!li) return;
    const all = edCells(li);
    const at = all.indexOf(it.li);
    const next = all[at + step];
    if(next){
      const kid = edItems.get(next.dataset.nid);
      if(kid) edFocusEnd(kid.nx);
      return;
    }
    if(step > 0){
      const box = edItems.get(li.dataset.nid);
      if(box) edTableEdit(box, 'row+');
    }
  }

  /**
   * 표의 칸을 고칠 수 있게 연다.
   *
   * 줄과 달리 Enter 가 갈라지지 않는다 — 칸은 줄이 아니라 칸이라 갈릴 자리가
   * 없다. 그 자리에서 줄만 바꾼다.
   */
  function edBindCell(it){
    const nx = it.nx;
    nx.oninput = () => edTouch(it);
    nx.onkeydown = e => {
      if(e.isComposing || e.keyCode === 229) return;
      if(e.key === 'Escape'){ e.preventDefault(); nx.blur(); return; }
      if(e.key === 'Enter'){
        e.preventDefault();
        document.execCommand('insertLineBreak');
        edTouch(it);
        return;
      }
      if(e.key === 'Tab'){
        e.preventDefault();
        edCellHop(it, e.shiftKey ? -1 : 1);
      }
    };
    nx.onpaste = edPastePlain(it);
  }

  /* 붙여넣기는 글자만 받는다. 중계 서버가 모르는 태그가 섞이면 그 칸이
     통째로 거절당한다 */
  const edPastePlain = it => e => {
    e.preventDefault();
    edMark();
    const t = String((e.clipboardData || window.clipboardData).getData('text/plain'))
      .replace(/\r\n?/g, '\n');
    document.execCommand('insertText', false, t);
    edTouch(it);
  };

  /* ── 한 걸음씩 되돌리기 (Ctrl+Z · Ctrl+Shift+Z) ──
     저장 창구의 「되돌리기」는 손댄 것을 **통째로** 물린다. 그것과 별개로,
     노션이 그러하듯 한 걸음씩 물릴 수 있어야 한다 — 잘못 누른 Tab 하나
     때문에 반나절 적은 것을 다 버릴 수는 없다.

     손질마다 되돌리는 짝을 따로 쓰지 않는다. 그렇게 하면 새 손질을 만들
     때마다 짝 하나를 잊게 되고, 잊은 자리는 조용히 어긋난다. 대신 **걸음마다
     공지 화면과 장부를 통째로 떠 둔다** — 저장이 문서를 통째로 보내는 것과
     같은 셈법이라, 새 손질이 생겨도 여기는 손댈 일이 없다. */
  const ED_STEPS = 60;          /* 이고 갈 걸음 수 */
  const edHist = [];            /* 지나온 자리 */
  const edAhead = [];           /* 되돌린 뒤 다시 갈 자리 */
  let edSnapAt = 0;             /* 마지막으로 뜬 때 — 타이핑을 뭉치는 데 쓴다 */

  /** 화면에서 편집기가 붙인 것을 걷는다. 다시 걸어 줄 것이라 뜰 때는 뺀다 */
  const ED_CHROME = '.nx-del,.nx-mv,.nx-gr,.ntbc,.ed-rt,.ed-note,.ed-tb,.ed-sl';

  function edView(){ return document.querySelector('#scroll > .view'); }

  /** 지금 자리를 뜬다. 화면과 장부를 함께 담는다 — 하나만으로는 못 돌아간다 */
  function edSnapTake(){
    const view = edView();
    if(!view) return null;
    const copy = view.cloneNode(true);
    copy.querySelectorAll(ED_CHROME).forEach(el => el.remove());
    const rows = {};
    edItems.forEach((it, id) => {
      const body = it.type === 'table' && it.tbase ? it.tbase.innerHTML : undefined;
      rows[id] = {type: it.type, retype: it.retype, base: it.base, isNew: it.isNew,
                  checked: it.checked, checkBase: it.checkBase, home: it.home,
                  moved: it.moved, del: it.del, display: it.display, tbaseHtml: body};
    });
    const secs = {};
    edSecs.forEach((sec, id) => {
      secs[id] = {base: sec.base, home: sec.home, moved: sec.moved,
                  isNew: sec.isNew, del: sec.del};
    });
    const on = document.activeElement;
    const host = on && on.closest ? on.closest('[data-nid]') : null;
    return {
      html: copy.innerHTML,
      title: edTitle && edTitle.input.isConnected ? edTitle.input.value : null,
      titleBase: edTitle ? edTitle.base : null,
      rows, secs,
      focus: host ? {nid: host.dataset.nid, at: edOffset(on)} : null,
    };
  }

  /**
   * 뜬 자리로 화면을 되돌린다.
   *
   * 화면을 갈아 끼우면 장부가 사라진 마디를 가리키게 되므로, 장부도 그 자리에서
   * 다시 짓는다. 글은 **화면에 있는 것을 그대로 둔다** — 저장소에서 다시
   * 불러오면 되돌린 것이 도로 덮인다.
   */
  function edSnapPut(snap){
    const view = edView();
    if(!view || !snap) return;
    edSlHide();
    edPickClear();
    view.innerHTML = snap.html;
    bindNotice({keep: true});          /* 저장소를 다시 읽지 않는다 */

    const next = new Map();
    document.querySelectorAll(ED_ROWS).forEach(node => {
      const nx = node.querySelector(':scope>.nx, :scope>.tgh>.nx');
      if(!nx) return;
      const was = snap.rows[node.dataset.nid] || {};
      const it = edItem(node, nx, Object.assign({display: nx.innerHTML}, was));
      if(was.tbaseHtml !== undefined){
        const body = document.createElement('tbody');
        body.innerHTML = was.tbaseHtml;
        it.tbase = body;
      }
      next.set(node.dataset.nid, it);
    });
    edItems = next;

    edSecsLoad();                      /* 칸 장부를 화면에서 다시 짓는다 */
    edSecs.forEach((sec, id) => Object.assign(sec, snap.secs[id] || {}));

    edItems.forEach(it => {
      edWire(it);
      /* 지울 줄은 고칠 수 없는 채로, 바꿀 종류는 딱지를 붙인 채로 돌아온다 */
      if(it.del && !it.isNew){ it.nx.removeAttribute('contenteditable'); edDelBtn(it); }
      if(it.retype) edRtChip(it);
    });

    const inp = document.getElementById('ntitle');
    if(inp && snap.title !== null){
      edTitleOpen(snap.titleBase || '');
      inp.value = snap.title;
    }
    if(snap.focus){
      const back = edItems.get(snap.focus.nid);
      if(back && back.nx.isContentEditable){
        back.nx.focus();
        edSeek(back.nx, snap.focus.at);
      }
    }
    edSecSync();
    edMvSync();
    edStatus();
  }

  /**
   * 걸음을 하나 떠 둔다. **바뀌기 전에** 부른다.
   *
   * 바뀐 것이 없으면 뜨지 않는다 — 화살표만 눌러도 걸음이 쌓이면 Ctrl+Z 가
   * 아무 일도 안 하는 것처럼 보인다. 글자를 잇달아 치는 동안은 한 걸음으로
   * 뭉친다. 한 글자마다 물리면 되돌리기가 끝나지 않는다.
   */
  function edMark(join){
    if(!ED.on() || !edView()) return;
    const now = Date.now();
    if(join && now - edSnapAt < 900) return;
    const snap = edSnapTake();
    if(!snap) return;
    const top = edHist[edHist.length - 1];
    if(top && top.html === snap.html && top.title === snap.title) return;
    edHist.push(snap);
    if(edHist.length > ED_STEPS) edHist.shift();
    edAhead.length = 0;                /* 새 길로 들어섰다 */
    edSnapAt = now;
  }

  /** 한 걸음 뒤로. 갈 곳이 없으면 false */
  function edStepBack(){
    if(!edHist.length) return false;
    const now = edSnapTake();
    edSnapPut(edHist.pop());
    if(now) edAhead.push(now);
    edSnapAt = 0;
    return true;
  }

  /** 되돌린 것을 도로 */
  function edStepFwd(){
    if(!edAhead.length) return false;
    const now = edSnapTake();
    edSnapPut(edAhead.pop());
    if(now) edHist.push(now);
    edSnapAt = 0;
    return true;
  }

  /* ── 치면서 서식이 되는 글자 ──
     노션에서 손이 기억하는 것 — `**굵게**` 를 치면 별표가 사라지고 굵어진다.
     닫는 글자를 친 그 순간에만 본다. 문장 가운데의 별표 하나는 그냥 별표다. */
  /* 서식마다 심을 태그. 직렬화가 알아보는 것과 같은 이름이다 */
  const ED_TAG = {bold: 'strong', italic: 'em', strikeThrough: 's', code: 'code'};

  const ED_WRAP = [
    {re: /\*\*([^*\n]+)\*\*$/,        cmd: 'bold'},
    {re: /~~([^~\n]+)~~$/,            cmd: 'strikeThrough'},
    {re: /(^|[^*])\*([^*\n]+)\*$/,    cmd: 'italic', at: 2},
    {re: /(^|[\s(])_([^_\n]+)_$/,     cmd: 'italic', at: 2},
    {re: /`([^`\n]+)`$/,              cmd: 'code'},
  ];

  /**
   * 커서를 방금 입힌 서식 **바깥**으로 뺀다.
   *
   * 닫는 글자를 쳤다는 것은 「여기까지가 굵은 글」이라는 뜻이다. 커서를 그
   * 안에 둔 채로 두면 뒤에 치는 글이 전부 딸려 굵어지고, 담당자는 서식을
   * 끄는 법을 따로 찾아야 한다.
   */
  function edCaretOut(nx, box){
    const sel = document.getSelection();
    if(!box || !box.parentNode){ sel.collapseToEnd(); return; }
    /* 서식 조각 **다음에 글자 하나를 놓고** 그 뒤로 간다. 빈 마디로는 안
       된다 — 편집기가 그것을 건너뛰고 커서를 도로 조각 안으로 넣어, 뒤에
       치는 글이 그대로 딸려 들어간다. 폭이 없는 글자라 화면에 보이지 않고,
       저장할 때 `edSerialize` 가 걷어 낸다 */
    const after = document.createTextNode(ED_ZW);
    box.parentNode.insertBefore(after, box.nextSibling);
    const r = document.createRange();
    r.setStart(after, 1);
    r.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r);
  }

  /**
   * 서식으로 바꾸는 일을 **`input` 이 끝난 다음으로 미룬다.**
   *
   * 편집기는 제 `input` 을 나르는 동안 걸려 온 지우기·넣기를 못 본 척한다 —
   * 그 안에서 부르면 아무 일도 일어나지 않는다.
   */
  const edWrapLater = it => setTimeout(() => edWrapScan(it), 0);

  /**
   * 방금 친 글자가 서식을 닫았는지 본다. 닫았으면 표시 글자를 걷고 서식을 입힌다.
   *
   * 태그를 **직접 심는다.** `execCommand('bold')` 는 「지금 굵은가」를 화면에
   * 그려진 대로 보므로, 이미 굵은 제목 줄 안에서는 굵게가 아니라 **굵기를
   * 푸는 일**이 된다. 우리가 아는 것은 「담당자가 굵게를 닫았다」 하나뿐이니
   * 그대로 심는 편이 어긋날 자리가 없다.
   *
   * 코드 덩어리 안에서는 보지 않는다 — 별표도 백틱도 거기서는 그냥 글자다.
   */
  function edWrapScan(it){
    /* **자기를 물지 않게 한다.** 표시 글자를 걷는 일이 다시 `input` 을
       일으켜, 막지 않으면 반쯤 지워진 글에 대고 규칙이 또 돈다 */
    if(edWrapping) return;
    if((it.retype || it.type) === 'code') return;
    const head = edBefore(it.nx);
    if(!head) return;
    for(const rule of ED_WRAP){
      const m = rule.re.exec(head);
      if(!m) continue;
      const inner = m[rule.at || 1];
      if(!inner.trim()) continue;
      /* 앞 글자 하나는 표시가 아니라 본문이라 지우지 않는다(`가*기울임*`) */
      const eaten = m[0].length - (rule.at ? m[1].length : 0);
      edWrapping = true;
      try {
        edCutBack(eaten);
        const sel = document.getSelection();
        if(sel && sel.rangeCount){
          const box = document.createElement(ED_TAG[rule.cmd]);
          box.textContent = inner;
          sel.getRangeAt(0).insertNode(box);
          edCaretOut(it.nx, box);
        }
      } finally { edWrapping = false; }
      edTouch(it);
      return;
    }
  }
  let edWrapping = false;

  /**
   * 줄 하나를 그대로 하나 더. 노션의 Ctrl+D 다.
   *
   * 안에 든 줄은 데려가지 않는다 — 「이 줄을 하나 더」와 「이 묶음을 하나 더」는
   * 다른 일이고, 묶음째는 끌어다 놓는 편이 눈에 보인다.
   */
  function edDup(it){
    const kind = it.retype || it.type || 'bullet';
    if(kind === 'table' || kind === 'cell') return;
    const made = edAdd(li => it.li.parentElement.insertBefore(li, it.li.nextSibling),
                       {type: kind, html: edSerialize(it.nx)});
    if(kind === 'todo' && it.checked){
      made.checked = true;
      made.li.classList.add('on');
    }
    edStatus();
  }

  /* 고른 글자 위에 주소를 붙여넣으면 링크가 된다. 노션이 하는 그대로다 */
  const ED_URL = /^(https?:\/\/|mailto:)\S+$/i;

  function edBindItem(it){
    const nx = it.nx;
    edCheckBind(it);
    /* 코드 안에서는 `/` 목록을 부르지 않는다. 주소와 나눗셈이 거기 산다 */
    nx.oninput = () => {
      edTouch(it);
      if((it.retype || it.type) !== 'code') edSlScan(it);
      edWrapLater(it);
    };
    nx.onclick = e => e.stopPropagation();   /* 토글 항목이 접히지 않게 */
    /* 눌러만 두고 아무것도 쓰지 않은 줄은 떠날 때 걷는다. 남겨 두면 노션에
       없는 빈 줄이 화면에만 쌓인다 */
    nx.onblur = () => {
      if(edSlAt && edSlAt.it === it) edSlHide();
      if(!edHolding && it.isNew && edEmpty(nx) && !edLone(it.li)) edForget(it);
    };
    nx.onkeydown = e => {
      /* **한글을 짓는 중에는 아무것도 가로채지 않는다.** 「ㅎㅏㄴ」을 맺는
         Enter 까지 줄 쪼개기로 읽으면 한 글자 칠 때마다 줄이 갈라진다.
         keyCode 229 는 조합 중임을 isComposing 대신 알리는 옛 브라우저의 것이다 */
      if(e.isComposing || e.keyCode === 229) return;
      const undo = e.ctrlKey || e.metaKey;
      if(undo && String(e.key).toLowerCase() === 'z'){
        /* 우리가 받는다. 편집기에게 맡기면 줄 하나 안에서만 물리고, 옮기고
           들여쓰고 지운 것은 물릴 길이 없다 */
        e.preventDefault();
        if(e.shiftKey) edStepFwd(); else edStepBack();
        return;
      }
      if(undo && String(e.key).toLowerCase() === 'y'){
        e.preventDefault();
        edStepFwd();
        return;
      }
      /* **키를 누른 그 자리에서 걸음을 뜬다.** 글자가 들어가기 전이라 이 자리가
         곧 되돌아갈 곳이다. 잇달아 치는 글자는 한 걸음으로 뭉치고, 화살표만
         누른 것은 아무것도 바꾸지 않으므로 `edMark` 가 걸음을 늘리지 않는다 */
      edMark(e.key.length === 1);
      /* `/` 목록이 떠 있으면 그것이 먼저다 — ↑ ↓ Enter 가 목록의 것이 된다 */
      if(edSlKey(e)) return;
      /* 여러 줄을 골라 두었으면 들여쓰기·옮기기·지우기가 그 모두에 걸린다 */
      if(edPicked.length > 1 && edManyKey(e, edPicked.slice())) return;
      /* 코드 안에서는 Enter 가 줄바꿈이다. 갈라지면 한 덩어리가 아니게 된다 */
      if((it.retype || it.type) === 'code' && e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        document.execCommand('insertLineBreak');
        edTouch(it);
        return;
      }
      /* ── 키보드로 줄을 넘고 옮기고 들여쓴다 ──
         손이 글에서 떠나지 않게 하는 것이 전부다. 단추는 그대로 있고,
         여기서는 같은 길을 키보드에도 낸다 */
      const mod = e.ctrlKey || e.metaKey;
      /* 노션과 같은 손가락 — 굵게·기울임·밑줄은 브라우저가 이미 안다.
         나머지 셋과 「하나 더」를 여기서 낸다 */
      /* 종류를 숫자로 — 노션과 같은 짝. 표는 종류를 바꿀 수 있는 것이 아니다 */
      const numbered = edNumKind(e);
      if(numbered){
        e.preventDefault();
        if((it.retype || it.type) !== 'table') edRetype(it, numbered);
        return;
      }
      if(mod && !e.altKey){
        const k = String(e.key || '').toLowerCase();
        if(k === 'e' && !e.shiftKey){ e.preventDefault(); edFormat('code'); return; }
        if(k === 'k' && !e.shiftKey){ e.preventDefault(); edFormat('link'); return; }
        if(k === 's' && e.shiftKey){ e.preventDefault(); edFormat('strikeThrough'); return; }
        if(k === 'd' && !e.shiftKey){ e.preventDefault(); edDup(it); return; }
        /* 할 일 켜고 끄기. 마우스로 작은 네모를 겨누지 않아도 된다 */
        if(e.key === 'Enter' && (it.retype || it.type) === 'todo'){
          e.preventDefault();
          it.checked = !it.checked;
          it.li.classList.toggle('on', it.checked);
          edStatus();
          return;
        }
      }
      if((e.key === 'ArrowUp' || e.key === 'ArrowDown')){
        const dir = e.key === 'ArrowUp' ? 'up' : 'down';
        if(mod && e.shiftKey){                 /* 줄을 옮긴다 */
          e.preventDefault();
          edKeepCaret(nx, () => edMove(it, dir));
          return;
        }
        /* Shift 를 쥔 채 줄 끝에 닿으면 **이웃 줄까지 함께 잡는다.** 편집기는
           칸 하나를 넘어가는 고르기를 저 혼자 하지 못한다 — 여기서 늘려 준다 */
        if(!mod && e.shiftKey && edAtEdge(nx, dir)){
          const near = edNextEditable(it.li, dir);
          if(near){
            e.preventDefault();
            const sel = document.getSelection();
            sel.extend(near.nx, dir === 'up' ? 0 : near.nx.childNodes.length);
            edPickPaint();
            return;
          }
        }
        /* 여러 줄로 접힌 줄 안에서는 그 줄 안에서 먼저 움직인다.
           끝 줄에 닿았을 때만 이웃 줄로 넘어간다 */
        if(!mod && !e.shiftKey && edAtEdge(nx, dir)){
          const near = edNextEditable(it.li, dir);
          if(near){
            const at = edCaretRect();
            e.preventDefault();
            edCaretTo(near.nx, dir, at ? at.left : 0);
            return;
          }
        }
      }
      if(e.key === 'Tab'){
        e.preventDefault();
        edKeepCaret(nx, () => edMove(it, e.shiftKey ? 'out' : 'in'));
        return;
      }
      /* 줄 앞에서 `- ` `1. ` `[] ` `> ` `" ` — 노션과 같은 글자다.
         코드 안에서는 보지 않는다. `# ` 도 `> ` 도 코드에서는 그냥 글자다 */
      if(e.key === ' ' && !mod && (it.retype || it.type) !== 'code'){
        const head = edHead(nx);
        const kind = head && edMdKind(head);
        if(kind){
          e.preventDefault();
          edCutHead(nx, head.length);
          edRetype(it, kind);
          /* `[x] ` 는 켜 둔 채로 시작한다. 이미 끝난 일을 옮겨 적을 때다 */
          if(head === '[x]'){ it.checked = true; it.li.classList.add('on'); }
          edTouch(it);
          return;
        }
      }
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        /* **빈 글머리에서 Enter 는 목록을 빠져나온다.** 노션과 같다. 그러지
           않으면 빈 글머리가 끝없이 이어지고, 멈추려면 Backspace 를 따로
           찾아야 한다. 들여쓴 줄은 한 칸 나오는 것이 먼저다 */
        const kind = it.retype || it.type || 'bullet';
        if(kind !== 'paragraph' && kind !== 'code' && edEmpty(nx)
           && !it.li.querySelector('li[data-nid]')){
          if(edParentLi(it.li)) edKeepCaret(nx, () => edMove(it, 'out'));
          else edRetype(it, 'paragraph');
          return;
        }
        /* 커서 자리에서 줄을 가른다. 끝에서 누르면 아래에 빈 줄이 서고,
           가운데서 누르면 뒤쪽 글이 그 줄로 내려간다 — 노션과 같은 손놀림이다.
           줄 안에서 줄을 바꾸는 것은 Shift+Enter 다 */
        edSplit(it);
        return;
      }
      if(e.key === 'Enter'){
        e.preventDefault();
        document.execCommand('insertLineBreak');
        edTouch(it);
        return;
      }
      /* 빈 줄에서 Backspace 는 그 줄을 지운다. 확인창을 띄우지 않는다 —
         빈 줄에는 잃을 것이 없고, 저장 전이라 「되돌리기」로 물릴 수 있다.
         안에 든 줄이 있으면 놔둔다. 노션은 그릇을 지울 때 안엣것도 지운다 */
      if(e.key === 'Backspace' && !mod){
        if(edEmpty(nx) && !it.li.querySelector('li[data-nid]')){
          e.preventDefault();
          /* 커서를 먼저 옮기고 나서 지운다. 지우면서 옮기면 브라우저가 사라진
             줄에서 초점을 거두어 본문에 놓아 버리고, 담당자는 커서를 잃는다 */
          const back = edPrev(it.li);
          if(back) edFocusEnd(back.nx);
          edMarkDel(it, true);
          return;
        }
        /* 글이 든 줄의 맨 앞. 지울 글자가 없으니 구조를 한 겹 벗긴다 */
        const sel = document.getSelection();
        if(sel && sel.isCollapsed && edOffset(nx) === 0){
          e.preventDefault();
          edBack(it);
          return;
        }
      }
      if(e.key === 'Escape') nx.blur();
    };
    /* 붙여넣기는 글자만 받는다. 노션·워드에서 복사한 서식을 그대로 넣으면
       중계 서버가 모르는 태그가 섞여 그 줄이 통째로 거절당한다 */
    nx.onpaste = e => {
      e.preventDefault();
      edMark();
      const t = String((e.clipboardData || window.clipboardData).getData('text/plain'))
        .replace(/\r\n?/g, '\n');
      /* 고른 글자 위에 주소를 붙여넣으면 그 글자가 링크가 된다. 주소를 그대로
         드러내지 않고 말이 되는 글에 걸 수 있는 가장 빠른 길이다 */
      const sel = document.getSelection();
      if(ED_URL.test(t.trim()) && sel && sel.rangeCount && !sel.isCollapsed
         && edEditable(sel.anchorNode) === nx){
        document.execCommand('createLink', false, t.trim());
        edTouch(it);
        return;
      }
      /* 여러 줄이면 줄 수만큼 줄이 된다. 한 줄이면 지금까지처럼 그 자리에 */
      const parts = t.split('\n');
      if(parts.length > 1){ edPasteLines(it, parts); return; }
      document.execCommand('insertText', false, t);
      edTouch(it);
    };
