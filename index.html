    nx.ondrop = e => e.preventDefault();
  }

  const edOf = nx => edItems.get((nx.closest('li[data-nid]') || {dataset:{}}).dataset.nid);

  function edTouch(it){
    edHint(it);
    /* 보탠 줄은 「고쳤다」로 세지 않는다. 통째로 새것이라 보내는 것도 하나다 */
    if(!it.isNew){
      const dirty = edSerialize(it.nx) !== it.base;
      it.li.classList.toggle('ed-dirty', dirty);
      if(dirty) it.li.classList.remove('ed-fail');
    }
    edStatus();
  }

  /**
   * 저장하면 나갈 것들. `{it, op}` 를 **화면에 보이는 순서 그대로** 돌려준다.
   *
   * 순서가 중요하다. 보탠 줄은 바로 위 줄을 발판으로 삼고, 저장이 상한에서
   * 끊길 때도 위에서부터 나가야 담당자가 무엇이 남았는지 짚을 수 있다.
   * 그래서 `edItems` 가 아니라 DOM 을 훑는다 — 사이에 끼워 넣은 줄까지
   * 제자리에서 잡히는 곳은 DOM 뿐이다.
   */
  function edPending(){
    const out = [];
    /* 공지의 제목이 맨 앞이다. 줄이 아니라 공지 한 건의 것이다 */
    if(edTitleDirty()) out.push({op:'title'});
    /* 칸 손질. 이름 고침·만듦·옮김·지움을 갈라서 센다 */
    edSecs.forEach(sec => {
      if(!sec.box.isConnected) return;
      if(sec.del){ out.push({sec, op:'secdel'}); return; }
      if(sec.isNew){
        /* 이름도 줄도 없는 칸은 저장에 나가지 않는다. 세지도 않는다 —
           세면 「저장하지 않은 것이 있다」가 영영 붙잡는다 */
        if(sec.nsx.textContent.trim() || edSecLines(sec.box)) out.push({sec, op:'secadd'});
        return;
      }
      if(sec.nsx.textContent.trim() !== sec.base) out.push({sec, op:'secname'});
      if(edSecMoved(sec)) out.push({sec, op:'secmove'});
    });
    document.querySelectorAll(ED_ROWS).forEach(li => {
      const it = edItems.get(li.dataset.nid);
      if(!it) return;
      /* 지울 줄 안에 든 줄, 지울 칸 안에 든 줄은 따로 세지 않는다. 그릇이
         사라지면 함께 사라지므로 손질 하나가 여럿으로 보일 뿐이다 */
      if(li.parentElement.closest('li.ed-del')) return;
      const sec = edSecs.get((li.closest('.notice') || {dataset:{}}).dataset.nsec);
      if(sec && sec.del) return;
      if(it.del){ out.push({it, op:'remove'}); return; }
      /* 표의 칸은 표가 데리고 다닌다. 고친 것만 따로 세고, 보탠 것은 세지
         않는다 — 새 표 하나가 「4줄 보탬」으로 보이면 안 된다 */
      if(it.type === 'cell'){
        if(!it.isNew && li.classList.contains('ed-dirty')) out.push({it, op:'edit'});
        return;
      }
      if(it.isNew){
        if(it.type === 'table' || !edEmpty(it.nx)) out.push({it, op:'add'});
        return;
      }
      /* 표는 글 칸이 없다. 행·열이 바뀌었는지는 화면과 문서를 견주기 어려워,
         손댄 표는 `edTouch` 가 붙인 자국으로 잡는다 */
      if(it.type === 'table'){
        if(li.classList.contains('ed-dirty')) out.push({it, op:'edit'});
        if(edMoved(it)) out.push({it, op:'move'});
        return;
      }
      if(li.classList.contains('ed-dirty')) out.push({it, op:'edit'});
      /* 체크를 켠 것도 손질이다. 안 세면 그것만 하고 저장을 누를 수가 없다 */
      if((it.retype || it.type) === 'todo' && it.checked !== it.checkBase)
        out.push({it, op:'check'});
      /* 한 줄에 셋이 함께 걸릴 수 있다 — 글을 고치고, 자리를 옮기고, 종류를
         바꾸는 것이 저장할 때는 문서 한 벌의 서로 다른 자리일 뿐이다.
         저장 창구는 담당자가 한 대로 세어 보여 준다 */
      if(edMoved(it)) out.push({it, op:'move'});
      if(it.retype) out.push({it, op:'retype'});
    });
    return out;
  }

  function edStatus(text){
    const bar = document.getElementById('edbar');
    if(!bar) return;
    const pend = edPending();
    const n = pend.length;
    /* 무엇이 몇 줄 나가는지를 갈라서 센다. 「5줄 바뀜」으로 뭉치면 담당자는
       그 안에 지우기가 몇 줄인지 모른 채 저장을 누른다 */
    const count = (op) => pend.filter(p => p.op === op).length;
    const said = (pend.some(p => p.op === 'title') ? ['제목'] : [])
      .concat([['edit','고침'], ['add','보탬'], ['move','옮김'],
               ['retype','종류 바꿈'], ['check','체크'], ['remove','지움']]
        .map(([op, word]) => [count(op), word])
        .filter(([c]) => c).map(([c, word]) => `${c}줄 ${word}`))
      .concat([['secadd','만듦'], ['secname','이름 고침'],
               ['secmove','옮김'], ['secdel','지움']]
        .map(([op, word]) => [count(op), word])
        .filter(([c]) => c).map(([c, word]) => `${c}칸 ${word}`)).join(' · ');
    bar.querySelector('[data-edcnt]').textContent =
      text !== undefined ? text
      : !n ? '바뀐 것 없음'
      /* 몇 개까지라는 말이 없다. 문서를 통째로 보내므로 상한이 없다 */
      : said;
    bar.querySelector('[data-edsave]').disabled = !n;
    bar.querySelector('[data-edundo]').disabled = !n;
  }

  function edMsg(text, bad){
    const bar = document.getElementById('edbar');
    if(!bar) return;
    const m = bar.querySelector('[data-edmsg]');
    m.className = 'msg' + (bad ? ' bad' : '');
    m.textContent = text || '';
  }

  /* 알림은 그 줄 바로 밑에 붙인다. 항목 안에 넣으면 고치는 글의 일부가 된다 */
  function edNote(it){
    edClearNote(it);
    /* 지우기 단추 뒤에 붙인다. 사이에 끼우면 알림이 한 켜를 차지하면서
       ✕ 가 다음 줄로 밀려난다 */
    const top = it.nx.closest('.tgh') || it.nx;
    const anchor = top.parentElement.querySelector(':scope>.nx-del') || top;
    const box = document.createElement('div');
    box.className = 'ed-note bad';
    anchor.parentElement.insertBefore(box, anchor.nextSibling);
    return box;
  }
  function edClearNote(it){
    const old = it.li.querySelector(':scope>.ed-note');
    if(old) old.remove();
  }




  /* 눌러만 두고 아무것도 쓰지 않은 빈 줄을 걷는다. 저장소는 빈 줄도 받지만,
     쓰지 않은 줄을 내보내 봐야 다음 빌드가 버린다 */
  function edSweep(){
    edItems.forEach(it => {
      /* 표와 그 칸은 이 자로 재지 않는다. 표의 글 칸은 언제나 비어 있고,
         칸은 비워 두는 것이 뜻이 있다 — 재면 새로 세운 표가 저장 직전에
         소리 없이 걷혀 아무것도 나가지 않는다 */
      if(it.type === 'table' || it.type === 'cell') return;
      if(it.isNew && !it.del && edEmpty(it.nx)) edForget(it);
    });
  }

  /**
   * 화면을 걸어 다니며 지금 보이는 그대로를 **꾸러미**로 짓는다.
   *
   * 꾸러미는 두 몫을 한 자루에 담는다 — 중계 서버로 나갈 문서(`row`)와, 그
   * 문서의 각 조각이 화면의 어느 마디에서 왔는지(`box`·`li`). 나갈 것과
   * 화면의 짝을 **한 번에** 정해 두는 까닭은, 둘을 따로 세면 어긋나기
   * 때문이다 — 빈 칸 하나를 저장 쪽만 빼고 세는 날, 돌아온 문서가 한 칸씩
   * 밀려 엉뚱한 줄에 남의 주소가 박힌다.
   *
   * 저장이 문서를 통째로 덮어쓰므로 **여기서 빠뜨린 것은 저장소에서
   * 사라진다.** 지울 줄과 쓰지 않은 빈 줄만 뺀다.
   */
  function edParcel(){
    const out = [];
    document.querySelectorAll('.notice').forEach(box => {
      const sec = edSecs.get(box.dataset.nsec);
      if(sec && sec.del) return;                   /* 지울 칸. 안엣줄도 함께 간다 */
      const title = sec ? sec.nsx.textContent.trim() : '';
      const list = box.querySelector(':scope>.bd>ul.ck');
      const kids = list ? edParcelItems(list) : [];
      /* 줄도 이름도 없는 칸은 내보내지 않는다. 그런 칸은 아무것도 아니다 */
      if(!kids.length && !title) return;
      out.push({box, sec, list,
                /* 새로 세운 칸에는 주소가 없다. 중계 서버가 지어 붙여 준다 */
                row: {id: (sec && sec.isNew) ? undefined : (box.dataset.nsec || undefined),
                      title, items: kids.map(k => k.row)},
                kids});
    });
    return out;
  }

  function edParcelItems(list){
    const out = [];
    [...list.children].forEach(li => {
      if(!li.matches('li[data-nid]')) return;
      const it = edItems.get(li.dataset.nid);
      if(!it || it.del) return;                    /* 지울 줄. 안엣것도 함께 간다 */
      const kind = it.retype || it.type || 'bullet';
      /* 표는 글 칸이 비어 있는 것이 정상이다. 빈 줄과 같은 자로 재면 새로
         세운 표가 저장에 실리지 않는다 */
      if(kind !== 'table' && it.isNew && edEmpty(it.nx)) return;
      if(kind === 'table'){
        const cells = edParcelCells(li);
        if(!cells.length) return;                  /* 칸이 없는 표는 표가 아니다 */
        const row = {type: 'table', cols: edCols(li), html: '',
                     items: cells.map(c => c.row)};
        if(!it.isNew) row.id = li.dataset.nid;
        out.push({li, it, row, kids: cells});
        return;
      }
      const sub = li.querySelector(':scope>ul');
      const kids = sub ? edParcelItems(sub) : [];
      const row = {type: kind, html: edSerialize(it.nx), items: kids.map(k => k.row)};
      /* 보탠 줄에는 주소가 없다. 중계 서버가 지어 붙여 돌려준다 */
      if(!it.isNew) row.id = li.dataset.nid;
      if(kind === 'todo') row.checked = !!it.checked;
      out.push({li, it, row, kids});
    });
    return out;
  }

  /**
   * 표의 칸들.
   *
   * **빈 칸도 싣는다.** 빈 줄과 달리 비워 둔 칸은 「없는 것」이 아니라
   * 「비워 둔 것」이라, 빠뜨리면 그 줄만 칸이 모자라 표가 어긋난다.
   */
  function edParcelCells(li){
    return edCells(li).map(td => {
      const it = edItems.get(td.dataset.nid);
      if(!it) return null;
      const row = {type: 'cell', html: edSerialize(it.nx), items: []};
      if(!it.isNew) row.id = td.dataset.nid;
      return {li: td, it, row, kids: []};
    }).filter(Boolean);
  }

  /**
   * 저장이 끝났다. 돌아온 문서를 화면에 받아 넣는다.
   *
   * 화면은 다시 그리지 않는다 — 커서와 스크롤이 튀고, 방금 친 글이 화면에서
   * 한 번 사라졌다 돌아온다. 대신 **보탠 줄에 붙은 주소만** 갈아 끼운다.
   * 보낸 꾸러미를 그대로 들고 걷기 때문에 짝이 어긋날 수 없다.
   */
  function edAdoptDoc(parcel, doc){
    const walk = (kids, nodes) => kids.forEach((k, at) => {
      const node = nodes[at];
      if(!node) return;
      const {li, it} = k;
      if(it.isNew){
        edItems.delete(li.dataset.nid);
        li.dataset.nid = node.id;
        edItems.set(node.id, it);
        li.classList.remove('ed-new');
        it.isNew = false;
      }
      it.type = node.type;
      it.retype = null;
      it.checked = it.checkBase = node.type === 'todo' && !!node.checked;
      li.classList.toggle('on', it.checked);
      it.display = it.base = node.html || '';
      it.moved = false;
      li.classList.remove('ed-dirty', 'ed-fail', 'ed-moved');
      edSkin(it);                 /* 저장소가 받아 준 종류로 자리를 잡는다 */
      edClearNote(it);
      edRtChip(it);
      walk(k.kids, node.items || []);
      /* 표의 본은 **칸의 주소를 갈아 끼운 뒤에** 뜬다. 먼저 뜨면 본에 아직
         임시 이름이 박혀 있어, 「되돌리기」가 저장소에 없는 주소를 되살린다 */
      if(it.type === 'table'){
        const body = li.querySelector('tbody');
        it.tbase = body ? body.cloneNode(true) : null;
      }
    });

    parcel.forEach((p, at) => {
      const node = (doc.sections || [])[at];
      if(!node) return;
      if(node.id && node.id !== p.box.dataset.nsec){
        edSecs.delete(p.box.dataset.nsec);
        p.box.dataset.nsec = node.id;
        if(p.sec) edSecs.set(node.id, p.sec);
      }
      if(p.sec){
        p.sec.isNew = false;
        p.sec.moved = false;
        p.sec.base = node.title || '';
        p.box.classList.remove('ed-new');
      }
      walk(p.kids, node.items || []);
    });
    /* 지운 칸도, **이름도 줄도 없어져 저장에 나가지 않은 칸**도 저장소에는
       없다. 화면에서 걷는다 — 남겨 두면 그 칸은 돌아온 문서에 짝이 없어
       기준선이 낡은 채로 굳고, 저장 창구가 「1칸 이름 고침」을 영영 센다.
       새로 세워 아직 비어 있는 칸은 적으라고 둔 자리라 그대로 둔다 */
    const sent = new Set(parcel.map(p => p.box));
    [...edSecs.values()].forEach(sec => {
      if(sec.del || (!sent.has(sec.box) && !sec.isNew)) edSecForget(sec);
    });
    edSecEnsure();
    /* 지운 줄은 저장소에서 사라졌다. 화면에서도 걷는다 — 남겨 두면 그어진
       채로 붙어 있으면서 저장 창구가 「1줄 지움」을 영영 세고, 떠날 때
       붙잡기까지 한다 */
    [...edItems.values()].forEach(it => { if(it.del) edForget(it); });
    /* 자리의 기준선은 **다 걷어낸 뒤에** 잡는다. 지운 줄과 칸이 아직 화면에
       있을 때 재면, 그것이 사라지는 순간 이웃들이 「옮겨졌다」가 되고 되돌리기는
       없는 자리를 짚는다 */
    edItems.forEach(it => { if(it.li.isConnected) it.home = edWhereKey(it); });
    edSecs.forEach(sec => { if(sec.box.isConnected) sec.home = edSecWhere(sec.box); });
    edDoc = doc;
    if(edTitle) edTitle.base = edTitle.input.value.trim();
    edMvSync();
    edSecSync();
  }

  /**
   * 저장 — 공지 문서를 **통째로** 보낸다.
   *
   * 무게 상한이 없다. 줄마다 따로 보내지 않으므로 통째로 들어가거나 통째로
   * 거절되고, 반쯤 들어간 상태가 생기지 않는다.
   */
  async function edSave(){
    edSweep();
    if(!edPending().length) return;
    if(!edDoc){
      edMsg('공지가 없습니다 — 「＋ 새 공지」로 먼저 만들어 주세요', true);
      return;
    }
    edItems.forEach(it => edClearNote(it));
    edClearPanels();
    document.querySelector('[data-edsave]').disabled = true;
    edMsg('저장 중…');

    const parcel = edParcel();
    let out;
    try {
      out = await ED.call('PUT', '/notice/doc', {
        slug: CLIENT, noticeId: edDoc.noticeId, version: edDoc.version,
        title: edTitle ? edTitle.input.value.trim() : (edDoc.title || ''),
        sections: parcel.map(p => p.row),
      });
    } catch(e){
      /* 판이 어긋났다 — 다른 담당자가 먼저 저장했다. 화면에 적어 둔 글은
         그대로 두고 저장소의 지금 내용을 나란히 보여 준다 */
      if(e.status === 409 && e.data && e.data.current){
        edConflict(e.data.current);
        edMsg('다른 담당자가 먼저 저장했습니다 — 아래에서 견주어 주세요', true);
      } else {
        edMsg(edErr(e, '저장하지 못했습니다'), true);
      }
      edStatus();
      return;
    }

    edAdoptDoc(parcel, out);
    edHist.length = edAhead.length = 0;
    /* 재빌드 신호가 나갔는지는 중계 서버만 안다. 안 나갔는데 「1~2분 뒤 반영」을
       띄우면 담당자는 닿지 않을 것을 닿았다고 읽는다 */
    edMsg(out.rebuild === 'sent' ? '저장했습니다 · 1~2분 뒤 반영'
      : out.rebuild === 'empty' ? '저장했습니다 · 한 줄 이상 적어야 화면에 오릅니다'
      : '저장했습니다 · 클라이언트 화면은 다음 빌드에 바뀝니다');
    edStatus();
  }

  /**
   * 어긋남 — 다른 담당자가 먼저 저장했다.
   *
   * 어느 쪽을 남길지는 담당자가 고른다. 여기서 자동으로 고르면 둘 중 하나가
   * 말없이 사라진다. 화면에 적어 둔 글은 손대지 않는다.
   */
  function edConflict(cur){
    edClearConflict();
    const bar = document.getElementById('edbar');
    if(!bar) return;
    const lines = [];
    const walk = (list, depth) => (list || []).forEach(i => {
      lines.push(`<div class="cf-l" style="padding-left:${depth * 12}px">${
        noticeHtml(i.html || '') || '<span class="cf-e">(빈 줄)</span>'}</div>`);
      walk(i.items, depth + 1);
    });
    (cur.sections || []).forEach(s => {
      if(s.title) lines.push(`<div class="cf-h">${esc(s.title)}</div>`);
      walk(s.items, 0);
    });

    const box = document.createElement('div');
    box.className = 'ed-cf';
    box.id = 'edcf';
    box.innerHTML = `<div class="cf-t">저장소의 지금 공지
        <span class="cf-v">${esc(String(cur.title || '(제목 없음)'))}</span></div>
      <div class="cf-b">${lines.join('') || '<div class="cf-e">(줄이 없습니다)</div>'}</div>
      <div class="cf-a"><button class="edt-b" data-cftake>지금 내용으로 다시 열기</button>
        <button class="edt-b" data-cfclose>닫기</button></div>`;
    bar.parentElement.insertBefore(box, bar.nextSibling);
    box.querySelector('[data-cfclose]').onclick = edClearConflict;
    box.querySelector('[data-cftake]').onclick = () => {
      if(!confirm('화면에 적어 둔 것을 버리고 저장소의 지금 공지를 엽니다.')) return;
      edClearConflict();
      edLoaded = false;
      edForgetAll();
      edLoad();
    };
  }

  function edClearConflict(){
    const old = document.getElementById('edcf');
    if(old) old.remove();
  }

  /* 저장 시각. 담당자가 사는 시간대로 「09-08 14:30」 */
  function edWhen(iso){
    const t = Date.parse(iso || '');
    if(!Number.isFinite(t)) return '';
    const d = new Date(t + 9 * 3600 * 1000);
    const p2 = n => String(n).padStart(2, '0');
    return `${p2(d.getUTCMonth() + 1)}-${p2(d.getUTCDate())} ` +
           `${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`;
  }

  /**
   * 지난 판 목록. 저장할 때마다 **직전** 문서가 한 판씩 쌓인 것이다.
   *
   * 노션이 공짜로 주던 버전 기록을 대신한다. 없으면 담당자가 한 번 실수했을
   * 때 복구할 수단이 아예 없다.
   */
  async function edRevisions(){
    edClearPanels();
    if(!edDoc){ edMsg('공지가 없습니다', true); return; }

    edMsg('지난 판을 불러오는 중…');
    let out;
    try {
      out = await ED.call('GET', '/notice/doc/revisions' +
        `?slug=${encodeURIComponent(CLIENT)}` +
        `&noticeId=${encodeURIComponent(edDoc.noticeId)}`);
    } catch(e){ edMsg(edErr(e, '지난 판을 불러오지 못했습니다'), true); return; }
    edMsg('');

    const bar = document.getElementById('edbar');
    if(!bar) return;
    const rows = out.revisions || [];
    const box = document.createElement('div');
    box.className = 'ed-cf';
    box.id = 'edrv';
    box.innerHTML = `<div class="cf-t">지난 판
        <span class="cf-v">${rows.length ? `${rows.length}개 · 최근 스무 판까지 남습니다`
                                         : '아직 없습니다'}</span></div>
      ${rows.length ? `<div class="cf-b">${rows.map(r => `<div class="rv-l">
        <span class="rv-w">${esc(edWhen(r.savedAt))}</span>
        <span class="rv-t">${esc(r.title || '(제목 없음)')}</span>
        <button class="edt-b" data-rv="${r.version}">이 판으로</button>
      </div>`).join('')}</div>` : ''}
      <div class="cf-a"><button class="edt-b" data-cfclose>닫기</button></div>`;
    bar.parentElement.insertBefore(box, bar.nextSibling);
    box.querySelector('[data-cfclose]').onclick = edClearPanels;
    box.querySelectorAll('[data-rv]').forEach(b => {
      b.onclick = () => edRestore(Number(b.dataset.rv));
    });
  }

  /**
   * 그 판으로 되돌린다. **되돌리기도 저장이다** — 새 판이 되므로 되돌린 것도
   * 다시 되돌릴 수 있고, 재빌드도 똑같이 걸린다.
   */
  async function edRestore(version){
    /* 화면에 손대 둔 것이 있으면 먼저 묻는다. 되돌리면 그것은 사라진다 */
    if(edPending().length &&
       !confirm(`손대 둔 ${edPending().length}개가 사라집니다. 그래도 되돌리시겠습니까?`)) return;
    if(!confirm(`${version} 판으로 되돌립니다.\n\n` +
                '지금 내용도 판으로 남아 다시 되돌릴 수 있습니다.\n' +
                '1~2분 뒤 클라이언트 화면에 반영됩니다.')) return;

    edMsg('되돌리는 중…');
    let out;
    try {
      out = await ED.call('POST', '/notice/doc/restore', {
        slug: CLIENT, noticeId: edDoc.noticeId, version: edDoc.version, revision: version,
      });
    } catch(e){
      if(e.status === 409 && e.data && e.data.current){
        edConflict(e.data.current);
        edMsg('다른 담당자가 먼저 저장했습니다 — 아래에서 견주어 주세요', true);
      } else {
        edMsg(edErr(e, '되돌리지 못했습니다'), true);
      }
      return;
    }

    edClearPanels();
    edDoc = out;
    edLoaded = true;
    /* 장부를 먼저 비운다. 남겨 두면 `go` 가 「저장하지 않은 것이 있다」고
       한 번 더 묻고, 담당자가 거기서 취소하면 화면은 되돌리기 전 그대로인데
       손에 쥔 문서만 새것이 된다 */
    edForgetAll();
    notice = edDocView(out);
    go('notice');
    edMsg(`${version} 판으로 되돌렸습니다 · 1~2분 뒤 반영`);
  }

  function edClearPanels(){
    edClearConflict();
    const rv = document.getElementById('edrv');
    if(rv) rv.remove();
  }

  /* 저장 전이라면 되돌린다. 저장소에는 아직 아무것도 나가지 않았다 */
  function edUndo(){
    const pend = edPending();
    if(!pend.length) return;
    /* 「줄」이라 하지 않는다 — 제목도 여기에 함께 세어져 있다 */
    if(!confirm(`손댄 것 ${pend.length}개를 되돌립니다. 저장 전이라 저장소는 그대로입니다.`)) return;
    let whole = true;
    pend.forEach(p => {
      if(p.op === 'title'){
        edTitle.input.value = edTitle.base;
        return;
      }
      if(p.op === 'secadd'){ edSecForget(p.sec); return; }
      if(p.op === 'secdel'){ p.sec.del = false; edSecSync(); return; }
      if(p.op === 'secname'){ p.sec.nsx.textContent = p.sec.base; edSecSync(); return; }
      if(p.op === 'secmove'){ whole = edSecUndo(p.sec) && whole; return; }
      if(p.op === 'add'){ edForget(p.it); return; }
      if(p.op === 'remove'){ edMarkDel(p.it, false); return; }
      if(edStruct(p.op)){ whole = edUndoOne(p.it) && whole; return; }
      if(p.it.type === 'table'){ edTableUndo(p.it); return; }
      edPaint(p.it, p.it.base);
      p.it.li.classList.remove('ed-dirty', 'ed-fail');
      edClearNote(p.it);
    });
    edSweep();   /* 쓰지 않은 빈 줄도 함께 걷는다 — 저장에는 안 나가지만 보인다 */
    edStatus();
    /* 하나라도 제자리를 못 찾았으면 `edUndoOne` 이 남긴 말을 지우지 않는다 */
    if(whole) edMsg('');
  }

  /* 저장하지 않은 것이 있으면 붙잡는다. 화면을 떠나면 그대로 사라진다 */
  function edMayLeave(){
    const n = edPending().length;
    return !n || confirm(`저장하지 않은 것이 ${n}개 있습니다. 두고 나가시겠습니까?`);
  }

  /* ── 서식 막대 ──
     글자를 고르면 그 위에 뜬다. 노션이 받는 서식 여섯 가지뿐이다. 글자색
     고르개는 만들지 않는다(스펙 #18) — 이미 칠해진 색은 고쳐도 그대로 남는다 */
  let edTb = null;
  function edToolbar(){
    if(edTb) return edTb;
    edTb = document.createElement('div');
    edTb.className = 'ed-tb';
    edTb.innerHTML = `
      <button data-edc="bold" title="굵게 (Ctrl+B)"><b>B</b></button>
      <button data-edc="italic" title="기울임 (Ctrl+I)"><i>I</i></button>
      <button data-edc="underline" title="밑줄 (Ctrl+U)"><u>U</u></button>
      <button data-edc="strikeThrough" title="취소선"><s>S</s></button>
      <button data-edc="code" title="코드">&lt;&gt;</button>
      <button data-edc="link" title="링크">🔗</button>
      <button data-edc="palette" title="글자 색 · 형광펜">🎨</button>
      <div class="ed-pal">${
        /* 윗줄은 글자 색, 아랫줄은 형광펜. 견본 자체에 `data-c` 를 달아 두면
           팔레트를 따로 칠할 일이 없다 — 화면에 나올 색을 그대로 보여 준다 */
        ['default'].concat(ED_COLORS).map(c =>
          `<button data-col="${c}"${c === 'default' ? ' title="색 없애기"'
            : ` data-c="${c}"`}>${c === 'default' ? '✕' : '가'}</button>`).join('')
        + ED_COLORS.map(c =>
          `<button data-col="${c}_background" data-c="${c}_background">가</button>`).join('')}
      </div>`;
    /* 누를 때 고른 글자가 풀리지 않게 한다 — 풀리면 서식이 갈 곳이 없다 */
    edTb.onmousedown = e => e.preventDefault();
    edTb.onclick = e => {
      const sw = e.target.closest('[data-col]');
      if(sw){ edColor(sw.dataset.col); return; }
      const b = e.target.closest('[data-edc]');
      if(!b) return;
      if(b.dataset.edc === 'palette'){ edTb.classList.toggle('pal'); return; }
      edFormat(b.dataset.edc);
    };
    document.body.appendChild(edTb);
    return edTb;
  }

  /** 노드가 무엇이든 closest() 를 물을 수 있는 요소로 */
  const edEl = n => n && (n.nodeType === 1 ? n : n.parentElement);

  /** 지금 고른 글자가 든 편집 가능한 항목. 아니면 null */
  function edEditable(node){
    const el = edEl(node);
    return (el && el.closest('.nx[contenteditable="true"]')) || null;
  }

  function edSelection(){
    const tb = edToolbar();
    const sel = document.getSelection();
    if(!sel || !sel.rangeCount || sel.isCollapsed){
      tb.classList.remove('on', 'pal');
      return null;
    }
    /* 두 줄에 걸쳐 골랐으면 서식 막대를 내리지 않는다. 편집기가 남의 칸에는
       손을 못 대므로, 눌러도 한 줄만 굵어진다 — 그럴 바에는 안 뜨는 것이 낫다 */
    const nx = edEditable(sel.anchorNode);
    if(!nx || nx !== edEditable(sel.focusNode)){
      tb.classList.remove('on', 'pal');
      return null;
    }
    tb.classList.add('on');
    const r = sel.getRangeAt(0).getBoundingClientRect();
    tb.style.left = Math.max(8, r.left + r.width / 2 - tb.offsetWidth / 2) + 'px';
    tb.style.top = Math.max(8, r.top - tb.offsetHeight - 7) + 'px';
    return nx;
  }

  function edFormat(cmd){
    edMark();
    const nx = edSelection();
    if(!nx) return;
    if(cmd === 'code') edCodeWrap(nx);
    else if(cmd === 'link') edLinkWrap(nx);
    else document.execCommand(cmd);
    const it = edOf(nx);
    if(it) edTouch(it);
    edSelection();
  }

  /**
   * 중계 서버가 받아 주는 색 이름. 노션의 것 그대로다(`worker/src/richtext.js`
   * 의 COLORS). `_background` 를 붙이면 형광펜이 된다.
   */
  const ED_COLORS = ['gray', 'brown', 'orange', 'yellow', 'green',
                     'blue', 'purple', 'pink', 'red'];

  function edColor(color){
    edMark();
    const nx = edSelection();
    if(!nx) return;
    edColorWrap(nx, color);
    const it = edOf(nx);
    if(it) edTouch(it);
    edSelection();
  }

  /**
   * 고른 글자에 색을 입힌다. 굵게·기울임과 달리 `execCommand` 에 없어 직접 감싼다.
   *
   * **색은 겹치지 않는다.** 고른 만큼이 한 가지 색이 되어야 하므로 안에 들어
   * 있던 색은 걷는다 — 겹쳐 두면 저장할 때 안쪽만 살아남아, 화면에서 본 것과
   * 저장된 것이 갈린다.
   */
  function edColorWrap(nx, color){
    const sel = document.getSelection();
    if(!sel.rangeCount) return;
    const r = sel.getRangeAt(0);
    const shed = (el) => {                 /* 껍질 하나를 걷고 그 자리를 돌려준다 */
      const parent = el.parentNode;
      while(el.firstChild) parent.insertBefore(el.firstChild, el);
      parent.removeChild(el);
      return parent;
    };
    if(color === 'default'){
      /* 이미 색이 든 조각 안이다 — 통째로 푼다. 고른 만큼만 푸는 것은 만들지
         않는다. 코드 서식과 같은 규칙이다. 겹쳐 있으면 겹친 만큼 다 푼다 */
      let from = edEl(r.startContainer), own;
      while(from && (own = from.closest('[data-c]')) && nx.contains(own)) from = shed(own);
      if(from) from.normalize();
      return;
    }
    const span = document.createElement('span');
    span.dataset.c = color;
    span.appendChild(r.extractContents());
    span.querySelectorAll('[data-c]').forEach(shed);
    r.insertNode(span);
    /* 겉을 감싸던 색이 이 조각 하나만 품고 있었으면 걷는다. 그러지 않으면 같은
       자리를 다시 칠할 때마다 껍질이 한 겹씩 늘고, 저장할 때는 안쪽만 살아남아
       화면과 저장된 것이 갈린다 */
    for(let up = span.parentElement; up && up !== nx && up.dataset.c !== undefined;){
      if(up.textContent !== span.textContent) break;
      up = shed(up);
    }
    const nr = document.createRange();
    nr.selectNodeContents(span);
    sel.removeAllRanges();
    sel.addRange(nr);
  }

  /* 인라인 코드. execCommand 에 없어 직접 감싼다 */
  function edCodeWrap(nx){
    const sel = document.getSelection();
    const r = sel.getRangeAt(0);
    const from = edEl(r.startContainer);
    const now = from && from.closest('code');
    if(now && nx.contains(now)){
      /* 이미 코드다 — 통째로 푼다. 고른 만큼만 푸는 것은 만들지 않는다 */
      const parent = now.parentNode;
      while(now.firstChild) parent.insertBefore(now.firstChild, now);
      parent.removeChild(now);
      parent.normalize();
      return;
    }
    const code = document.createElement('code');
    code.appendChild(r.extractContents());
    r.insertNode(code);
    const nr = document.createRange();
    nr.selectNodeContents(code);
    sel.removeAllRanges();
    sel.addRange(nr);
  }

  function edLinkWrap(nx){
    const sel = document.getSelection();
    const el = edEl(sel.anchorNode);
    const now = el && el.closest('a');
    const url = prompt('링크 주소 — 지우려면 비워 두세요',
                       (now && nx.contains(now) && now.getAttribute('href')) || 'https://');
    if(url === null) return;
    const clean = url.trim();
    if(!clean){ document.execCommand('unlink'); return; }
    /* 중계 서버가 받는 주소만 넣는다. 여기서 막지 않으면 저장할 때
       그 줄만 거절당하고, 담당자는 왜 그 줄만 실패했는지 모른다 */
    if(!/^(https?:|mailto:)/i.test(clean)){
      alert('http · https · mailto 주소만 넣을 수 있습니다.');
      return;
    }
    document.execCommand('createLink', false, clean);
  }

  /**
   * @param {{keep?:boolean}} [opt] `keep` 이면 저장소에서 공지를 다시
   *        불러오지 않는다. 한 걸음 되돌린 뒤가 그렇다 — 화면에 있는 글이
   *        곧 되돌린 결과라, 저장소의 글로 덮으면 되돌린 것이 사라진다.
   */
  function bindEditItems(opt){
    if(!ED.on()) return;
    /* 편집기가 style 대신 태그를 내게 한다. style 로 내면 되읽을 때
       중계 서버가 모르는 것이 되어 그 줄이 거절당한다 */
    try { document.execCommand('styleWithCSS', false, false); } catch(_){}

    document.querySelectorAll('.ck li[data-nid]').forEach(li => {
      const nx = li.querySelector(':scope>.nx, :scope>.tgh>.nx');
      if(!nx) return;
      if(!nx.parentElement.querySelector(':scope>.nx-del'))
        nx.insertAdjacentHTML('afterend', delBtn());
      bindDelete(nx);
    });

    const bar = document.getElementById('edbar');
    if(bar){
      bar.querySelector('[data-edsave]').onclick = edSave;
      bar.querySelector('[data-edundo]').onclick = edUndo;
      bar.querySelector('[data-edrev]').onclick = edRevisions;
    }
    const newBtn = document.querySelector('[data-ednew]');
    if(newBtn) newBtn.onclick = edNewNotice;
    /* 칸 끝에 빈 줄 하나를 세우고 커서를 그리로 보낸다. 저장을 눌러야
       나가는 것은 다른 줄과 같다 */
    document.querySelectorAll('.notice').forEach(bindNoticeBox);
    const secAdd = document.querySelector('[data-nsadd]');
    if(secAdd) secAdd.onclick = () => edSecAdd();

    /* 화면을 다시 그릴 때마다 묶으면 같은 것이 겹쳐 쌓인다 */
    if(!edWired){
      edWired = true;
      document.addEventListener('selectionchange', () => { edSelection(); edPickPaint(); });
      /* 한글을 짓기 시작할 때도 걸음을 뜬다. 조합 중에는 keydown 을 가로채지
         않으므로, 여기서 뜨지 않으면 한글로 적은 글은 되돌릴 수가 없다 */
      document.addEventListener('compositionstart', e => {
        if(ED.on() && edEditable(e.target)) edMark(true);
      }, true);
      const sc = document.getElementById('scroll');
      if(sc) sc.addEventListener('scroll', () => { if(edTb) edTb.classList.remove('on'); });
      window.addEventListener('beforeunload', e => {
        if(!edPending().length) return;
        e.preventDefault();
        e.returnValue = '';
      });
    }
    if(!(opt && opt.keep)) edLoad();
  }

  /* 지우기 단추. .nx 바깥에 둔다 — 안에 두면 고치는 글의 일부가 되어
     노션에 딸려 들어간다. 지우기로 표시해 둔 줄에서는 「되돌리기」가 된다 */
  const delBtn = () => `<button class="nx-del" data-ndel title="이 줄 지우기">✕</button>`;

  function edDelBtn(it){
    const btn = it.nx.parentElement.querySelector(':scope>.nx-del');
    if(!btn) return;
    btn.classList.toggle('undo', !!it.del);
    btn.textContent = it.del ? '되돌리기' : '✕';
    btn.title = it.del ? '지우기를 물린다' : '이 줄 지우기';
  }

  /**
   * 지울 줄로 표시한다. **저장소에는 아직 나가지 않는다** — 저장이 함께 내보낸다.
   *
   * 화면에서 치우지 않고 그은 채로 남기는 까닭은 둘이다. 저장 전에 무엇이
   * 사라질지 세어 볼 수 있어야 하고, 잘못 눌렀을 때 되돌릴 곳이 그 자리에
   * 있어야 한다. 방금 보탠 줄만은 그냥 없앤다 — 되돌릴 것이 없다.
   */
  function edMarkDel(it, on){
    edMark();
    if(on && it.isNew){ edForget(it); return; }
    it.del = !!on;
    it.li.classList.toggle('ed-del', it.del);
    if(it.del){
      it.nx.removeAttribute('contenteditable');
      edClearNote(it);
      it.li.classList.remove('ed-fail');
    } else {
      it.nx.contentEditable = 'true';
    }
    edDelBtn(it);
    edMvSync();   /* 지울 줄은 옮기지도, 종류를 바꾸지도 않는다 */
    edStatus();
  }

  /* 화면과 장부에서 통째로 지운다. 안에 든 줄도 함께 — 노션이 그릇을 지울 때
     하는 것과 같다 */
  function edForget(it){
    it.li.querySelectorAll('li[data-nid], td[data-nid]')
      .forEach(k => edItems.delete(k.dataset.nid));
    edItems.delete(it.li.dataset.nid);
    it.li.remove();
    edTrimLists();
    edMvSync();
    edStatus();
  }

  function bindDelete(nx){
    const btn = nx.parentElement.querySelector(':scope>.nx-del');
    if(!btn) return;
    /* 항목은 그때 찾는다. 이 단추는 편집용 원본이 오기 전에 붙고, 보탠 줄은
       저장되면서 주소가 바뀐다 */
    btn.onclick = e => {
      e.stopPropagation();                   /* 토글이 접히지 않게 */
      const it = edOf(nx);
      if(!it) return;
      if(it.del){ edMarkDel(it, false); return; }

      /* 그릇을 지우면 그 안의 줄도 함께 간다. 몇 줄이 딸려 가는지 먼저
         말해 준다 — 지운 뒤에 알면 늦다 */
      const kids = it.li.querySelectorAll('li[data-nid]').length;
      const text = nx.textContent.trim().slice(0, 60) || '(빈 줄)';
      if(it.isNew || confirm(`이 줄을 지웁니다.\n\n${text}` +
            (kids ? `\n\n안에 든 ${kids}줄도 함께 지워집니다.` : '') +
            '\n\n「저장」을 눌러야 실제로 사라집니다.')) edMarkDel(it, true);
    };
  }

  /* 실패를 사람 말로. 상태 코드는 화면에 내보내지 않는다 */
  function edErr(e, fallback){
    return e.status === 401 ? '편집 모드가 풀렸습니다. 끄고 다시 켜 주세요'
         : e.status === 409 ? '다른 담당자가 먼저 저장했습니다'
         : e.status === 422 ? `쓰신 내용을 확인해 주세요 — ${e.message}`
         : e.status === 404 ? '그 공지를 찾지 못했습니다'
         : e.status === 503 ? '공지 저장소가 아직 붙어 있지 않습니다'
         : fallback;
  }

  /* 보탠 줄이 들어갈 목록. 옛 봉투로 열린 화면에는 목록 대신 「등록된 내용이
     없습니다」 한 줄뿐이라, 그 자리에 목록을 세우지 않으면 갈 곳이 없다 */
  function sectionList(bd){
    if(!bd) return null;
    let list = bd.querySelector(':scope>ul.ck');
    if(!list){
      const empty = bd.querySelector(':scope>.empty');
      list = document.createElement('ul');
      list.className = 'ck';
      bd.insertBefore(list, empty || bd.querySelector(':scope>.ntail'));
      if(empty) empty.remove();
    }
    return list;
  }

  /* 섹션을 고르지 않았을 때 — 공지 맨 끝 목록이다. 옛 봉투로 열렸거나 공지가
     통째로 비어 있으면 목록이 하나도 없어, 마지막 구역에 하나 세운다 */
  function lastList(){
    const lists = document.querySelectorAll('.notice .bd>ul.ck');
    if(lists.length) return lists[lists.length - 1];
    const bds = document.querySelectorAll('.notice .bd');
    const bd = bds[bds.length - 1];
    if(!bd) return null;
    const list = document.createElement('ul');
    list.className = 'ck';
    bd.appendChild(list);
    const empty = bd.querySelector(':scope>.empty');
    if(empty) empty.remove();
    return list;
  }

  /** 보탠 줄에 붙는 임시 이름. 저장하면 중계 서버가 지은 주소로 갈린다 */
  let edSeq = 0;

  /** 공지는 대부분 글머리 기호다. 보탠 줄은 글머리로 시작한다 */
  /* 보탠 줄이 그 종류로 보이게. 클라이언트 화면을 그리는 표를 그대로 쓴다 —
     할 일만 따로인 것은 그 표가 체크 여부까지 함께 셈하기 때문이다 */
  const edNewCls = t => t === 'todo' ? 'chk' : (KIND_CLS[t] || 'plain');

  function edNewRow(type){
    edSeq += 1;
    const li = document.createElement('li');
    li.className = `${edNewCls(type)} ed-new`;
    li.dataset.nid = `new-${edSeq}`;
    li.innerHTML = `<span class="nx"></span>${delBtn()}`;
    return li;
  }

  /**
   * 빈 줄 하나를 세우고 커서를 그리로 보낸다. **저장소에는 나가지 않는다** —
   * 저장이 다른 줄과 함께 내보낸다.
   *
   * @param {function} mount 세운 li 를 화면 어디에 놓을지. **놓은 그 자리가
   *                          곧 저장될 자리다** — 저장이 화면을 걸어 다니며
   *                          문서를 다시 짓기 때문이다
   * @param {{type?:string, html?:string, atStart?:boolean}} [opts]
   *        종류를 물려받거나(줄을 쪼갤 때 윗줄의 종류가 그대로 온다), 떼어 낸
   *        뒤쪽 글을 안고 서거나, 커서를 줄 처음에 두고 싶을 때 준다
   */
  function edAdd(mount, opts){
    edMark();
    const o = opts || {};
    const type = o.type || 'bullet';
    const li = edNewRow(type);
    const nx = li.querySelector(':scope>.nx');
    const it = edItem(li, nx, {base: '', isNew: true, type});
    mount(li);
    edItems.set(li.dataset.nid, it);
    if(o.html){ nx.innerHTML = o.html; edSeal(nx); }
    nx.contentEditable = 'true';
    nx.spellcheck = false;
    edBindItem(it);
    bindDelete(nx);
    /* 보탠 줄도 저장 전에 옮기고 들여쓴다. 화면에 놓인 자리가 곧 저장될
       자리라, 주소가 아직 없다는 것은 아무 상관이 없다 */
    edMvBox(it);
    edHint(it);
    if(!o.quiet){
      li.scrollIntoView({block: 'nearest'});
      if(o.atStart) edFocusStart(nx); else edFocusEnd(nx);
    }
    edMvSync();   /* 이웃들의 사정이 바뀐다 — 보탠 줄은 발판이 되지 못한다 */
    edStatus();
    return it;
  }

  /**
   * 오늘 날짜로 새 공지를 만들고 그 자리에서 연다.
   *
   * 날짜를 고르는 창은 띄우지 않는다 — 미팅 직후 기록이 목적이라 거의 언제나
   * 오늘이다.
   *
   * **공지가 한 건도 없는 기업의 첫 공지도 이 길로 만든다.** 저장소가 비어
   * 있는 채로 시작하므로, 이사한 뒤 모든 기업의 첫 공지가 여기서 난다.
   *
   * 만들면 화면에 떠 있던 줄들을 통째로 버린다. 그 줄들은 지난 공지의 것이고,
   * 저장 창구는 이제 새 공지를 가리킨다 — 그대로 두면 담당자는 화면에 보이는
   * 줄을 고치고서 남의 공지에 적게 된다.
   */
  async function edNewNotice(){
    if(!edMayLeave()) return;
    /* 빌더는 가장 최근 공지 하나만 페이지에 올린다. 만드는 순간 지난 공지는
       클라이언트 화면에서 내려간다 — 누르기 전에 그것부터 말한다 */
    if(!confirm('오늘 날짜로 새 공지를 만듭니다.\n\n' +
                '다음 빌드부터 클라이언트에게는 이 공지가 보입니다. ' +
                '지난 공지는 저장소에 그대로 남습니다.\n\n' +
                '제목과 내용을 적고 「저장」을 눌러 주세요.')) return;

    edMsg('새 공지를 만드는 중…');
    let out;
    try { out = await ED.call('POST', '/notice/doc', {slug: CLIENT}); }
    catch(e){ edMsg(edErr(e, '새 공지를 만들지 못했습니다'), true); return; }

    edClearPanels();
    edForgetAll();
    edDoc = out;
    edLoaded = true;
    notice = edDocView(out);
    go('notice');
    /* 제목 칸에 커서를 둔다. 갓 만든 공지에서 담당자가 처음 할 일이 그것이다 */
    if(edTitle) edTitle.input.focus();
    edMsg(out.existing ? '오늘 만들어 둔 공지가 있어 그리로 왔습니다'
                       : '새 공지를 만들었습니다');
  }

  /* 공지 요약 카드 — 조달현황 옆자리. 섹션 제목을 접었다 펴는 형태다.
     내용은 공지 화면과 같은 데이터에서 오고, 접힌 안쪽만 첫 단계 항목이다.
     「전체 보기」는 전문(V.notice)으로 보낸다. */
  const SUMMARY_MAX = 5;
  function noticeCard(){
    const secs = (notice && notice.sections || []).filter(s => (s.items||[]).length);
    const shown = secs.slice(0, SUMMARY_MAX);
    const rest = secs.length - shown.length;
    return `<div class="p2c">
      <div class="p2hd"><span class="p2hd-t">${esc(noticeLabel)}</span>
        ${notice && notice.date ? `<span class="p2hd-d">${esc(notice.date)}</span>` : ''}
        <a class="p2hd-a" href="#" data-go="notice">전체 보기 →</a></div>
      <div class="p2pad"><div class="p2nt">
       ${shown.length
         ? shown.map(s => `<details>
        <summary>${s.heading_html ? noticeHtml(s.heading_html) : esc(s.heading || '')}</summary>
        <div class="p2nt-b"><ul class="ck">${
          s.items.map(i => noticeItem(i, 1)).join('')}</ul></div>
       </details>`).join('') + (rest > 0
            ? `<p class="empty" style="padding:10px 0 0">외 ${rest}건</p>` : '')
         : `<p class="empty" style="padding:12px 0">등록된 내용이 없습니다.</p>`}
      </div></div>
     </div>`;
  }

  /* 일정 — 구글 캘린더의 미팅, progress 의 종료 예정일, recommend 의 마감일.
     이벤트가 없어도 달력은 그대로 둔다. */
  const KIND = { meeting:{label:'미팅', dot:'var(--ok)'},
                 project:{label:'진행', dot:'var(--accent)'} };
  const kindOf = e => KIND[e.kind] || KIND.project;

  function calMonth(y,m){
    const first=new Date(y,m-1,1), last=new Date(y,m,0).getDate(), lead=first.getDay();
    /* 날짜별 점 색. 같은 날 여러 건이면 먼저 오는 건의 종류를 쓴다 */
    const dot=new Map();
    events.filter(e=>String(e.date||'').startsWith(`${y}-${pad2(m)}`))
      .forEach(e=>{ const d=+String(e.date).slice(8);
        if(!dot.has(d)) dot.set(d, kindOf(e).dot); });
    let c=''; ['일','월','화','수','목','금','토'].forEach(w=>c+=`<span class="wk">${w}</span>`);
    for(let i=0;i<lead;i++) c+='<span class="dim"></span>';
    for(let d=1;d<=last;d++){
      const iso=`${y}-${pad2(m)}-${pad2(d)}`;
      const cls=iso===TODAY?'tdy':dot.has(d)?'ev':'';
      const st=(cls==='ev')?` style="--dot:${dot.get(d)}"`:'';
      c+=`<span class="${cls}"${st}>${d}</span>`;
    }
    return `<div class="cal"><h4>${m}월</h4><div class="cal-g">${c}</div></div>`;
  }

  /* 오른쪽 목록은 5건까지만 — 달력 2개월이 200px 남짓인데 목록이 12건이면
     카드 오른쪽만 길어져 아래 표가 밀린다. 달력 점은 자르지 않는다.
     우리가 진행 중인 건(project)이 남의 마감 공고에 밀리지 않도록 먼저 놓는다. */
  const EVENT_SHOWN_MAX = 5;
  /* 미팅이 남의 마감 공고에 밀리면 안 된다 */
  const KIND_ORDER = { meeting:0, project:1 };
  const eventsRanked = [...events].sort((a,b)=>
    (KIND_ORDER[a.kind] ?? 9) - (KIND_ORDER[b.kind] ?? 9)
    || String(a.date||'').localeCompare(String(b.date||'')));

  function eventItem(e){
    const k = kindOf(e);
    /* 지난 건은 D-day 대신 상태를 쓴다 — 진행은 「종료」, 마감은 「마감」 */
    const left = e.past ? (e.kind==='meeting' ? '지남' : '종료') : (e.dday || '');
    /* 7일 이내만 강조. D-DAY 도 임박으로 본다 */
    const n = /^D-(\d+)$/.exec(e.dday || '');
    const soon = !e.past && (e.dday === 'D-DAY' || (n && +n[1] <= 7));
    /* D-day 는 왼쪽 열에 이미 있다. 여기서는 날짜와 단계만 */
    /* 미팅은 시각이 있다. 종일 일정이면 time 이 없어 날짜만 나온다 */
    const when = [String(e.date||'').slice(5).replace('-','/'), e.time]
      .filter(Boolean).join(' ');
    const sub = [when, e.meta].filter(Boolean).map(esc).join(' · ');
    return `<div class="e${e.past?' gone':''}">
      <span class="dd${soon?' soon':''}">${esc(left)}</span>
      <span class="ei">
      <span class="t"><span class="nm">${esc(e.title)}</span><span class="kd">${k.label}</span></span>
      <span class="m">${sub}</span>
      </span></div>`;
  }

  function schedule(limit){
    const now=new Date(), y=now.getFullYear(), m=now.getMonth()+1;
    const ny=m===12?y+1:y, nm=m===12?1:m+1;
    const cap = limit == null ? EVENT_SHOWN_MAX : limit;   /* 인쇄는 전부 낸다 */
    const shown = cap === Infinity ? eventsRanked : eventsRanked.slice(0, cap);
    const rest = eventsRanked.length - shown.length;
    const list = events.length ? shown.map(eventItem).join('') + (rest > 0
      ? `<a class="e emore" href="#" data-go="open">외 ${rest}건 →</a>` : '')
      : '<p class="empty">등록된 일정이 없습니다.</p>';
    return `<div class="card"><div class="ch"><h2>일정</h2></div><div class="cb">
      <div class="cal-w">${calMonth(y,m)}${calMonth(ny,nm)}
      <div class="evl">${list}</div></div></div></div>`;
  }

  /* 화면 */
  const V={};
  /* KPI 「다음 일정」 타일은 아직 안 지난 것 중 가장 가까운 건을 쓴다 */
  const nextEv = events.find(e => !e.past) || null;

  /* 설립연월 표기가 제각각으로 들어온다 — 2024.09 / 2024-09 / 2024-09-15 /
     2024/09 / 2024년 9월 / 2024.9 를 모두 「2024.09」로 맞춘다.
     못 알아보면 원문을 그대로 쓴다. 빈칸으로 만들지 않는다 */
  const foundedTag = raw => {
    const s = String(raw ?? '').trim();
    if (!s) return '';
    const m = s.match(/^(\d{4})\s*[.\-/년]\s*(\d{1,2})(?!\d)/);
    if (m && +m[2] >= 1 && +m[2] <= 12)
      return `${m[1]}.${String(+m[2]).padStart(2,'0')} 설립`;
    /* 못 알아본 값은 원문 그대로 낸다. 「설립」을 덧붙이면
       「설립일 미상 설립」처럼 겹쳐 읽힌다 */
    return s;
  };

  /* 노션 사업내용에 **볼드** 가 섞여 온다. 그것만 <b> 로 바꾸고 나머지
     마크다운은 건드리지 않는다. 짝이 안 맞아 남은 별표는 지운다.
     esc 를 먼저 걸어 태그가 그대로 들어가지 않게 한다 */
  const bizHtml = raw => esc(String(raw ?? ''))
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\*/g, '');

  /* 업종 → 소재지 → 설립. 값이 없는 것은 건너뛰고, 전부 없으면 줄을 안 낸다.
     업종은 기업 DB 「업종분류」가 먼저고, 공유페이지 「업종」도 있으면 뒤에 붙인다 */
  const heroTags = [...new Set([
    ...(CO.industry || []), ...(CO.tags || []),
    CO.address || '', foundedTag(CO.founded),
  ].map(t => String(t ?? '').trim()).filter(Boolean))];

  /* forPrint 면 공지는 요약 대신 전문, 일정은 5건 제한 없이 전부 */
  V.info=(forPrint)=>`
   <div class="hero"><span class="${markCls}">${logoMark(52)}</span><div>
     <h2>${esc(CO.name || CLIENT)}</h2>
     ${CO.biz?`<div class="biz">${bizHtml(CO.biz)}</div>`:''}
     ${heroTags.length?`<div class="tags">${heroTags.map(t=>
        `<span class="htag"><i>#</i>${esc(t)}</span>`).join('')}</div>`:''}
   </div></div>

   <div class="kpi">
    <div class="k1"><div class="k">진행 중</div><div class="v">${kpi.running ?? running.length}<small>건</small></div>
      <div class="s">지원사업 ${running.filter(r=>r.cat==='fund').length} · 인증 ${running.filter(r=>r.cat==='cert').length}</div></div>
    <div class="k1"><div class="k">완료</div><div class="v">${kpi.done ?? 0}<small>건</small></div>
      <div class="s">누적</div></div>
    <div class="k1"><div class="k">취득 인증</div><div class="v">${kpi.certs ?? 0}<small>건</small></div>
      <div class="s">기업인증·지식재산권 완료 건</div></div>
    <div class="k1"><div class="k">다음 일정</div>
      <div class="v">${nextEv?esc(String(nextEv.date).slice(5).replace('-','/')):'—'}</div>
      <div class="s">${nextEv?esc(nextEv.title):'예정된 일정이 없습니다'}</div></div>
   </div>

   ${forPrint
      ? `${hasPerf ? `<div class="p2row">${psumCard()}</div>` : ''}${noticeFeed(false)}`
      : `<div class="p2row"${hasPerf ? '' : ' style="grid-template-columns:1fr"'}>
          ${psumCard()}${noticeCard()}</div>`}
   ${schedule(forPrint ? Infinity : undefined)}

   <div class="card" style="margin-top:24px">
    <div class="ch"><h2>진행 중인 프로젝트</h2><a class="more" href="#" data-go="fund">전체 보기 →</a></div>
    ${running.length?`<table><thead><tr>
     <th style="width:38%">프로젝트</th><th style="width:13%">구분</th>
     <th style="width:18%">단계</th><th style="width:10%">상태</th>
     <th class="num" style="width:21%">지원내용</th></tr></thead>
    <tbody>${running.map(r=>`<tr>
      <td class="lead"><div class="t-nm">${esc(r.title)}${r.joint?'<span class="co">공동</span>':''}</div>
          ${logLine(r)}</td>
      <td class="dtc">${CATNM[r.cat].split('·')[0]}</td>
      <td>${steps(r)}</td><td>${tag(r)}</td>
      <td class="num sup">${support(r)}</td></tr>`).join('')}
    </tbody></table>`:`<div class="cb"><p class="empty">진행 중인 프로젝트가 없습니다.</p></div>`}</div>`;

  /* 분야 — 조달현황 화면과 요약 카드가 같은 기준을 써야 한다. 여기 한 번만
     두고 페이지 끝 조달현황 스크립트가 __PERFCAT__ 으로 읽어 간다.
     색은 시안 고정값이다. 순서가 곧 규칙 우선순위다 — 「해외규격인증」이
     수출로 새지 않게 인증·규격을 수출보다 먼저 본다.
     노션 「프로젝트 유형」이 (런웨이)지원사업 하나로 뭉쳐 있어 수출·마케팅·
     창업이 갈리지 않는다. 유형이 분명한 정책자금만 유형을 따른다. */
  const PCATS = [
    { k:'정책자금·보증', c:'#2563EB' },
    { k:'인증&인허가',   c:'#A855F7', re:/인증|규격|특허|상표|인허가/ },
    { k:'R&D과제',      c:'#EC4899', re:/R&D|기술혁신|디딤돌|연구개발|정책과제/i },
    { k:'고용',         c:'#0EA5E9', re:/고용|일자리|장려금|직업능력|훈련/ },
    { k:'창업사업화',    c:'#F43F5E', re:/창업|창구|액셀러레이터|제작지원|콘텐츠 맞춤형/ },
    { k:'수출',         c:'#10B981', re:/수출|해외|글로벌|물류|게임더하기/ },
    { k:'마케팅&판로',   c:'#F59E0B', re:/혁신바우처|판로|마케팅|소공인|온라인|전시|홍보|브랜드/ },
    { k:'기타',         c:'#94A3B8' },
  ];
  /* 눈금 상한 — 조달현황 화면과 같은 규칙이라 요약과 자세히 보기의
     축이 어긋나지 않는다 */
  function niceMax(v){
    if (v <= 0) return 1;
    const k = Math.pow(10, Math.floor(Math.log10(v)));
    for (const m of [1,2,2.5,4,5,6,8,10]) if (m*k >= v) return m*k;
    return 10*k;
  }
  const pcatOf = p => {
    if (p.type === 'fund') return '정책자금·보증';
    const hit = PCATS.find(c => c.re && c.re.test(String(p.name || '')));
    return hit ? hit.k : '기타';
  };
  /* 분야별로 묶어 금액 순으로 세운다. 빈 분야는 요약에서 뺀다 */
  function pcats(list){
    return PCATS.map(c => {
      const items = (list || []).filter(p => pcatOf(p) === c.k);
      return { k:c.k, c:c.c, items, v: items.reduce((s,p) => s + (+p.amount||0), 0) };
    }).filter(c => c.v > 0).sort((a,b) => b.v - a.v);
  }
  window.__PERFCAT__ = { PCATS, pcatOf, pcats };

  /* 조달현황 요약 — 기업 정보 화면에서 공지사항 옆에 놓는다.
     상단 KPI 타일(진행 중·완료·취득 인증·다음 일정)과 겹치지 않게
     누적 확보금액 하나만 둔다. 지표를 더 붙이지 말 것.
     「자세히 보기」는 셸의 data-go 로 조달현황 화면에 연결된다.

     그림틀은 시안 company-2col-layout-v3 그대로다 — viewBox·막대 x·폭·
     연도 라벨 자리를 고치지 말 것. 데이터에 따라 움직이는 것은 셋뿐이다:
     막대 높이, 눈금 숫자, 막대 위 값. 최근 2개 연도만 그린다. */
  const EOK = 100000000;
  const eok = v => +(v / EOK).toFixed(2);
  /* 눈금 간격. 가운데 눈금이 최대 막대의 절반쯤 오도록 고른다 —
     시안이 최대 4.5억에 눈금 2/4 였던 비율(막대가 위 눈금을 살짝 넘김) */
  const NICE = [0.1,0.25,0.5,1,2,2.5,5,10,25,50,100,250,500];
  const niceStep = max => NICE.find(s => s * 2.2 >= max) || NICE[NICE.length-1];

  function psumCard(){
    if(!hasPerf) return '';
    const cats = pcats(PERF.programs);
    const total = cats.reduce((s,c) => s + c.v, 0);
    const cnt = PERF.programs.length;
    const won = v => v >= 1e8
      ? (Number.isInteger(v/1e8) ? v/1e8 : +(v/1e8).toFixed(2)) + '억원'
      : (v/10000).toLocaleString() + '만원';
    /* 시안 좌표 — 0 이 x=104, 눈금 끝이 x=408 이라 폭이 304px 다.
       막대는 y=20 에서 40 씩 내려가고 높이는 22 다. 고치지 말 것 */
    const X0 = 104, XW = 304, TOP = 20, STEP = 40, BH = 22;
    const n = Math.max(cats.length, 1);
    const gridB = TOP + n*STEP - 8;
    const axY = gridB + 16, H = axY + 22;
    const max = niceMax(cats.length ? cats[0].v/1e8 : 1);
    const S = XW/max;
    /* 값 글씨는 막대 색을 쓰되 노랑만 어둡게 — 흰 바탕에서 안 읽힌다 */
    const vc = c => c === '#F59E0B' ? '#B7791F' : c;

    let g = '';
    [0,.25,.5,.75,1].forEach((f,i) => {
      const x = X0 + XW*f, v = +(max*f).toFixed(2);
      g += `<line x1="${x}" y1="14" x2="${x}" y2="${gridB}"
              stroke="${i===0?'var(--line-2)':'var(--psum-grid)'}" stroke-width="${i===0?1.5:1}"/>
            <text class="psum-ax" x="${x}" y="${axY}" text-anchor="middle">${v.toLocaleString()}</text>`;
    });
    g += `<text class="psum-ax" x="${X0+XW+20}" y="${axY}">억원</text>`;
    cats.forEach((c,i) => {
      const y = TOP + i*STEP, w = Math.max(c.v/1e8*S, 3);
      g += `<text class="psum-bl" x="${X0-10}" y="${y+14}" text-anchor="end">${esc(c.k)}</text>
            <rect x="${X0}" y="${y}" width="${w}" height="${BH}" rx="4" fill="${c.c}"/>
            <text class="psum-bv" x="${X0+w+10}" y="${y+16}" fill="${vc(c.c)}">${won(c.v)}</text>`;
    });

    return `<div class="p2c psum-card">
      <div class="p2hd"><span class="p2hd-t">조달현황</span>
        <a class="p2hd-a" href="#" data-go="perf">자세히 보기 →</a></div>
      <div class="p2pad">
       <div class="psum-tot">
        <span class="psum-tot-v">${+(total/1e8).toFixed(2)}<span class="psum-u">억원</span></span>
        <span class="psum-tot-l">누적 확보금액 · ${cnt}건</span></div>
       <svg width="100%" viewBox="0 0 460 ${H}" style="margin-top:14px">${g}</svg>
      </div>
     </div>`;
  }

  /* 값이 없으면 0억원짜리 빈 차트 대신 빈 상태를 낸다. 좌측 메뉴에는
     항목이 없지만 주소(#perf)로 바로 들어오는 길은 남아 있다 */
  V.perf=()=> !hasPerf
   ? `<div class="vh"><h1>조달현황</h1></div>
      <div class="card"><div class="cb"><p class="empty">등록된 내용이 없습니다.</p></div></div>`
   : `<div class="vh"><h1>조달현황</h1></div>
   <div class="perf">
    <div class="perf-card">
     <div class="perf-nums">
      <div class="perf-n"><div class="perf-n-val" id="perfKpiAmt"></div>
        <div class="perf-n-lbl">누적 확보금액</div></div>
      <div class="perf-n"><div class="perf-n-val" id="perfKpiCnt"></div>
        <div class="perf-n-lbl">선정 사업</div></div>
      <div class="perf-n"><div class="perf-n-val" id="perfKpiCert"></div>
        <div class="perf-n-lbl">취득 인증</div></div>
     </div>
    </div>
    <div class="perf-card">
     <div class="pv-hd">
      <span class="perf-blk-t">분야별 조달 현황</span>
      <span class="pv-hd-s">항목을 누르면 사업이 펼쳐집니다</span>
      <span class="pv-seg" id="pvSeg">
       <button class="on" data-pv="bar">규모</button>
       <button data-pv="ratio">비중</button>
      </span>
     </div>
     <div class="perf-filters">
      <div class="perf-fgrp"><span class="perf-flbl">연도</span>
        <div class="chips" id="perfFYear"></div></div>
     </div>
     <div id="pvBody"></div>
    </div>
    <div class="perf-card">
     <div class="perf-blk-t">인증 취득 경과</div>
     <div class="perf-blk-s">취득 순서</div>
     <div class="perf-tl"><div class="perf-tl-line"></div>
       <div class="perf-tl-row" id="perfTl"></div></div>
    </div>
   </div>`;

  /* 제목도 그 자리에서 고친다. 편집 모드가 아닐 때는 지금까지와 같은 h1 이다 —
     클라이언트가 보는 화면에 입력칸이 뜨면 안 된다.
     여기 넣는 값은 임시다. 진짜 값은 `edTitleOpen` 이 정한다 */
  const noticeTitleBox = () => ED.on()
    ? `<h1><input class="nti" id="ntitle" placeholder="공지 제목"
         aria-label="공지 제목" maxlength="200" autocomplete="off"
         value="${esc((notice&&notice.title)||'')}"></h1>`
    : `<h1>${esc((notice&&notice.title)||'공지사항')}</h1>`;

  V.notice=()=>`<div class="vh">${noticeTitleBox()}
    ${notice&&notice.date?`<span class="n">${esc(notice.date)}</span>`:''}
    ${editSwitch()}${ED.on() ? `<button class="edt-b" data-ednew>＋ 새 공지</button>` : ''}</div>
   ${noticeFeed(ED.on())}`;

  V.fund=()=>`<div class="vh"><h1>${CATNM.fund}</h1><span class="n">${cnt('fund')}건</span></div>${table('fund')}`;
  V.cert=()=>`<div class="vh"><h1>${CATNM.cert}</h1><span class="n">${cnt('cert')}건</span></div>${certTable()}`;
  V.proj=()=>`<div class="vh"><h1>${CATNM.proj}</h1><span class="n">${cnt('proj')}건</span></div>${table('proj')}`;

  /* 소통 내역 — 노션 소통 DB 에서 「공개」인 것만 온다.
     목록에는 일자·채널·제목만 두고, 본문은 행을 눌렀을 때 펼친다.
     body 가 null 이면 펼칠 것이 없으므로 표시도 하지 않는다. */
  /* 소통 내역 — 채널 탭으로 거른다. 좌측 메뉴는 「소통 내역」 하나로 둔다.
     preview 는 미팅·통화(안건 목록)만 한 줄 보여준다. 메일 preview 는
     본문 첫머리라 인사말·서명만 나와 목록에서 값을 못 한다. */
  const TALK_TABS = [{k:'all',nm:'전체'},{k:'메일',nm:'메일'},
                     {k:'통화',nm:'통화'},{k:'미팅',nm:'미팅'}];
  const TALK_BADGE = {'메일':'ch-mail','통화':'ch-call','미팅':'ch-meet'};
  const talkCount = k => k==='all' ? talks.length : talks.filter(t=>t.channel===k).length;
  let talkTab = 'all';

  /* opts.every  — 탭을 무시하고 전체를 낸다 (인쇄)
     opts.noBody — 본문을 아예 싣지 않는다. 메일 본문·회의록 전문은
                   종이에서 볼 내용이 아니라 리포트만 길어진다 (인쇄) */
  function talkList(opts){
    const o = opts || {};
    const list = talks
      .map((t,i)=>({t,i}))                       /* 아코디언 짝을 위해 원래 번호를 유지 */
      .filter(({t})=> o.every || talkTab==='all' || t.channel===talkTab);
    if(!list.length) return emptyBox('등록된 내용이 없습니다.');
    return `<div class="card"><table class="tktbl"><thead><tr>
      <th style="width:90px">일자</th><th style="width:110px">채널</th>
      <th>제목</th></tr></thead>
     <tbody>${list.map(({t,i})=>{
       const open = t.hasBody && !o.noBody;
       return `<tr class="tk${open?' has':''}" data-tk="${i}">
       <td class="dtc">${fmt(t.date)}</td>
       <td><span class="ch-b ${TALK_BADGE[t.channel]||'ch-mail'}">${esc(t.channel||'—')}</span>${
         t.direction?`<span class="co${t.direction==='보냄'?' out':''}">${esc(t.direction)}</span>`:''}</td>
       <td class="lead"><div class="t-nm">${open?'<i class="tw">▸</i>':''}${
         t.major?'<i class="mj-s" title="주요 소통">★</i>':''}${esc(t.title||'')}</div>
         ${!o.noBody&&t.channel!=='메일'&&t.preview?`<div class="tkpv">${esc(t.preview)}</div>`:''}</td>
      </tr>${open?`<tr class="tkb" data-tkb="${i}"><td colspan="3">
       ${t.body_html
         /* body_html 은 build_client.py 가 이스케이프해 조립한 HTML 이다 */
         ?`<div class="tkbd doc">${t.body_html}</div>`
         :`<div class="tkbd">${esc(t.body)}</div>`}</td></tr>`:''}`;}).join('')}
     </tbody></table></div>`;
  }

  /* 주요 소통 — 담당자가 노션 「주요」에 체크해 둔 것만 목록 위로 올린다.
     골라 둔 것이 없으면 이 덩어리는 아예 나오지 않는다. 기계가 대신 추려
     올리지 않는 까닭은, 「주요」라고 적힌 자리에 기계가 고른 것이 앉으면
     그 표시가 값을 잃기 때문이다 — 읽는 사람은 그것을 사람이 짚어 준
     것으로 읽는다. 시간순 목록만으로는 그 짚음이 전달되지 않는다.
     여기 오른 것도 아래 목록에서 빠지지 않는다. 하나를 두 곳에서 세지
     않으려면 위가 목록의 일부라는 것이 보여야 한다 — 눌러서 아래 그 줄로
     내려가는 것이 그 이음새다. */
  function talkMajor(){
    if(!majorTalks.length) return '';
    return `<section class="tkmj"><h2>주요 소통<span>${majorTalks.length}건</span></h2>
     <div class="card"><ul class="mjl">${majorTalks.map(t=>{
       const i = talks.indexOf(t);
       return `<li data-tkgo="${i}"><span class="mj-h">
        <span class="mj-d">${fmt(t.date)}</span>
        <span class="ch-b ${TALK_BADGE[t.channel]||'ch-mail'}">${esc(t.channel||'—')}</span>
        <span class="mj-t">${esc(t.title||'')}</span></span>
        ${t.preview?`<span class="mj-p">${esc(t.preview)}</span>`:''}</li>`;
     }).join('')}</ul></div></section>`;
  }

  function talkTabs(){
    return `<div class="chips" id="tkTabs">${TALK_TABS.map(x=>{
      const n = talkCount(x.k);
      return `<button class="chip${talkTab===x.k?' on':''}${n?'':' zero'}" data-tktab="${esc(x.k)}"
        >${x.nm}<span>${n}</span></button>`;
    }).join('')}</div>`;
  }

  V.talk=()=>`<div class="vh"><h1>소통 내역</h1>
    ${talks.length?`<span class="n">${talks.length}건</span>`:''}</div>
   ${talks.length?`${talkMajor()}${talkTabs()}<div id="tkList">${talkList()}</div>`
                 :emptyBox('등록된 내용이 없습니다.')}`;

  /* 추천 지원사업 — org 는 항상 null 이라 부제에는 마감일을 쓴다.
     검토서는 발행된 HTML 이라 새 탭으로 연다. */
  V.open=()=>`<div class="vh"><h1>추천 지원사업</h1>
    ${recommend.length?`<span class="n">${recommend.length}건</span>`:''}</div>
   ${recommend.length?`<div class="card"><table><thead><tr>
    <th style="width:12%">마감</th><th style="width:66%">사업명</th>
    <th class="num" style="width:22%">지원 규모</th></tr></thead>
   <tbody>${recommend.map(o=>`<tr${o.expired?' class="gone"':''}>
    <td class="dtc" style="${o.expired?'':'color:var(--run);'}font-weight:600">${
      o.expired?'마감':esc(o.dday||'상시')}</td>
    <td class="lead"><div class="t-nm">${esc(o.title||'')}${o.review_url
        ?`<a class="rv" href="${encodeURI(o.review_url)}" target="_blank" rel="noopener">검토서</a>`:''}</div>
        ${[o.org, o.deadline?`${esc(o.deadline)} 마감`:''].filter(Boolean).join(' · ')
          ?`<div class="t-sub">${[o.org?esc(o.org):'', o.deadline?`${esc(o.deadline)} 마감`:''].filter(Boolean).join(' · ')}</div>`:''}</td>
    <td class="num">${o.amount?esc(o.amount):'—'}</td></tr>`).join('')}
   </tbody></table></div>`:emptyBox('등록된 내용이 없습니다.')}`;

  /* ── 인쇄 리포트 ───────────────────────────────────────────────
     화면 DOM 은 손대지 않고 #printdoc 을 따로 채워 그것만 인쇄한다.
     아코디언을 열었다 되돌릴 필요가 없어 인쇄가 끝나도 화면이 그대로다. */
  const PRINT_SECTIONS = [
    {id:'info', nm:'기업 정보 · 공지사항'},
    {id:'fund', nm:CATNM.fund},
    {id:'cert', nm:CATNM.cert},
    {id:'proj', nm:CATNM.proj},
    {id:'open', nm:'추천 지원사업'},
    {id:'talk', nm:'소통 내역'},
  ];

  function printCover(){
    const p = (D.generated_at||'').slice(0,10).split('-');
    const when = p.length===3 ? `${+p[0]}년 ${+p[1]}월 ${+p[2]}일 기준` : '';
    return `<section class="pcover">
      <div class="pcv-marks">
        <img class="pcv-gh" src="${encodeURI(BRAND_LOGO)}" alt="그로스하이">
        ${CO.logo?`<span class="pcv-sep"></span>
          <img class="pcv-co" src="${encodeURI(BASE+CO.logo)}" alt="">`:''}
      </div>
      <h1>${esc(CO.name||CLIENT)} 진행 리포트</h1>
      <p class="pcv-d">${esc(when)}</p>
      ${CO.manager?`<p class="pcv-m">담당 컨설턴트 ${esc(CO.manager)}</p>`:''}
    </section>`;
  }

  /* 인쇄용 섹션 본문. 화면과 다른 곳만 갈아 끼운다 */
  function printBody(id){
    if(id === 'info') return V.info(true);          /* 공지 전문 · 일정 전부 */
    if(id === 'talk')                                /* 탭 없이 전체, 본문은 빼고 */
      return talks.length ? talkMajor() + talkList({every:true, noBody:true})
                          : emptyBox('등록된 내용이 없습니다.');
    return V[id] ? V[id]() : '';
  }

  /* ── 요약 리포트 — A4 한두 장. 표지 없이 머리글부터 바로 내용 ── */
  function printSummary(){
    const p = (D.generated_at||'').slice(0,10).split('-');
    const when = p.length===3 ? `${+p[0]}년 ${+p[1]}월 ${+p[2]}일 기준` : '';
    const nextEvSum = events.find(e => !e.past) || null;

    /* 아직 손에 쥐고 있는 건만. 끝난 것은 건수로만 알린다 */
    const live = rows.filter(r => r.badge==='run' || r.badge==='wait');
    const done = rows.filter(r => r.badge==='ok').length;
    const held = rows.filter(r => r.badge==='no').length;

    const notice1 = (notice && (notice.sections||[])[0]) || null;
    const rec5 = recommend.slice(0, 5);        /* 이미 마감 임박순이다 */
    /* 주요로 짚어 둔 것이 먼저다. 종이에는 다섯 줄뿐이라, 그 다섯 줄을 최근순으로
       채우면 「무엇이 중요했는가」가 아니라 「무엇이 최근인가」가 실린다.
       두 무리 안에서는 노션이 준 일자 내림차순 그대로다 */
    const talk5 = majorTalks.concat(talks.filter(t => !t.major)).slice(0, 5);

    return `<div class="psum">
      <header class="sh">
        <span class="sh-m">
          <img src="${encodeURI(BRAND_LOGO)}" alt="그로스하이">
          ${CO.logo?`<img src="${encodeURI(BASE+CO.logo)}" alt="">`:''}
        </span>
        <span class="sh-t"><b>${esc(CO.name||CLIENT)} 진행 요약</b>
          <span>${esc(when)}${CO.manager?` · 담당 ${esc(CO.manager)}`:''}</span></span>
      </header>

      <section class="ssec"><h2>현황 요약</h2>
        <div class="skpi">
          <div><span class="k">진행 중</span><span class="v">${kpi.running ?? live.length}건</span></div>
          <div><span class="k">완료</span><span class="v">${kpi.done ?? done}건</span></div>
          <div><span class="k">취득 인증</span><span class="v">${kpi.certs ?? 0}건</span></div>
          <div><span class="k">다음 일정</span><span class="v">${nextEvSum
            ? esc(String(nextEvSum.date).slice(5).replace('-','/')) : '—'}</span>
            <span class="s">${nextEvSum?esc(nextEvSum.title):'예정 없음'}</span></div>
        </div></section>

      ${notice1 ? `<section class="ssec">
        <h2>${esc(notice1.heading || '이달 공지사항')}</h2>
        ${(notice1.items||[]).length
          ? `<ul class="ck">${notice1.items.map(i =>
              noticeItem({...i, children:[]}, 1)).join('')}</ul>`
          : '<p class="empty">등록된 내용이 없습니다.</p>'}
      </section>` : ''}

      <section class="ssec"><h2>진행 중인 건</h2>
        ${live.length ? `<table><thead><tr>
          <th style="width:44%">사업명</th><th style="width:16%">구분</th>
          <th style="width:16%">단계</th>
          <th class="num" style="width:24%">지원내용</th></tr></thead>
        <tbody>${live.map(r=>`<tr>
          <td>${esc(r.title)}${r.joint?'<span class="co">공동</span>':''}</td>
          <td>${esc(CATNM[r.cat].split('·')[0])}</td>
          <td>${esc(r.stage_label||'')}</td>
          <td class="num">${support(r)}</td></tr>`).join('')}
        </tbody></table>` : '<p class="empty">진행 중인 건이 없습니다.</p>'}
        ${(done||held) ? `<p class="snote">그 외 완료 ${done}건${
          held?` · 보류 ${held}건`:''}</p>` : ''}
      </section>

      <section class="ssec"><h2>다가오는 일정</h2>
        ${events.length ? `<table><tbody>${events.map(e=>`<tr>
          <td style="width:14%">${esc(e.past?'지남':(e.dday||''))}</td>
          <td style="width:20%">${esc(String(e.date||'').slice(5).replace('-','/'))}${
            e.time?` ${esc(e.time)}`:''}</td>
          <td>${esc(e.title)}</td></tr>`).join('')}
        </tbody></table>` : '<p class="empty">등록된 일정이 없습니다.</p>'}
      </section>

      ${rec5.length ? `<section class="ssec"><h2>추천 지원사업</h2>
        <table><thead><tr><th style="width:14%">마감</th><th>사업명</th>
          <th class="num" style="width:26%">지원 규모</th></tr></thead>
        <tbody>${rec5.map(o=>`<tr>
          <td>${o.expired?'마감':esc(o.dday||'상시')}</td>
          <td>${esc(o.title||'')}</td>
          <td class="num">${o.amount?esc(o.amount):'—'}</td></tr>`).join('')}
        </tbody></table></section>` : ''}

      ${talk5.length ? `<section class="ssec"><h2>최근 소통</h2>
        <table><tbody>${talk5.map(t=>`<tr>
          <td style="width:14%">${fmt(t.date)}</td>
          <td style="width:12%">${esc(t.channel||'')}</td>
          <td>${esc(t.title||'')}</td></tr>`).join('')}
        </tbody></table>
        <p class="snote">누적 ${talks.length}건</p></section>` : ''}
    </div>`;
  }

  function buildPrintDoc(scope){
    if(scope === 'sum'){
      document.getElementById('printdoc').innerHTML = printSummary();
      return;
    }
    const cur = document.querySelector('.nv.on');
    const only = cur && cur.dataset ? cur.dataset.id : 'info';
    const list = scope === 'cur'
      ? PRINT_SECTIONS.filter(s => s.id === only)
      : PRINT_SECTIONS;
    const body = list.map(s =>
      `<section class="psec"><h2>${esc(s.nm)}</h2>${printBody(s.id)}</section>`).join('');
    const pd = document.getElementById('printdoc');
    pd.innerHTML = (scope === 'cur' ? '' : printCover()) + body;
    /* 화면용 제목줄은 지운다. 숨기기만 하면 h2+* 의 break-before:avoid 가
       보이지 않는 .vh 에 걸려 정작 표를 제목에 붙이지 못한다 */
    pd.querySelectorAll('.vh').forEach(n => n.remove());
  }

  let printScope = 'all', themeBeforePrint = null;
  window.addEventListener('beforeprint', ()=>{
    buildPrintDoc(printScope);
    /* 다크로 보고 있어도 종이는 흰 배경이어야 한다 */
    themeBeforePrint = document.documentElement.dataset.theme;
    document.documentElement.dataset.theme = 'light';
  });
  window.addEventListener('afterprint', ()=>{
    if(themeBeforePrint) document.documentElement.dataset.theme = themeBeforePrint;
    themeBeforePrint = null;
    document.getElementById('printdoc').innerHTML = '';
    printScope = 'all';            /* 다음 Ctrl+P 는 다시 전체 리포트 */
  });

  const rptBtn = document.getElementById('rptbtn');
  const rptMenu = document.getElementById('rptmenu');
  const closeRpt = ()=>{ rptMenu.hidden = true; rptBtn.setAttribute('aria-expanded','false'); };
  rptBtn.onclick = e => {
    e.stopPropagation();
    rptMenu.hidden = !rptMenu.hidden;
    rptBtn.setAttribute('aria-expanded', String(!rptMenu.hidden));
  };
  document.addEventListener('click', closeRpt);
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeRpt(); });
  rptMenu.querySelectorAll('[data-rp]').forEach(b => b.onclick = () => {
    printScope = b.dataset.rp;
    closeRpt();
    window.print();
  });

  const CR={info:'기업 정보',perf:'조달현황',fund:CATNM.fund,cert:CATNM.cert,
    proj:CATNM.proj,talk:'소통 내역',open:'추천 지원사업'};
  CR.notice = noticeLabel;                     /* 공지가 없어도 화면은 있다 */
  /* 화면 전환을 브라우저 히스토리에 남긴다. 안 남기면 뒤로 가기가
     이전 화면이 아니라 사이트 밖으로 나가 버린다.
     opt.replace  첫 진입 — 히스토리에 겹쳐 쌓지 않는다
     opt.fromPop  뒤로/앞으로 — 그 이동을 다시 기록하지 않는다 */
  function go(id, opt){
    if(!V[id])return;
    const o = opt || {};
    /* 화면을 다시 그리면 고쳐 둔 줄이 봉투의 옛 글로 되돌아간다. 노션에는
       아직 아무것도 안 나갔으므로, 나가기 전에 한 번 붙잡는다 */
    if(!edMayLeave()){
      if(o.fromPop) history.pushState({view:'notice'}, '', '#notice');
      return;
    }
    /* 장부는 화면을 가리킨다. 화면을 다시 그리면 통째로 버려야 한다 —
       하나라도 남기면 그 장부가 사라진 DOM 을 가리킨 채로 「손대 둔 것이
       있다」고 우기고, 그 위에서 저장하면 지금 화면에 없는 것이 나간다 */
    edForgetAll();
    /* 푸터 없음 — 클라이언트가 보는 화면에 내부 구현 설명을 남기지 않는다.
       빌드 시각도 화면 어디에도 두지 않는다. */
    document.getElementById('scroll').innerHTML=`<div class="view">${V[id]()}</div>`;
    document.getElementById('crumb').innerHTML=
      `<span class="c0">${esc(CO.name||CLIENT)}</span><i>/</i>` +
      `<span class="c1">${esc(CR[id])}</span>`;
    document.querySelectorAll('.nv').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
    document.getElementById('scroll').scrollTop=0;
    document.querySelectorAll('[data-go]').forEach(b=>b.onclick=e=>{e.preventDefault();go(b.dataset.go)});
    bindTalks();
    bindNotice();
    /* 조달현황은 그려진 뒤에 값을 채우고 높이를 잰다. 숨은 상태에서 재면
       폭·높이가 0 이라 차트 크기 계산이 틀어진다 */
    if(id==='perf' && window.perfFit) window.perfFit();

    if(!o.fromPop){
      const url = '#' + id;
      if(o.replace) history.replaceState({view:id}, '', url);
      else if(location.hash !== url) history.pushState({view:id}, '', url);
    }
  }

  window.addEventListener('popstate', e => {
    const id = (e.state && e.state.view) || (location.hash || '').slice(1);
    go(V[id] ? id : 'info', {fromPop:true});
  });

  /* 칸 하나에 걸리는 것 — 접기와 「＋ 줄 추가」. 화면을 다시 그리지 않고
     칸을 세울 때(`edSecAdd`)도 같은 것을 걸어야 한다 */
  function bindNoticeBox(box){
    const h3 = box.querySelector(':scope>h3');
    if(h3 && !ED.on()) h3.onclick = () => box.classList.toggle('open');
    /* `.ntail` 은 편집 모드에서만 그려진다 — 클라이언트 화면에서는 아무것도 걸지 않는다 */
    const bd = box.querySelector(':scope>.bd');
    if(!bd || !bd.querySelector(':scope>.ntail')) return;
    /* 줄 아래 빈 자리를 누르면 줄이 선다. **「＋ 줄 추가」 단추를 없앴다** —
       노션에는 그런 단추가 없고, 담당자가 그것 때문에 자유롭지 않다고 했다.
       빈 자리를 짚었을 때만이다. 글이나 단추를 누른 것까지 새 줄로 읽으면
       줄을 고치려던 손이 엉뚱한 줄을 만든다 */
    bd.onclick = e => {
      if(e.target !== bd && !e.target.matches('ul.ck,.empty,.ntail')) return;
      const list = sectionList(bd) || lastList();
      if(!list) return;
      /* 맨 끝 줄이 이미 빈 줄이면 그리로 커서만 보낸다 — 빈 줄이 겹쳐 쌓이지
         않게 한다 */
      const last = [...list.children].filter(li => li.matches('li[data-nid]')).pop();
      const it = last && edItems.get(last.dataset.nid);
      if(it && !it.del && it.nx.isContentEditable && edEmpty(it.nx)){ edFocusEnd(it.nx); return; }
      edAdd(li => list.appendChild(li));
    };
  }

  /* 공지 접기. 섹션 제목과 toggle 항목이 같은 방식으로 움직인다.
     요약 카드(.psum·개요)는 .notice 를 쓰지 않으므로 걸리지 않는다 */
  function bindNotice(opt){
    /* 편집 모드에서는 머리말을 눌러도 접히지 않는다. 이름을 고치러 누른 손이
       칸을 통째로 접어 버리면, 방금까지 보던 줄이 사라진다 */
    if(!ED.on()) document.querySelectorAll('.notice>h3').forEach(h=>h.onclick=()=>
      h.parentElement.classList.toggle('open'));
    document.querySelectorAll('.ck li.tg>.tgh').forEach(h=>h.onclick=e=>{
      e.stopPropagation();                      /* 중첩 토글에서 위까지 닫히지 않게 */
      h.parentElement.classList.toggle('open');
    });
    bindEditSwitch();
    bindEditItems(opt);
  }

  /* 아코디언과 채널 탭. 탭을 누르면 목록만 다시 그리고 다시 묶는다 */
  function bindTalks(){
    document.querySelectorAll('tr.tk.has').forEach(tr=>tr.onclick=()=>{
      const body=document.querySelector(`tr.tkb[data-tkb="${tr.dataset.tk}"]`);
      tr.classList.toggle('open');
      if(body) body.classList.toggle('open');
    });
    document.querySelectorAll('[data-tktab]').forEach(b=>b.onclick=()=>{
      talkTab = b.dataset.tktab;
      const box = document.getElementById('tkList');
      if(box) box.innerHTML = talkList();
      document.querySelectorAll('[data-tktab]').forEach(x=>
        x.classList.toggle('on', x.dataset.tktab===talkTab));
      bindTalks();
    });
    /* 「주요 소통」에서 목록의 그 줄로 내려간다. 탭이 걸려 있으면 먼저 풀어야
       한다 — 미팅 탭에 있는데 메일을 짚으면 목록에 그 줄이 없다 */
    document.querySelectorAll('[data-tkgo]').forEach(li=>li.onclick=()=>{
      const i = li.dataset.tkgo;
      if(talkTab !== 'all'){
        talkTab = 'all';
        const box = document.getElementById('tkList');
        if(box) box.innerHTML = talkList();
        document.querySelectorAll('[data-tktab]').forEach(x=>
          x.classList.toggle('on', x.dataset.tktab==='all'));
        bindTalks();
      }
      const tr = document.querySelector(`tr.tk[data-tk="${i}"]`);
      if(!tr) return;
      const body = document.querySelector(`tr.tkb[data-tkb="${i}"]`);
      /* 이미 펴 둔 것을 다시 눌러 접지 않는다. 여기서 누른 뜻은 「보자」다 */
      tr.classList.add('open');
      if(body) body.classList.add('open');
      tr.scrollIntoView({block:'center', behavior:'smooth'});
      tr.classList.remove('tkhi');
      void tr.offsetWidth;                        /* 같은 줄을 두 번 짚어도 다시 깜빡이게 */
      tr.classList.add('tkhi');
    });
  }
  document.querySelectorAll('.nv').forEach(b=>{if(!b.dataset.ext)b.onclick=()=>go(b.dataset.id)});
  /* 주소에 해시가 있으면 그 화면에서 시작한다. 잠금이 풀린 뒤에만 온다 */
  const startId = (location.hash || '').slice(1);
  go(V[startId] ? startId : 'info', {replace:true});
}

document.getElementById('tgl').onclick=()=>{
  const r=document.documentElement;
  r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'};
</script>
<script>
/* ══════════════════════════════════════════════════════════════════
   조달현황 화면 (샘플 전용)

   시안 procurement-rev4 와 같은 화면이다. 보기가 둘 —
     규모  가로 막대 (기본)
     비중  도넛
   분야 행을 누르면 그 분야의 사업으로 갈라진다. 다시 누르면 돌아온다.
   연도 칩은 이 카드에만 걸린다 — 위 요약과 아래 인증은 늘 전체다.

   값은 payload.perf 에서 온다. build_client.py 가 진행내역에서 만든다 —
   이 파일에 숫자를 적지 말 것.

   분야는 노션에 없다. 「프로젝트 유형」이 (런웨이)지원사업 하나로 뭉쳐
   있어 수출·마케팅·창업이 갈리지 않는다. 그래서 사업명 규칙으로 나눈다.
   유형이 분명한 정책자금은 유형이 이긴다.
   ══════════════════════════════════════════════════════════════════ */
(function(){
  let DATA = { programs: [], certs: [] };
  let years = [], VIEW = [], TOTAL = 0;

  /* 분야 분류는 앱 쪽에 한 번만 두고 여기서 읽어 온다 — 요약 카드와
     이 화면이 같은 기준으로 갈라야 한다 */
  const CAT = () => window.__PERFCAT__ || { PCATS:[], pcatOf:()=>'기타' };
  const catOf = p => CAT().pcatOf(p);

  let fYears = new Set(), view = 'bar', openKs = new Set();
  const yOn = y => fYears.size === 0 || fYears.has(y);

  const EOK = 100000000;
  const esc = s => String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const eok = v => +(v/EOK).toFixed(2);
  function won(v){
    if (v >= EOK){ const e = v/EOK; return (Number.isInteger(e) ? e : +e.toFixed(2)) + '억원'; }
    return (v/10000).toLocaleString() + '만원';
  }
  function niceMax(v){
    if (v <= 0) return 1;
    const k = Math.pow(10, Math.floor(Math.log10(v)));
    for (const m of [1,2,2.5,4,5,6,8,10]) if (m*k >= v) return m*k;
    return 10*k;
  }

  function prep(){
    DATA = window.__PERF__ || { programs: [], certs: [] };
    years = [...new Set(DATA.programs.map(p => p.year))].sort();
    VIEW = CAT().PCATS.map(c => {
      const items = DATA.programs
        .filter(p => catOf(p) === c.k && yOn(p.year))
        .sort((a,b) => b.amount - a.amount || a.year - b.year);
      return { k:c.k, c:c.c, items, v: items.reduce((s,p) => s + p.amount, 0) };
    }).filter(c => c.k !== '기타' || c.items.length)
      .sort((a,b) => b.v - a.v);
    TOTAL = VIEW.reduce((s,c) => s + c.v, 0);
    [...openKs].forEach(k => { if (!VIEW.some(c => c.k === k && c.v > 0)) openKs.delete(k); });
  }

  /* 분야 행을 누르면 그 아래로 사업이 펼쳐진다. 그래프는 늘 분야 전체를
     그린다 — 펼침은 목록에서만 일어난다. 분야는 여러 개를 함께 펼쳐 둘 수 있다 */
  const isOpen = k => openKs.has(k);
  const bars = () => VIEW.filter(c => c.v > 0);

  /* ── 비중 : 도넛 ── */
  function donut(){
    const C = 502.7;
    const part = bars(), sum = part.reduce((a,c) => a + c.v, 0) || 1;
    let off = 0, s = '';
    part.forEach(c => {
      const len = c.v/sum*C;
      s += `<circle cx="122" cy="122" r="80" fill="none" stroke="${c.c}" stroke-width="32"
              stroke-dasharray="${Math.max(len-3,1)} ${C}" stroke-dashoffset="${-off}"/>`;
      off += len;
    });
    return `<svg width="252" height="252" viewBox="0 0 244 244">
      <g transform="rotate(-90 122 122)">
        <circle cx="122" cy="122" r="80" fill="none" stroke="var(--panel-2)" stroke-width="32"/>${s}
      </g>
      <text x="122" y="124" text-anchor="middle" font-size="33" font-weight="800"
            letter-spacing="-.04em" fill="var(--tx)">${eok(sum)}<tspan font-size="15"
            font-weight="600" fill="var(--tx-3)" dx="3">억원</tspan></text>
      <text x="122" y="146" text-anchor="middle" font-size="11.5"
            fill="var(--tx-3)">누적 확보금액</text>
    </svg>`;
  }

  /* ── 규모 : 가로 막대 ── */
  function hbars(){
    const act = bars();
    if (!act.length) return `<p class="empty">고른 연도에 맞는 사업이 없습니다.</p>`;
    const W = 800, rowH = 46, top = 34, H = top + act.length*rowH + 26;
    /* 다 1억 밑이면 억 눈금이 0.13 처럼 나온다. 그럴 때는 만원으로 센다 */
    const U = act[0].v < EOK ? 1e4 : EOK, UN = U === 1e4 ? '만원' : '억원';
    const L = 112, R = W - 70;
    const max = niceMax(act[0].v/U), S = (R-L)/max;
    let s = `<svg width="100%" viewBox="0 0 ${W} ${H}">`;
    [0,.25,.5,.75,1].map(f => +(max*f).toFixed(2)).forEach(v => {
      const x = L + v*S;
      s += `<line x1="${x}" y1="${top-12}" x2="${x}" y2="${top+act.length*rowH-6}"
              stroke="${v===0?'var(--line-2)':'var(--perf-grid)'}" stroke-width="${v===0?1.5:1}"/>
            <text class="pv-axis" x="${x}" y="${top+act.length*rowH+12}"
              text-anchor="middle">${v.toLocaleString()}</text>`;
    });
    s += `<text class="pv-axis" x="${R+14}" y="${top+act.length*rowH+12}">${UN}</text>`;
    act.forEach((c,i) => {
      const cy = top + i*rowH + 12, w = (c.v/U)*S;
      s += `<text class="pv-blab" x="${L-14}" y="${cy+17}" text-anchor="end">${esc(c.k)}</text>
            <rect x="${L}" y="${cy}" width="${Math.max(w,3)}" height="24" rx="4" fill="${c.c}"/>
            <text class="pv-bval" x="${L+w+10}" y="${cy+17}" fill="${c.c}">${won(c.v)}</text>`;
    });
    return s + `</svg>`;
  }

  /* ── 분야 목록. 누르면 그 아래로 사업이 펼쳐진다 ── */
  function rows(){
    return VIEW.map(c => {
      const off = c.v === 0, on = isOpen(c.k);
      const sub = on ? `<div class="pv-sub">${c.items.map(it => `
          <div class="pv-si"><span class="pv-yr">${it.year}</span>
            <span class="pv-nm">${esc(it.name)}</span>
            <span class="pv-am">${won(it.amount)}</span></div>`).join('')}</div>` : '';
      return `<div class="pv-unit">
        <button class="pv-rw${off?' off':''}${on?' on':''}"${off?' disabled':''}
          data-pvk="${esc(c.k)}">
          <i style="background:${off?'var(--line-2)':c.c}"></i>
          <span class="pv-nm">${esc(c.k)}</span>
          <span class="pv-ct">${c.items.length}건</span>
          <span class="pv-am">${off?'―':won(c.v)}</span>
          <span class="pv-cv"></span>
        </button>${sub}</div>`;
    }).join('');
  }

  const chip = (on, label, attr) => `<button class="chip${on?' on':''}" ${attr}>${label}</button>`;

  function renderFilters(){
    const fy = document.getElementById('perfFYear');
    if (!fy) return;
    fy.innerHTML = chip(fYears.size===0, '전체', 'data-pyear="all"')
      + years.map(y => chip(fYears.has(y), y, `data-pyear="${y}"`)).join('');
    /* 연도가 하나뿐이면 고를 것이 없다 */
    fy.parentElement.hidden = years.length < 2;
  }

  function renderBody(){
    const el = document.getElementById('pvBody');
    if (!el) return;
    el.innerHTML = view === 'ratio'
      ? `<div class="pv-split"><div class="pv-viz">${donut()}</div>`
        + `<div>${rows()}</div></div>`
      : `${hbars()}<div class="pv-list">${rows()}</div>`;
  }

  function bind(){
    const seg = document.getElementById('pvSeg');
    const body = document.getElementById('pvBody');
    const fy = document.getElementById('perfFYear');
    /* 컨테이너는 go() 가 화면을 새로 그릴 때만 바뀐다. 안쪽은 innerHTML 로
       갈아 끼우므로 위임해 두면 한 번만 걸면 된다 */
    if (!seg || !body || !fy || seg.dataset.bound) return;
    seg.dataset.bound = '1';
    seg.onclick = e => {
      const b = e.target.closest('[data-pv]');
      if (!b) return;
      seg.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      view = b.dataset.pv; renderBody();
    };
    body.onclick = e => {
      const b = e.target.closest('.pv-rw');
      if (!b || b.disabled || !b.dataset.pvk) return;
      const k = b.dataset.pvk;
      openKs.has(k) ? openKs.delete(k) : openKs.add(k);
      renderBody();
    };
    fy.onclick = e => {
      const b = e.target.closest('[data-pyear]');
      if (!b) return;
      if (b.dataset.pyear === 'all') fYears.clear();
      else {
        const y = +b.dataset.pyear;
        fYears.has(y) ? fYears.delete(y) : fYears.add(y);
        /* 다 고른 것은 전체와 같다 */
        if (fYears.size === years.length) fYears.clear();
      }
      mount();
    };
  }

  function mount(){
    const amt = document.getElementById('perfKpiAmt');
    if (!amt) return;                       /* 조달현황 화면이 아니다 */
    prep();
    renderFilters();
    /* 위 요약과 아래 인증은 늘 전체다. 연도 필터는 가운데 카드에만 건다 */
    const all = (window.__PERF__ || {programs:[],certs:[]});
    const grand = all.programs.reduce((s,p) => s + (+p.amount||0), 0);
    amt.innerHTML = eok(grand) + '<span class="perf-u">억원</span>';
    document.getElementById('perfKpiCnt').innerHTML =
      all.programs.length + '<span class="perf-u">건</span>';
    document.getElementById('perfKpiCert').innerHTML =
      all.certs.length + '<span class="perf-u">건</span>';
    document.getElementById('perfTl').innerHTML = all.certs.map(c => `
      <div class="perf-tl-i"><div class="perf-tl-dot"></div>
        <div class="perf-tl-nm">${esc(c.name)}</div>
        <div class="perf-tl-dt">${esc(c.date)}</div></div>`).join('');
    renderBody();
    bind();
  }

  /* 화면이 보이게 된 뒤에 셸이 부른다 */
  window.perfFit = mount;
  window.__perfMount = mount;          /* 옛 이름 — 쓰던 곳이 있으면 그대로 돈다 */
})();
</script>

</body>
</html>
