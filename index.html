<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>클라이언트 페이지 · 그로스하이</title>

<!-- 링크 미리보기. 비밀번호 없이 읽히는 공개 정보다.
     모든 클라이언트가 이 고정 문구를 그대로 쓴다 — 슬러그별로 제목·이미지를
     다르게 두면 크롤러가 클라이언트 목록을 수집할 수 있다.
     og:url 에도 슬러그를 넣지 않는다. 루트로 고정한다. -->
<meta property="og:title" content="그로스하이 클라이언트 페이지">
<meta property="og:description" content="담당 컨설턴트에게 받은 링크로 접속해 주세요.">
<meta property="og:image" content="https://client.growthhigh.co.kr/assets/og-image.png">
<!-- 크기를 명시한다. 이것이 없으면 이미지를 내려받기 전에는 자리를 잡지 못해
     아예 건너뛰는 크롤러가 있다. 실제 파일과 같은 값이어야 한다 -->
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta property="og:image:alt" content="그로스하이 클라이언트 페이지">
<meta property="og:url" content="https://client.growthhigh.co.kr/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="GROWTH'HIGH">
<meta property="og:locale" content="ko_KR">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="그로스하이 클라이언트 페이지">
<meta name="twitter:description" content="담당 컨설턴트에게 받은 링크로 접속해 주세요.">
<meta name="twitter:image" content="https://client.growthhigh.co.kr/assets/og-image.png">

<meta name="description" content="그로스하이 클라이언트 전용 페이지입니다.">
<meta name="robots" content="noindex, nofollow">

<!-- 파비콘. 절대 주소로 둔다 — 상대경로면 /{슬러그}/ 에서 한 단계 아래를 찾아
     404 가 난다. 스크립트로 고칠 수는 있지만 링크 미리보기 크롤러는 JS 를
     실행하지 않고 원본 HTML 만 읽으므로 그때 깨진다.
     /favicon.ico 는 <link> 를 무시하고 도메인 루트부터 찾는 크롤러용이다 -->
<link rel="icon" href="https://client.growthhigh.co.kr/favicon.ico" sizes="32x32 16x16">
<link rel="icon" type="image/png" sizes="32x32"
      href="https://client.growthhigh.co.kr/assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180"
      href="https://client.growthhigh.co.kr/assets/favicon-180.png">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--sans:'Pretendard',-apple-system,system-ui,sans-serif;--r:6px;--accent:#5E6AD2;
  --run:#D9A441;--run-bg:rgba(217,164,65,.14);--ok:#4CAF7D;--ok-bg:rgba(76,175,125,.14);
  --no:#C0645F;--no-bg:rgba(192,100,95,.14);--accent-bg:rgba(94,106,210,.18)}
[data-theme="dark"]{--bg:#1A1A1E;--panel:#212127;--panel-2:#26262D;--hover:#2C2C34;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);
  --tx:#E4E4E8;--tx-2:#9A9AA6;--tx-3:#6E6E7C}
/* 라이트는 다크의 반전이 아니라 별도 팔레트다. 패널을 흰색으로 두고 테두리로 구분한다 */
[data-theme="light"]{--bg:#FFFFFF;--panel:#FFFFFF;--panel-2:#F4F5F7;--hover:#F0F1F4;
  --line:#E3E5EA;--line-2:#C9CDD5;--tx:#16181D;--tx-2:#4A4F5A;--tx-3:#8A909C;
  --accent:#3D4BA8;
  --run:#8F5F0D;--run-bg:#FDF3E0;--ok:#1F7A52;--ok-bg:#E6F4EC;
  --no:#A34B45;--no-bg:#FBEAE8;--accent-bg:#E9EBF6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);font-size:13px;
  line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:1px;border-radius:3px}

aside{width:238px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;height:100vh}
/* 우측 .top 과 같은 48px. 높이가 다르면 좌우 경계선이 어긋나 보인다 */
.ws{height:48px;flex:none;padding:0 12px;border-bottom:1px solid var(--line);
  display:flex;gap:9px;align-items:center}
.ws .mk{width:28px;height:28px;border-radius:7px;flex:none;background:#123027;
  display:grid;place-items:center;overflow:hidden}
/* 로고 — 이미지는 투명 배경이 많아 마크 배경을 중립으로 바꾼다 */
.ws .mk.img,.hero .mk.img{background:var(--panel-2);border:1px solid var(--line)}
.mk .lg{width:100%;height:100%;object-fit:contain;border-radius:inherit;display:block}
.mk .lg-e{line-height:1}
.mk .lg-t{line-height:1;color:#5DCAA5;font-weight:700;letter-spacing:-.02em}
.ws .nm{font-size:13px;font-weight:600;letter-spacing:-.015em;line-height:1.25;display:block}
.ws .sb{font-size:10.5px;color:var(--tx-3)}
nav{flex:1;overflow-y:auto;padding:9px 8px}
/* 사이드바 하단 제공자 표시. 위 .ws 와 같은 48px 로 좌측 기둥의 위아래를 맞춘다.
   nav 가 flex:1 이라 이 블록은 늘 바닥에 붙는다. 누를 수 없다 */
.by{flex:none;height:48px;padding:0 12px;border-top:1px solid var(--line);
  display:flex;gap:9px;align-items:center}
.by-mk{width:18px;height:18px;border-radius:4px;flex:none;overflow:hidden;display:block;
  border:1px solid var(--line-2)}
.by-mk img{width:100%;height:100%;object-fit:contain;display:block;border-radius:inherit}
.by-nm{display:block;font-size:11.5px;font-weight:500;color:var(--tx-2);line-height:1.25}
.by-sb{display:block;font-size:10px;color:var(--tx-3);line-height:1.3}
.grp{margin-bottom:13px}
.grp h3{font-size:10px;font-weight:500;color:var(--tx-3);letter-spacing:.06em;
  padding:0 8px;margin-bottom:4px;text-transform:uppercase}
.nv{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:var(--r);
  font-size:13px;color:var(--tx-2);text-align:left;line-height:1.4}
.nv:hover{background:var(--hover);color:var(--tx)}
.nv.on{background:var(--panel-2);color:var(--tx);font-weight:500}
[data-theme="light"] .nv.on{background:var(--hover)}
/* 내용이 없는 항목. 메뉴에서 빼지 않고 흐리게만 둔다 —
   어제 있던 항목이 오늘 사라지면 클라이언트는 오류로 읽는다 */
.nv.dim{color:var(--tx-3)}
.nv.dim .g{opacity:.45}
.nv.dim:hover,.nv.dim.on{color:var(--tx)}
/* 주소가 없는 자료 항목. 자리는 지키되 누를 수 없다는 것이 보여야 한다 */
.nv:disabled{cursor:default;color:var(--tx-3)}
.nv:disabled:hover{background:none;color:var(--tx-3)}
.nv .g{width:13px;flex:none;opacity:.7;font-size:12px;text-align:center}
.nv .ct{margin-left:auto;font-size:11px;color:var(--tx-3);font-variant-numeric:tabular-nums}
.nv .ex{margin-left:auto;font-size:10px;color:var(--tx-3)}

main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh}
.top{height:48px;flex:none;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:10px;padding:0 16px}
.crumb{font-size:13px;font-weight:600;letter-spacing:-.01em}
.crumb i{font-style:normal;color:var(--tx-3);font-weight:400;margin:0 7px}
/* 기업명은 한 단계 물리고 현재 페이지를 앞세운다 */
.crumb .c0{color:var(--tx-2)}
.crumb .c1{color:var(--tx)}
/* 상단 바 제공자 마크. 링크가 아니다 — 누르면 클라이언트가 페이지를 떠난다.
   로고 바탕이 검정이라 다크에서 패널에 묻힌다. 두 테마 모두 테두리를 준다 */
.top .gh{width:20px;height:20px;border-radius:4px;flex:none;overflow:hidden;display:block;
  border:1px solid var(--line-2)}
.top .gh img{width:100%;height:100%;object-fit:contain;display:block;border-radius:inherit}
.gh-sep{width:1px;height:14px;flex:none;background:var(--line-2);margin:0 -2px}
.top .rt{margin-left:auto;display:flex;align-items:center;gap:6px}
.tgl{width:28px;height:28px;border-radius:var(--r);display:grid;place-items:center;
  color:var(--tx-2);font-size:14px}
.tgl:hover{background:var(--hover);color:var(--tx)}
/* 리포트 버튼 + 드롭다운 */
.rpt{position:relative;display:inline-flex}
.rpb{font-size:11.5px;color:var(--tx-2);padding:4px 10px;border-radius:var(--r);
  border:1px solid var(--line-2);white-space:nowrap}
.rpb:hover{background:var(--hover);color:var(--tx)}
.rpm{position:absolute;top:calc(100% + 6px);right:0;z-index:30;min-width:132px;
  background:var(--panel);border:1px solid var(--line-2);border-radius:8px;
  padding:4px;display:flex;flex-direction:column;
  box-shadow:0 6px 20px rgba(0,0,0,.14)}
.rpm[hidden]{display:none}
.rpm button{font-size:12px;color:var(--tx-2);text-align:left;padding:7px 9px;
  border-radius:5px;white-space:nowrap}
.rpm button:hover{background:var(--hover);color:var(--tx)}

#printdoc{display:none}
.scroll{flex:1;overflow-y:auto}
.view{padding:28px 32px 90px;max-width:1240px;margin:0 auto}
.vh{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.vh h1{font-size:19px;font-weight:600;letter-spacing:-.025em}
.vh .n{font-size:12px;color:var(--tx-3);font-variant-numeric:tabular-nums}

.hero{border:1px solid var(--line);border-radius:10px;background:var(--panel);
  padding:20px 22px;margin-bottom:16px;display:flex;gap:16px;align-items:flex-start}
.hero .mk{width:52px;height:52px;border-radius:12px;flex:none;background:#123027;
  display:grid;place-items:center}
.hero h2{font-size:21px;font-weight:600;letter-spacing:-.03em;line-height:1.25}
.hero .biz{font-size:13px;color:var(--tx-2);margin-top:5px;line-height:1.55;max-width:52ch}
/* 해시태그. 배경·테두리 없이 글자만 두고 # 기호만 한 톤 흐리게 둔다.
   두 테마 모두 변수를 그대로 쓰므로 테마별 규칙이 따로 필요 없다 */
.hero .tags{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.hero .tags .htag{font-size:12px;color:var(--tx-2)}
.hero .tags .htag i{font-style:normal;color:var(--tx-3)}

.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:9px;margin-bottom:16px}
.k1{border:1px solid var(--line-2);border-radius:10px;padding:13px 15px;background:var(--panel)}
.k1 .k{font-size:11.5px;color:var(--tx-2)}
/* 네 칸의 baseline 과 그 아래 설명 줄 높이를 맞춘다. 「다음 일정」만 뒤에 붙는
   단위가 없는데, 자리를 채우려고 빈 <small> 을 넣지 않고 min-height 로 잡는다.
   min-height 는 1.6em — 제 글자 크기(26px) 기준이라 line-height 와 어긋나지 않는다 */
.k1 .v{font-size:26px;font-weight:600;letter-spacing:-.03em;margin-top:4px;
  font-variant-numeric:tabular-nums;line-height:1.6;
  display:flex;align-items:baseline;min-height:1.6em}
.k1 .v small{font-size:12px;font-weight:400;color:var(--tx-2);margin-left:2px}
.k1 .s{font-size:11px;color:var(--tx-3);margin-top:2px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.card>.ch{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.card>.ch h2{font-size:12.5px;font-weight:600;letter-spacing:-.01em}
.card>.ch .d{font-size:11.5px;color:var(--tx-3);font-variant-numeric:tabular-nums}
.card>.ch .more{margin-left:auto;font-size:11.5px;color:var(--tx-3)}
.card>.cb{padding:15px}

.notice{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:16px}
/* 섹션 접기 — 소통 내역 아코디언과 같은 방식이다(.tw 가 90도 돈다) */
.notice>h3{font-size:13px;font-weight:600;padding:12px 15px 10px;letter-spacing:-.01em;
  display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.notice>h3:hover{color:var(--tx)}
.notice:not(.open)>h3{padding-bottom:12px}
.notice.open>h3 .tw{transform:rotate(90deg)}
.notice:not(.open)>.bd{display:none}
.notice>.bd{padding:0 15px 13px}
/* 노션에서 접어 둔 toggle 항목. 기본은 접힘 */
.ck li.tg>.tgh{cursor:pointer;user-select:none;display:inline-flex;align-items:baseline;gap:6px}
.ck li.tg>.tgh:hover{color:var(--tx)}
.ck li.tg.open>.tgh .tw{transform:rotate(90deg)}
.ck li.tg:not(.open)>ul{display:none}
/* 토글 항목은 앞의 점 대신 화살표를 쓴다 */
.ck li.tg::before{content:none!important}
.ck li.tg{padding-left:0}
.ck{list-style:none}
.ck>li{padding:3px 0 3px 22px;position:relative;font-size:13px;line-height:1.65}
.ck>li>b,.ck>li>.nx>b{font-weight:600}

/* ── 편집 모드 ──
   담당자에게만 켜진다. 클라이언트 화면에는 아래 어느 것도 나타나지 않는다.
   .nx 는 항목 자기 글만 감싸는 껍데기다 — 하위 항목까지 삼키면 한 줄을 고칠 때
   아래 줄들이 통째로 사라진다. 편집 모드일 때만 씌워 평소 DOM 은 건드리지 않는다 */
.edt{display:inline-flex;align-items:center;gap:6px}
.edt-b{font-size:11px;color:var(--tx-3);border:1px solid var(--line-2);border-radius:5px;
  padding:2px 8px;line-height:1.5}
.edt-b:hover{color:var(--tx);border-color:var(--tx-3)}
.edt-on{font-size:10.5px;font-weight:600;letter-spacing:.02em;color:#fff;background:var(--accent);
  border-radius:9px;padding:2px 9px}
.edt input{font-family:inherit;font-size:12px;width:150px;padding:3px 8px;color:var(--tx);
  background:var(--panel-2);border:1px solid var(--line-2);border-radius:5px}
.edt .err{font-size:11px;color:var(--no)}

/* 자손 선택자다. `.ck>li` 로 쓰면 중첩된 항목이 통째로 빠진다 —
   공지는 4단까지 들어가고, 실제로 고칠 줄은 대부분 안쪽에 있다 */
.ck li[data-nid]>.nx,.ck li[data-nid]>.tgh>.nx{border-radius:3px}
/* 고칠 수 있게 된 줄. 중계 서버가 「고칠 수 있다」고 한 뒤에야 이 꼴이 된다 —
   contenteditable 은 화면이 아니라 중계 서버의 판정으로만 붙는다 */
.nx[contenteditable]{outline:none;cursor:text;padding:0 3px;margin:0 -3px}
.nx[contenteditable]:hover{background:var(--accent-bg)}
.nx[contenteditable]:focus{background:var(--accent-bg);box-shadow:0 0 0 1px var(--accent)}
/* 고친 줄 · 보탠 줄 · 지운 줄 — 저장 전까지 눈에 띈다. 저장을 누르기 전에는
   노션에 아무것도 나가지 않았으므로, 무엇이 나갈 것인지가 한눈에 보여야 한다 */
.ck li.ed-dirty{box-shadow:inset 2px 0 var(--accent);border-radius:3px}
.ck li.ed-new{box-shadow:inset 2px 0 var(--ok);border-radius:3px}
.ck li.ed-new.ed-blank{box-shadow:none}
.ck li.ed-fail{box-shadow:inset 2px 0 var(--no);border-radius:3px}
/* 지울 줄은 화면에서 치우지 않고 그어 둔다. 치우면 저장 전에 무엇이 사라질지
   셀 수 없고, 잘못 눌렀을 때 되돌릴 곳도 없다.
   자손 선택자다 — 그릇을 지우면 노션이 안엣줄도 함께 지운다 */
.ck li.ed-del>.nx,.ck li.ed-del>.tgh>.nx,
.ck li.ed-del li>.nx,.ck li.ed-del li>.tgh>.nx{opacity:.42;text-decoration:line-through}
/* 노션에서만 만들 수 있는 조각 — 멘션·수식·커스텀 이모지.
   글로 고칠 수 없으니 통째로 두거나 통째로 지운다 */
.ed-o{white-space:nowrap}
.ed-o:not(:has(img)){background:var(--panel-2);border-radius:3px;padding:0 3px}
/* 공지 제목 칸. 제목처럼 보이게 두고 손댈 수 있다는 것만 밑줄로 알린다 —
   입력칸 테두리를 두르면 화면 맨 위가 갑자기 서식 화면이 된다 */
.nti{font-family:inherit;font-size:19px;font-weight:600;letter-spacing:-.025em;
  color:var(--tx);background:none;border:none;border-bottom:1px dashed var(--line-2);
  padding:0 2px 1px;min-width:220px;max-width:min(560px,60vw)}
.nti:focus{outline:none;border-bottom-color:var(--accent)}
.nti::placeholder{color:var(--tx-3);font-weight:500}
/* 어긋남·실패를 그 줄 밑에 붙인다. 어느 줄 이야기인지 찾게 만들지 않는다 */
.ed-note{margin:5px 0 7px;padding:7px 9px;font-size:11.5px;line-height:1.6;
  border:1px solid var(--line-2);border-radius:7px;background:var(--panel-2);color:var(--tx-2)}
.ed-note.bad{border-color:var(--no)}
.ed-note .cur{margin:5px 0;padding:6px 8px;background:var(--panel);border-radius:5px;color:var(--tx)}
.ed-note button{font-size:11px;border-radius:5px;padding:2px 9px;
  border:1px solid var(--line-2);margin-right:5px}
/* 저장 창구 — 공지 밑에 붙어 스크롤해도 남는다. 고친 것이 어디로 나가는지
   한 곳만 보면 되게 한다 */
.ed-bar{position:sticky;bottom:0;z-index:20;display:flex;align-items:center;gap:8px;
  margin-top:14px;padding:9px 12px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;font-size:12px;box-shadow:0 -3px 14px rgba(0,0,0,.07)}
.ed-bar .cnt{color:var(--tx-3)}
.ed-bar .msg{margin-left:auto;color:var(--tx-2);text-align:right}
.ed-bar .msg.bad{color:var(--no)}
.ed-bar button{font-size:12px;border-radius:6px;padding:4px 13px;border:1px solid var(--line-2)}
.ed-bar .save{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.ed-bar button[disabled]{opacity:.5;cursor:default}
/* 서식 막대 — 글자를 고른 자리 위에 뜬다. 안 고르면 없다 */
.ed-tb{position:absolute;z-index:60;display:none;gap:2px;padding:3px;background:var(--panel);
  border:1px solid var(--line-2);border-radius:7px;box-shadow:0 4px 14px rgba(0,0,0,.18);
  flex-wrap:wrap;width:212px}
.ed-tb.on{display:flex}
.ed-tb button{min-width:26px;height:24px;font-size:12px;color:var(--tx-2);border-radius:4px;
  padding:0 5px}
.ed-tb button:hover{background:var(--accent-bg);color:var(--accent)}
/* 색 견본. 「🎨」를 눌러야 펼쳐진다 — 늘 펼쳐 두면 서식 막대가 글을 덮는다 */
.ed-pal{display:none;width:100%;grid-template-columns:repeat(10,1fr);gap:2px;
  margin-top:3px;padding-top:4px;border-top:1px solid var(--line)}
.ed-tb.pal .ed-pal{display:grid}
.ed-tb .ed-pal button{min-width:0;width:100%;height:17px;padding:0;font-size:9.5px;
  line-height:15px;border:1px solid var(--line-2);border-radius:3px}
.ed-tb .ed-pal button:hover{border-color:var(--accent);background:none}
/* `/` 로 부르는 종류 목록 — 치던 자리에서 열린다. 고르개와 달리 눈으로
   찾을 필요가 없다 */
.ed-sl{position:fixed;z-index:60;display:none;flex-direction:column;gap:1px;padding:4px;
  min-width:104px;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;
  box-shadow:0 5px 18px rgba(0,0,0,.2)}
.ed-sl.on{display:flex}
.ed-sl button{font-size:12px;color:var(--tx-2);text-align:left;padding:4px 9px;
  border-radius:5px}
.ed-sl button.on,.ed-sl button:hover{background:var(--accent-bg);color:var(--accent)}
/* 지우기 — 평소에는 안 보이다가 그 줄에 손이 갈 때만 나온다.
   늘 떠 있으면 읽는 데 방해가 되고, 잘못 누르기도 쉽다.
   .nx 바깥에 둔다 — 안에 두면 고치는 글의 일부가 되어 노션에 딸려 들어간다 */
.nx-del{opacity:0;margin-left:8px;font-size:11px;color:var(--tx-3);padding:0 4px;
  border-radius:4px;vertical-align:.05em}
.ck li[data-nid]:hover>.nx-del,
.ck li[data-nid]:hover>.tgh>.nx-del{opacity:1}
.nx-del:hover{color:var(--no);background:var(--no-bg)}
.nx-del:focus-visible{opacity:1}
/* 지우기로 표시해 둔 줄의 단추. 늘 보인다 — 되돌릴 곳이 마우스를 얹어야만
   나타나면, 잘못 지운 담당자는 되돌릴 길이 없다고 읽는다 */
.nx-del.undo{opacity:1;color:var(--tx-3);border:1px solid var(--line-2);border-radius:5px;
  padding:1px 7px;font-size:10.5px}
.nx-del.undo:hover{color:var(--accent);border-color:var(--accent);background:none}
/* 옮기기·들여쓰기·종류 — 지우기와 같은 자리에서 같은 규칙으로 나온다.
   .nx 바깥에 둔다 — 안에 두면 고치는 글의 일부가 되어 노션에 딸려 들어간다.
   못 하는 것은 감추지 않고 흐린 채로 둔다. 자리가 들쭉날쭉하면 담당자는
   같은 단추를 매번 다른 곳에서 찾는다 */
.nx-mv{opacity:0;margin-left:5px;white-space:nowrap;vertical-align:.05em}
.ck li[data-nid]:hover>.nx-mv,
.ck li[data-nid]:hover>.tgh>.nx-mv,
.nx-mv:focus-within{opacity:1}
.nx-mv button{font-size:11px;color:var(--tx-3);padding:0 3px;border-radius:4px}
.nx-mv button:hover:not([disabled]){color:var(--accent);background:var(--accent-bg)}
.nx-mv button[disabled]{opacity:.28;cursor:default}
.nx-mv select{font-family:inherit;font-size:10.5px;color:var(--tx-3);margin-left:4px;
  background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px;padding:1px 2px}
.nx-mv select[disabled]{opacity:.35}
/* ── 칸(섹션) 손질 ──
   줄의 것과 같은 꼴이다. 머리말에 마우스를 얹어야 나타난다 — 클라이언트가
   보는 화면에는 애초에 그려지지 않는다 */
.ns-mv{opacity:0;margin-left:auto;white-space:nowrap;flex:none}
.notice>h3:hover .ns-mv,.ns-mv:focus-within{opacity:1}
.ns-mv button{font-size:11px;color:var(--tx-3);padding:0 3px;border-radius:4px}
.ns-mv button:hover:not([disabled]){color:var(--accent);background:var(--accent-bg)}
.ns-mv button[disabled]{opacity:.28;cursor:default}
/* 이름을 고칠 수 있다는 것만 알린다. 제목처럼 보이는 것은 그대로 둔다 */
.notice>h3>.nsx{border-radius:3px;padding:0 3px;margin:0 -3px;min-width:5em;
  cursor:text;box-shadow:inset 0 -1px 0 var(--line-2)}
.notice>h3>.nsx:focus{outline:none;background:var(--panel-2);
  box-shadow:inset 0 0 0 1px var(--accent)}
/* 이름 없는 칸의 「칸 이름」은 **손이 갈 때만** 뜬다. 늘 떠 있으면 빈 공지
   화면이 글이 아니라 채워야 할 서식으로 읽힌다. 이름은 안 붙여도 된다 */
.notice>h3:hover>.nsx:empty::before,.notice>h3>.nsx:focus:empty::before{
  content:'칸 이름';color:var(--tx-3);font-weight:400}
.notice.ed-dirty{box-shadow:inset 2px 0 var(--accent)}
.notice.ed-new{box-shadow:inset 2px 0 var(--ok)}
.notice.ed-secdel{box-shadow:inset 2px 0 var(--no)}
.notice.ed-secdel>h3>.nsx,.notice.ed-secdel .bd{opacity:.42}
.notice.ed-secdel>h3>.nsx{text-decoration:line-through}
/* ＋ 새 섹션 — 점선 상자를 걷는다. 늘 눈에 띄어야 할 것이 아니라, 필요할 때
   찾으면 되는 것이다. `/` 로도 부른다 */
.nsadd{margin:2px 0 14px}
.nsadd>.nadd-b{width:auto;border:0;padding:5px 4px;opacity:.5}
.nsadd>.nadd-b:hover{opacity:1;border:0}
/* 옮긴 줄. 고친 줄과 색을 나눈다 — 저장 창구가 둘을 갈라서 세기 때문이다 */
.ck li.ed-moved{box-shadow:inset 2px 0 var(--run);border-radius:3px}
/* 바꿀 종류. 화면은 지금 모양 그대로 그린다 — 글머리를 번호로 다시 그리는
   일은 다음 빌드가 한다. 그때까지 무엇으로 바뀔지를 여기 적어 둔다 */
.ed-rt{font-size:10.5px;color:var(--tx-3);margin-left:7px;padding:0 5px;border-radius:4px;
  background:var(--panel-2);white-space:nowrap}
/* ── 손놀림 안내 ──
   저장 창구 밑에 접어 둔다. 편집 모드에서만 그려지므로 클라이언트는 못 본다 */
.ed-help{margin:10px 0 4px;font-size:12px;color:var(--tx-2)}
.ed-help>summary{cursor:pointer;color:var(--tx-3);padding:4px 2px;list-style:none;
  display:inline-flex;align-items:center;gap:5px}
.ed-help>summary::-webkit-details-marker{display:none}
.ed-help>summary::before{content:'▸';font-size:10px}
.ed-help[open]>summary::before{content:'▾'}
.ed-help>summary:hover{color:var(--accent)}
.ed-help-b{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:2px 22px;
  margin-top:6px;padding:13px 15px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:9px}
.ed-help-b h4{font-size:11.5px;font-weight:700;color:var(--tx);margin:9px 0 5px}
.ed-help-b section:first-child h4{margin-top:0}
.ed-help-b dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0}
.ed-help-b dt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:10.5px;color:var(--tx);white-space:nowrap;background:var(--panel);
  border:1px solid var(--line-2);border-radius:4px;padding:1px 5px;height:fit-content}
.ed-help-b dd{margin:0;font-size:11.5px;color:var(--tx-2);line-height:1.55}
.ed-help-b dd code{font-size:10.5px}
.ed-help-n{grid-column:1/-1;margin:12px 0 0;padding-top:9px;font-size:11.5px;
  color:var(--tx-3);border-top:1px solid var(--line)}
/* ── 편집 모드의 할 일 ──
   클라이언트 화면은 읽기 전용이라 작은 원과 체크 표시만 둔다. 편집 모드에서는
   **누를 수 있는 네모**여야 한다 — 5px 원은 글머리 점과 구별이 안 되고,
   담당자는 `[] ` 를 쳐 놓고도 할 일이 된 줄을 모른다. 누를 자리도 못 된다 */
.notice[data-nsec] .ck li.chk::before{content:'';left:0;top:5px;width:13px;height:13px;
  border-radius:3.5px;border:1.5px solid var(--line-2);background:var(--panel-2);
  transform:none;cursor:pointer}
.notice[data-nsec] .ck li.chk:hover::before{border-color:var(--accent)}
.notice[data-nsec] .ck li.chk.on::before{content:'✓';border-color:var(--ok);
  background:var(--ok);color:#fff;font-size:9.5px;line-height:13px;text-align:center;
  font-weight:700;border-radius:3.5px;width:13px;height:13px;left:0;top:5px;transform:none}
.notice[data-nsec] .ck ul li.chk::before,
.notice[data-nsec] .ck ul li.chk.on::before{top:3px;width:12px;height:12px;line-height:12px}
/* ── 글자 색 ──
   노션이 쓰는 이름을 그대로 싣는다(`data-c`). 중계 서버가 그 이름만 받아 주고,
   봉투에도 노션에도 같은 이름으로 오간다 */
[data-c=gray]{color:#8b8b85}      [data-c=brown]{color:#a5734a}
[data-c=orange]{color:#c77d2b}    [data-c=yellow]{color:#b08b1e}
[data-c=green]{color:#3f8f5e}     [data-c=blue]{color:#3b78c4}
[data-c=purple]{color:#8a5cc4}    [data-c=pink]{color:#c2568e}
[data-c=red]{color:#c9483f}
[data-c$=_background]{border-radius:3px;padding:0 3px;margin:0 -1px}
[data-c=gray_background]{background:#8b8b8522}
[data-c=brown_background]{background:#a5734a22}
[data-c=orange_background]{background:#c77d2b28}
[data-c=yellow_background]{background:#d8b62e3d}
[data-c=green_background]{background:#3f8f5e26}
[data-c=blue_background]{background:#3b78c426}
[data-c=purple_background]{background:#8a5cc426}
[data-c=pink_background]{background:#c2568e26}
[data-c=red_background]{background:#c9483f26}
/* ── 코드 ──
   서식 없는 글 한 덩어리다. 줄바꿈과 공백이 적은 그대로 보여야 한다 */
.ck li.cd{padding-left:0;margin:8px 0}
.ck li.cd::before{content:none}
.ck li.cd>.nx,.ck li.cd>.cdb{display:block;white-space:pre-wrap;word-break:break-word;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
  line-height:1.6;background:var(--panel-2);border:1px solid var(--line);
  border-radius:6px;padding:9px 11px;overflow-x:auto}
/* ── 표 ──
   넓은 표는 제 안에서 가로로 흐른다. 본문이 통째로 밀리지 않게 한다 */
.ck li.tbl{padding-left:0;margin:9px 0}
.ck li.tbl::before{content:none}
.ntbw{overflow-x:auto;border-radius:7px;border:1px solid var(--line)}
table.ntb{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.6}
table.ntb td{border:1px solid var(--line);padding:6px 9px;vertical-align:top;
  min-width:64px}
table.ntb tr:first-child td{background:var(--panel-2);font-weight:600;color:var(--tx)}
table.ntb td>.nx{display:block;min-height:1.2em}
/* 행·열 단추 — 표에 손이 갈 때만 나온다 */
.ntbc{opacity:0;display:flex;gap:3px;margin-top:4px}
.ck li.tbl:hover>.ntbc,.ntbc:focus-within{opacity:1}
.ntbc button{font-size:11px;color:var(--tx-3);border:1px solid var(--line-2);
  border-radius:5px;padding:2px 8px}
.ntbc button:hover{color:var(--accent);border-color:var(--accent)}
/* 고친 칸에도 줄과 같은 자국을 붙인다 */
.ck td.ed-dirty{box-shadow:inset 2px 0 var(--accent)}
.ck td.ed-new{box-shadow:inset 2px 0 var(--ok)}
/* ── 줄 안의 제목 ──
   칸 이름보다 작다. 칸이 이미 그 공지의 큰 제목이라, 줄 안의 제목이 그보다
   커지면 위계가 뒤집힌다 */
.ck>li.hd1{font-size:14.5px;font-weight:700;margin:14px 0 2px;padding-left:0}
.ck>li.hd2{font-size:13.5px;font-weight:700;margin:11px 0 1px;padding-left:0}
.ck>li.hd3{font-size:13px;font-weight:600;color:var(--tx-2);margin:9px 0 1px;padding-left:0}
.ck ul li.hd1,.ck ul li.hd2,.ck ul li.hd3{padding-left:0}
.ck ul li.hd1{font-size:13.5px;font-weight:700;color:var(--tx)}
.ck ul li.hd2{font-size:13px;font-weight:700;color:var(--tx)}
.ck ul li.hd3{font-size:12.5px;font-weight:600}
/* 편집 모드에서는 손잡이 자리가 있어야 하므로 왼쪽 여백을 도로 준다 */
.notice[data-nsec] .ck li.hd1,.notice[data-nsec] .ck li.hd2,
.notice[data-nsec] .ck li.hd3{padding-left:2px}
/* ── 끌어서 옮기기 ──
   편집 모드에서만 목록을 오른쪽으로 밀어, 줄 왼쪽에 손잡이가 앉을 자리를 낸다.
   `[data-nsec]` 는 편집 모드에서만 붙으므로 클라이언트 화면은 그대로다 */
.notice[data-nsec] .ck{margin-left:16px}
.nx-gr{position:absolute;left:-16px;top:3px;width:13px;text-align:center;opacity:0;
  cursor:grab;font-size:11px;line-height:1.4;color:var(--tx-3);user-select:none;
  border-radius:4px}
.ck ul>li>.nx-gr{top:1px}
.ck li[data-nid]:hover>.nx-gr,.nx-gr:focus-visible{opacity:1}
.nx-gr:hover{color:var(--accent);background:var(--accent-bg)}
.nx-gr:active{cursor:grabbing}
.ck li.ed-dragging{opacity:.4}
/* 여러 줄 잡기 — 무엇에 걸리는지 보이게. 글자 위의 파란 칠(브라우저가 그리는
   것)은 고른 글자만 덮어서, 그 줄 통째로 걸린다는 것이 드러나지 않는다 */
.ck li[data-nid].ed-pick{background:var(--accent-bg);border-radius:3px}
/* 놓을 자리. 고침·보탬 표시(왼쪽 세로줄)보다 힘이 세야 한다 — 끄는 동안에는
   어디에 떨어지는지가 유일하게 중요한 것이다 */
.ck li[data-nid].ed-dropup{box-shadow:inset 0 2px 0 var(--accent)}
.ck li[data-nid].ed-dropdn{box-shadow:inset 0 -2px 0 var(--accent)}
/* 마지막 줄 밑의 빈 자리. 여기를 누르면 줄이 선다 — 노션과 같다.
   보이는 것은 아무것도 없고 커서 모양만 「글 쓰는 자리」로 바뀐다 */
.ntail{min-height:32px;cursor:text}
/* 빈 줄의 안내 글자. 커서가 놓인 줄과, 칸에 하나뿐인 줄에만 뜬다 —
   빈 줄마다 떠 있으면 글이 아니라 서식처럼 보인다 */
.nx.ed-hint:focus::before,
.ck li[data-nid]:only-child>.nx.ed-hint::before{content:'글을 쓰거나 / 를 눌러 종류를 고르세요';
  color:var(--tx-3);font-weight:400;pointer-events:none}
/* ＋ 새 섹션 — 공지 맨 끝 */
.nadd-b{font-size:12px;color:var(--tx-3);border:1px dashed var(--line-2);border-radius:7px;
  padding:7px 13px;width:100%;text-align:left}
.nadd-b:hover{color:var(--accent);border-color:var(--accent)}
/* 공지 속 링크. 맨 위 a{} 가 링크 꼴을 지워 두므로 여기서 되살린다 —
   눌리는 줄 모르면 담당자가 건 링크는 없는 것과 같다 */
.ck a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.ck a:hover{opacity:.72}
/* 커스텀 이모지 — 글자 흐름에 얹히는 작은 그림이다 */
.cem{height:1em;width:auto;vertical-align:-.15em;margin:0 2px;display:inline-block}
/* 표·그림·코드·구분선은 항목 안에 통째로 들어온다. 앞의 점을 지우고 폭을 채운다 */
.ck li:has(>table),.ck li:has(>figure),.ck li:has(>pre),.ck li:has(>hr),
.ck li:has(>blockquote),.ck li:has(>.nx>blockquote){padding-left:0}
.ck li:has(>table)::before,.ck li:has(>figure)::before,
.ck li:has(>pre)::before,.ck li:has(>hr)::before,
.ck li:has(>blockquote)::before,.ck li:has(>.nx>blockquote)::before{content:none}
.ck li>table{width:100%;border-collapse:collapse;margin:7px 0;font-size:12px;
  display:table;table-layout:auto}
.ck li>table th,.ck li>table td{border:1px solid var(--line);padding:5px 8px;
  text-align:left;vertical-align:top;line-height:1.5}
.ck li>table thead th{background:var(--panel-2);font-weight:600;color:var(--tx)}
.ck li>table td{color:var(--tx-2)}
.ck li>hr{border:none;border-top:1px solid var(--line);margin:9px 0}
.ck li>figure{margin:7px 0}
.ck li>figure figcaption{font-size:11px;color:var(--tx-3);margin-top:4px}
.ck li>pre,.ck li>figure>pre{background:var(--panel-2);border:1px solid var(--line);
  border-radius:6px;padding:8px 10px;margin:7px 0;overflow-x:auto;font-size:11.5px}
.ck img.nim{max-width:100%;height:auto;border-radius:6px;display:block}
.ck blockquote{border-left:2px solid var(--line-2);padding-left:9px;color:var(--tx-2)}
/* 첨부 파일명과 하위 페이지 제목. 둘 다 누를 수 없다 — 파일은 레포에 두지 않고,
   하위 페이지는 클라이언트에게 노션 권한이 없어 열리지 않는다 */
.ck span.att,.ck span.cpg{display:inline-flex;align-items:flex-start;gap:6px;
  font-size:12.5px;color:var(--tx-2);padding:3px 0;line-height:1.5;cursor:default}
.ck .ic{font-size:12px;flex:none;opacity:.85;line-height:1.5}
/* 표가 좁은 화면에서 넘칠 때 가로 스크롤로 흘린다 */
.ck li>table{overflow-x:auto}
/* 읽기 전용 화면이라 입력 컨트롤처럼 보이는 체크박스를 두지 않는다.
   끝난 일은 체크 표시만, 남은 일은 빈 원만 둔다. */
.ck li.chk{color:var(--tx)}                    /* 지금 해야 할 일 */
/* 빈 원은 1.5px 링이라 --line-2 로는 두 테마 모두 1.5:1 대비로 묻힌다 */
.ck li.chk::before{content:'';position:absolute;left:2px;top:11px;
  width:5px;height:5px;border-radius:50%;border:1.5px solid var(--tx-3)}
.ck li.chk.on{color:var(--tx-2)}               /* 끝난 일은 한 단계 죽인다 */
.ck li.chk.on::before{                         /* 박스 없이 체크 모양만 */
  left:3px;top:8.5px;width:6px;height:10px;border-radius:1px;
  border:solid var(--ok);border-width:0 2px 2px 0;transform:rotate(45deg)}
.ck li.plain::before{content:'';position:absolute;left:4px;top:11px;width:4px;height:4px;
  border-radius:50%;background:var(--tx-3)}
.ck ul{list-style:none;margin:2px 0 4px}
/* 후손 선택자라 2단 이하가 모두 같은 크기·색이다 — 깊어져도 더 죽이지 않는다 */
.ck ul li{padding:2px 0 2px 14px;position:relative;font-size:12.5px;
  color:var(--tx-2);line-height:1.65}
/* 들여쓰기는 4단까지만 늘린다. 더 들어가면 본문이 오른쪽으로 밀려 읽기 나쁘다.
   ul 이 4개 겹치는 지점(5단)부터 부모가 준 들여쓰기를 되돌린다 */
.ck ul ul ul ul{margin-left:-14px}
.ck ul li.chk::before{left:1px;top:9px;width:4px;height:4px;border-width:1.5px}
.ck ul li.chk.on::before{left:2px;top:6.5px;width:5px;height:8px;border-width:0 2px 2px 0}
/* 하위 불릿은 상위와 위계가 갈리도록 한 단계 더 죽인다 */
.ck ul li.plain::before{left:4px;top:9px;width:3px;height:3px;background:var(--line-2)}
/* ── 항목의 종류 ──
   봉투가 종류를 실으면 종류대로 그린다. 담당자가 번호 목록으로 바꾼 것이
   클라이언트에게도 번호로 보여야 바꾼 뜻이 산다. 종류를 싣지 않는 봉투(노션에서
   읽은 것)는 지금까지처럼 할 일과 그 밖 둘로만 그린다 */
.ck,.ck ul{counter-reset:nnum}
.ck li.ord{counter-increment:nnum}
.ck>li.ord::before{content:counter(nnum) ".";position:absolute;left:0;top:3px;
  width:15px;text-align:right;font-size:12px;line-height:1.65;color:var(--tx-3);
  font-variant-numeric:tabular-nums}
.ck ul li.ord::before{left:0;top:2px;width:11px;font-size:11.5px;line-height:1.65}
/* 본문에는 표시가 없다. 앞의 여백은 남겨 다른 줄과 글머리가 맞는다 */
.ck li.para::before{content:none}
/* 안에 든 줄이 없는 토글. 펼 것이 없어 접기 손잡이는 달지 않지만, 종류는
   드러나야 한다 — 글머리와 똑같이 그리면 담당자가 바꾼 것이 화면에서 사라진다 */
.ck li.tg0::before{content:'▸';position:absolute;left:2px;top:0;
  font-size:9px;line-height:2.4;color:var(--tx-3);background:none;
  width:auto;height:auto;border-radius:0}
.ck ul li.tg0::before{left:3px;line-height:2.3;font-size:8px}
/* 인용. 노션에서 읽은 봉투는 <blockquote> 를 싣고 저장소에서 온 봉투는 종류를
   싣는다 — 어느 쪽으로 와도 같은 꼴이 되게 둘 다 여기서 그린다 */
.ck li.qt{padding-left:11px;border-left:2px solid var(--line-2);color:var(--tx-2)}
.ck li.qt::before{content:none}
/* 어긋남 상자 — 다른 담당자가 먼저 저장했을 때 저장소의 지금 공지를 나란히 낸다.
   화면에 적어 둔 글은 그대로 두고, 어느 쪽을 남길지는 담당자가 고른다 */
.ed-cf{border:1px solid var(--line-2);border-radius:8px;background:var(--panel-2);
  margin:10px 0 16px;overflow:hidden}
.ed-cf .cf-t{font-size:11.5px;font-weight:600;color:var(--tx-2);padding:9px 12px;
  border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
.ed-cf .cf-v{font-weight:400;color:var(--tx-3)}
.ed-cf .cf-b{padding:9px 12px;max-height:260px;overflow-y:auto}
.ed-cf .cf-h{font-size:11.5px;font-weight:600;margin:7px 0 3px;color:var(--tx-2)}
.ed-cf .cf-h:first-child{margin-top:0}
.ed-cf .cf-l{font-size:12px;line-height:1.6;color:var(--tx-2);padding:1px 0}
.ed-cf .cf-e{color:var(--tx-3)}
.ed-cf .cf-a{display:flex;gap:7px;padding:9px 12px;border-top:1px solid var(--line)}
.ed-cf .rv-l{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:12px}
.ed-cf .rv-w{color:var(--tx-3);font-variant-numeric:tabular-nums;flex:none}
.ed-cf .rv-t{color:var(--tx-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-cf .rv-l .edt-b{margin-left:auto;flex:none}
.ck s{opacity:.72}
/* 노션에서는 코드지만 여기서는 그냥 강조어다. 네모를 빼고 밑줄만 둔다 */
.ck code{font-size:inherit;font-family:inherit;font-weight:600;color:var(--tx);
  box-shadow:inset 0 -1px 0 var(--line-2)}
.empty{font-size:12.5px;color:var(--tx-3);padding:2px 0}

.cal-w{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:20px}
.cal h4{font-size:11.5px;font-weight:600;margin-bottom:7px}
/* 6주로 밀리는 달이 있어 높이를 미리 잡아둔다 — 두 달력의 아래가 어긋나지 않게.
   align-items:start 가 없으면 5주짜리 달의 칸이 늘어나 높이만 맞고 칸이 어긋난다 */
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;
  align-items:start;min-height:191px}
.cal-g span{height:28px;display:grid;place-items:center;font-size:11.5px;color:var(--tx-2);
  position:relative;border-radius:5px;font-variant-numeric:tabular-nums}
.cal-g span.wk{height:17px;font-size:9.5px;color:var(--tx-3)}
.cal-g span.dim{opacity:.22}
.cal-g span.ev{color:var(--tx);font-weight:600;background:var(--panel-2)}
[data-theme="light"] .cal-g span.ev{background:var(--hover)}
/* 점 색은 일정 종류에 따라 --dot 으로 들어온다 (진행 파랑 / 마감 노랑) */
.cal-g span.ev::after{content:'';position:absolute;bottom:3px;width:3px;height:3px;
  border-radius:50%;background:var(--dot,var(--run))}
.cal-g span.tdy{background:var(--accent);color:#fff;font-weight:600}
.cal-g span.tdy::after{background:#fff}
.evl{border-left:1px solid var(--line);padding-left:20px}
.evl .e{display:flex;gap:11px;padding:0 0 14px}
.evl .e:last-child{padding-bottom:0}
.evl .e.gone{opacity:.5}
/* 임박한 건만 색을 준다. 전부 빨가면 무엇이 급한지 알 수 없다 */
.evl .e .dd{width:48px;flex:none;font-size:11.5px;color:var(--tx-3);font-weight:500;
  font-variant-numeric:tabular-nums;padding-top:1px}
.evl .e .dd.soon{color:var(--run)}
.evl .e .ei{min-width:0;display:flex;flex-direction:column;gap:2px}
/* min-width:0 이 없으면 flex 안에서 말줄임이 걸리지 않는다 */
.evl .e .t{display:flex;align-items:center;gap:6px;min-width:0;
  font-size:12.5px;font-weight:500;line-height:1.45}
.evl .e .t .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evl .e .t .kd{flex:none;font-size:10px;font-weight:500;border:1px solid var(--line-2);
  border-radius:3px;padding:0 5px;color:var(--tx-3);white-space:nowrap}
.evl .e .m{font-size:11.5px;color:var(--tx-2);font-variant-numeric:tabular-nums}
/* 잘려 나간 나머지. 목록 항목과 같은 들여쓰기에 맞춘다 */
.evl .emore{display:block;padding-left:59px;font-size:11.5px;color:var(--tx-3);padding-bottom:0}
.evl .emore:hover{color:var(--tx)}
@media(max-width:900px){.cal-w{grid-template-columns:1fr}
  .evl{border-left:none;padding-left:0;border-top:1px solid var(--line);padding-top:14px}}

table{width:100%;border-collapse:collapse}
thead tr{background:var(--panel-2)}          /* 헤더를 본문과 분리 */
th{font-size:11.5px;font-weight:600;color:var(--tx-2);text-align:left;padding:9px 13px;
  border-bottom:1px solid var(--line-2);white-space:nowrap}
th:first-child{border-top-left-radius:9px}
th:last-child{border-top-right-radius:9px}
td{padding:13px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}
td.lead{vertical-align:top}                  /* 제목+최신로그 2줄짜리 셀만 위 정렬 */
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--hover)}
.t-nm{font-weight:500;letter-spacing:-.012em;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.t-sub{font-size:11.5px;color:var(--tx-2);margin-top:3px;line-height:1.55}
.dtc{color:var(--tx-2);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* 지원내용 — 금액과 산출물 문구가 함께 온다. 긴 문구는 줄바꿈을 허용한다 */
.sup{font-size:12.5px;color:var(--tx-2);white-space:normal;word-break:keep-all}
/* 최신로그 날짜 — 「최근」 열이 없어져 설명 줄 앞으로 옮겼다 */
.t-sub .lgd{color:var(--tx-3);font-variant-numeric:tabular-nums;margin-right:6px}
.tag{display:inline-flex;align-items:center;font-size:11.5px;padding:3px 9px;
  border-radius:4px;white-space:nowrap;font-weight:600}
.g-run{background:var(--run-bg);color:var(--run)}
.g-ok{background:var(--ok-bg);color:var(--ok)}
.g-no{background:var(--no-bg);color:var(--no)}
.g-wait{background:var(--panel-2);color:var(--tx-3)}
[data-theme="light"] .g-wait{background:var(--hover);color:var(--tx-2)}
tbody tr.gone{opacity:.55}          /* 마감이 지난 추천 사업 */

/* 소통 내역 — 열 폭을 고정해 제목 열이 나머지를 갖는다 */
.tktbl{table-layout:fixed}
/* 회의록 안쪽 표까지 걸리지 않도록 바깥 표의 직계만 잡는다 */
.tktbl>tbody>tr>td{padding:9px 13px}          /* preview 가 빠져 행을 줄인다 */
.tktbl .tkpv{font-size:11.5px;color:var(--tx-3);line-height:1.5;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 채널도 방향과 같은 배지로 통일한다 */
.ch-b{display:inline-block;font-size:10.5px;font-weight:600;border-radius:4px;
  padding:2px 7px;white-space:nowrap;line-height:1.5}
.ch-mail{background:var(--panel-2);color:var(--tx-2)}
[data-theme="light"] .ch-mail{background:var(--hover)}
.ch-call{background:var(--ok-bg);color:var(--ok)}
.ch-meet{background:var(--accent-bg);color:var(--accent)}

/* 주요 소통 — 목록 위에 따로 선다. 표가 아니라 목록인 까닭은 여기 오르는 것이
   서너 건이고, 표의 격자는 그만한 수를 훑는 데 도움이 되지 않기 때문이다 */
.tkmj{margin-bottom:18px}
.tkmj h2{font-size:13px;font-weight:600;letter-spacing:-.015em;color:var(--tx);
  display:flex;align-items:baseline;gap:7px;margin-bottom:8px}
.tkmj h2 span{font-size:11.5px;font-weight:400;color:var(--tx-3);
  font-variant-numeric:tabular-nums}
.tkmj .card{margin-bottom:0}
.mjl li{list-style:none;padding:10px 13px;cursor:pointer;
  border-bottom:1px solid var(--line)}
.mjl li:last-child{border-bottom:none}
.mjl li:hover{background:var(--hover)}
.mj-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mj-d{font-size:11.5px;color:var(--tx-3);font-variant-numeric:tabular-nums;flex:none}
.mj-t{font-size:12.5px;font-weight:500;letter-spacing:-.012em}
.mj-p{display:block;font-size:11.5px;color:var(--tx-3);line-height:1.5;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 목록에서도 어느 줄이 주요인지 보인다 — 위의 덩어리와 아래 목록이 같은 것을
   가리킨다는 표가 없으면 담당자가 같은 건을 둘로 센다 */
.mj-s{font-style:normal;color:var(--accent);font-size:11px;flex:none}
/* 위에서 짚어 내려온 줄. 애니메이션이 끝나면 저절로 가라앉는다 */
@keyframes tkhi{from{background:var(--accent-bg)}to{background:transparent}}
tr.tkhi>td{animation:tkhi 1.6s ease-out}

/* 소통 내역 아코디언 — 본문이 있는 행만 펼쳐진다 */
tr.tk.has{cursor:pointer}
.tw{display:inline-block;width:11px;font-style:normal;color:var(--tx-3);
  transition:transform .12s;flex:none}
tr.tk.open .tw{transform:rotate(90deg)}
tr.tkb{display:none}
tr.tkb.open{display:table-row}
tr.tkb:hover{background:transparent}
tr.tkb>td{padding:0 13px 13px;border-bottom:1px solid var(--line)}
.tkbd{font-size:11.5px;color:var(--tx-2);line-height:1.75;white-space:pre-wrap;
  word-break:break-word;border-left:2px solid var(--line-2);padding-left:11px}
/* 회의록 본문 — 노션 페이지 블록을 옮긴 HTML 이라 pre-wrap 을 끈다 */
.tkbd.doc{white-space:normal;font-size:12.5px;padding-top:2px}
.tkbd.doc>*:first-child{margin-top:0}
.tkbd.doc h2{font-size:14px;font-weight:600;color:var(--tx);margin:16px 0 6px;letter-spacing:-.015em}
.tkbd.doc h3{font-size:13px;font-weight:600;color:var(--tx);margin:14px 0 5px}
.tkbd.doc h4{font-size:12.5px;font-weight:600;color:var(--tx);margin:12px 0 4px}
.tkbd.doc p{margin:5px 0}
.tkbd.doc hr{border:none;border-top:1px solid var(--line);margin:14px 0}
.tkbd.doc ul,.tkbd.doc ol{margin:5px 0 5px 17px}
.tkbd.doc li{margin:2px 0}
.tkbd.doc li>ul,.tkbd.doc li>ol{margin:2px 0 2px 15px}   /* 중첩 들여쓰기 */
.tkbd.doc code{background:var(--panel-2);border-radius:3px;padding:1px 5px;font-size:11.5px;color:var(--tx)}
[data-theme="light"] .tkbd.doc code{background:var(--hover)}
.tkbd.doc .cl{background:var(--panel-2);border-radius:6px;padding:9px 12px;margin:9px 0}
[data-theme="light"] .tkbd.doc .cl{background:var(--hover)}
/* 표는 본문 표 스타일을 그대로 쓰되 폭만 100% 로 맞춘다 */
.tkbd.doc table{width:100%;margin:9px 0;border:1px solid var(--line);border-radius:8px;
  border-collapse:separate;border-spacing:0;overflow:hidden}
.tkbd.doc th,.tkbd.doc td{padding:8px 10px;font-size:12px;text-align:left;vertical-align:top;
  border-bottom:1px solid var(--line);white-space:normal}
.tkbd.doc thead th{background:var(--panel-2);color:var(--tx-2);font-weight:600;
  border-bottom:1px solid var(--line-2)}
.tkbd.doc tbody tr:last-child th,.tkbd.doc tbody tr:last-child td{border-bottom:none}
.tkbd.doc tbody tr:hover{background:transparent}
/* 본문 안의 표는 화면 목록과 달리 독립된 표다. 아래를 닫아 두지 않으면 열려
   보인다. 위의 「마지막 행은 테두리 없음」 규칙을 여기서만 되돌린다.
   화면 목록 표(.tb 등)는 선택자에 안 걸리므로 그대로다 */
.tkbd.doc table tbody tr:last-child th,
.tkbd.doc table tbody tr:last-child td,
.ck li>table tbody tr:last-child th,
.ck li>table tbody tr:last-child td{border-bottom:1px solid var(--line)}
.tkpv{color:var(--tx-3)}
.co{font-size:10.5px;border:1px solid var(--line-2);border-radius:3px;padding:0 6px;color:var(--tx-3)}
/* 우리가 보낸 메일. 받은 것과 한눈에 갈리도록 강조색만 얹는다 */
.co.out{color:var(--accent);border-color:var(--accent);font-weight:600}
.rv{font-size:10.5px;border:1px solid var(--line-2);border-radius:3px;padding:1px 6px;color:var(--tx-2)}
.rv:hover{background:var(--hover);color:var(--tx);border-color:var(--accent)}
.steps{display:flex;gap:3px;margin-top:2px;max-width:150px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line-2)}
.steps i.f{background:var(--ok)}.steps i.c{background:var(--run)}
.stepnm{font-size:11px;color:var(--tx-2);margin-top:5px}
.stepnm b{color:var(--run);font-weight:600}
/* ── 기업인증·지식재산권 표 ──────────────────────────
   시안 cert-toggle-v3 에서 옮겼다. 행을 펼쳐야 해서 <table> 대신 그리드다
   — tbody 안에 <details> 를 넣을 수 없다. 겉모습은 옆 표와 같게 맞췄다:
   머리 배경 --panel-2, 머리 아래 --line-2, 행 구분선 --line, hover --hover.
   셸에 .cols .thead .badge .steps .body .f 가 이미 있어 전부 .ct- 로 갈랐다.
   단계 막대와 상태 뱃지만은 셸 것(.steps · .tag.g-*)을 그대로 쓴다 —
   초록·노랑·빨강이 화면 전체에서 같은 뜻이어야 한다. */
.ct-tbl{overflow:hidden;border-radius:9px}
.ct-cols{display:grid;grid-template-columns:1fr 190px 104px 150px 168px;
  gap:14px;align-items:center;padding:11px 20px}
.ct-hd{background:var(--panel-2);border-bottom:1px solid var(--line-2)}
.ct-hd span{font-size:11.5px;color:var(--tx-2);font-weight:600}
.ct-tbl details{border-bottom:1px solid var(--line)}
.ct-tbl details:last-child{border-bottom:none}
.ct-tbl summary{list-style:none;cursor:pointer;transition:background .12s}
.ct-tbl summary::-webkit-details-marker{display:none}
.ct-tbl summary::marker{content:''}
.ct-tbl summary:hover{background:var(--hover)}
.ct-tbl details[open] summary{background:var(--panel-2)}
.ct-tbl summary .ct-cols{padding:15px 20px}
/* 펼칠 것이 없는 행 — 화살표도 hover 도 없다. 빈 토글을 만들지 말 것 */
.ct-tbl .ct-row{border-bottom:1px solid var(--line)}
.ct-tbl .ct-row:last-child{border-bottom:none}
.ct-tbl .ct-row .ct-cols{padding:15px 20px}
.ct-nm{font-size:13.5px;font-weight:700;color:var(--tx);letter-spacing:-.012em}
.ct-sub{font-size:11.5px;color:var(--tx-2);margin-top:3px}
.ct-sub .lgd{color:var(--tx-3);font-variant-numeric:tabular-nums;margin-right:5px}
.ct-per{font-size:12.5px;color:var(--tx-2);font-variant-numeric:tabular-nums}
.ct-val{font-size:12.5px;color:var(--tx-2);font-weight:600;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums}
.ct-val .ct-rem{display:block;font-size:11px;color:var(--tx-3);font-weight:400;margin-top:2px}
/* 기한이 없는 인증. 유효/만료 어느 쪽도 아니라 회색이다 */
.tag.g-none{background:var(--panel-2);color:var(--tx-3)}
.ct-body{padding:4px 20px 20px;background:var(--panel-2);border-top:1px solid var(--line)}
.ct-g2{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding-top:16px}
.ct-f{display:flex;gap:12px;padding:5px 0;font-size:12.5px}
.ct-k{width:76px;flex:none;color:var(--tx-3)}
/* 값이 길면 줄을 바꾼다. min-width:0 이 없으면 flex 아이템이 안 줄어든다 */
.ct-v{color:var(--tx-2);flex:1;min-width:0;word-break:keep-all}
.ct-v b{font-weight:700;color:var(--tx)}
.ct-ben-t{font-size:11.5px;font-weight:700;color:var(--accent);margin-bottom:8px}
.ct-ben ul{list-style:none}
.ct-ben li{font-size:12px;color:var(--tx-2);padding:3.5px 0 3.5px 13px;
  position:relative;line-height:1.55}
.ct-ben li::before{content:'';position:absolute;left:1px;top:11px;
  width:4px;height:4px;border-radius:50%;background:var(--line-2)}
.ct-ben li b{font-weight:700;color:var(--tx)}
.ct-note{font-size:11px;color:var(--tx-3);margin-top:9px}
@media(max-width:900px){
  .ct-hd{display:none}
  .ct-cols{grid-template-columns:1fr;gap:8px}
  .ct-g2{grid-template-columns:1fr;gap:18px}
}
/* 인쇄는 접힌 것을 전부 편다 — 종이에는 누를 수가 없다 */
@media print{
  .ct-tbl details>*{display:block}
  .ct-g2{grid-template-columns:1fr 1fr}
}
.chips{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 11px;border-radius:var(--r);color:var(--tx-2);background:var(--panel-2)}
[data-theme="light"] .chip{background:var(--panel-2)}
.chip:hover{background:var(--hover);color:var(--tx)}
.chip.on{background:var(--accent);color:#fff}
.chip.zero{color:var(--tx-3)}                 /* 0건이어도 눌러볼 수 있게 남긴다 */
.chip.zero.on{color:#fff}
.chip span{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}

/* ── 비밀번호 게이트 ── */
body.locked>aside,body.locked>main{display:none}
#gate{position:fixed;inset:0;display:none;place-items:center;padding:24px;
  background:var(--bg);z-index:60}
body.locked #gate{display:grid}
.gt{width:100%;max-width:340px;text-align:center}
/* 잠금 화면은 그로스하이 로고를 쓴다. 클라이언트 로고를 여기 두면
   비밀번호를 넣기 전에 어느 회사 페이지인지 알 수 있다.
   로고 PNG 는 배경이 검정이라 다크 테마에서 타일 경계가 사라진다 → 테두리를 준다 */
.gt .mk{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:12px;
  background:#000;border:1px solid var(--line-2);overflow:hidden;margin-bottom:15px}
.gt .mk img{width:100%;height:100%;object-fit:contain;border-radius:inherit;display:block}
[data-theme="dark"] .gt .mk{border-color:rgba(255,255,255,.28)}
.gt h1{font-size:16px;font-weight:600;letter-spacing:-.02em}
.gt .sub{font-size:12.5px;color:var(--tx-3);margin-top:6px;line-height:1.65}
.gt form{margin-top:19px;display:flex;flex-direction:column;gap:8px}
.gt input{width:100%;height:42px;padding:0 13px;border-radius:var(--r);
  border:1px solid var(--line-2);background:var(--panel);color:var(--tx);
  font-family:inherit;font-size:16px}  /* 16px 미만이면 iOS 에서 포커스 시 확대된다 */
.gt input:focus{outline:none;border-color:var(--accent)}
.gt button{height:42px;border-radius:var(--r);background:var(--accent);color:#fff;
  font-size:13.5px;font-weight:500}
.gt button[disabled]{opacity:.55;cursor:default}
.gt .msg{font-size:12px;min-height:18px;color:var(--no);line-height:1.5}
.gt .msg.busy{color:var(--tx-3)}

.err{max-width:560px;margin:64px auto;padding:0 20px;text-align:left}
.err h1{font-size:17px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
.err p{font-size:13px;color:var(--tx-2);line-height:1.7}
.err .box{margin-top:14px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);padding:14px 16px;font-size:12.5px;color:var(--tx-2);line-height:1.75}
.err code{background:var(--panel-2);border-radius:3px;padding:2px 6px;font-size:12px;color:var(--tx)}
.err .why{margin-top:10px;font-size:11.5px;color:var(--tx-3);word-break:break-all}

::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px}
@media(max-width:820px){body{overflow:auto}aside{display:none}main{height:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ══ 인쇄 ══════════════════════════════════════════════════════════
   라이브러리 없이 브라우저 인쇄를 쓴다. 글자가 이미지로 뭉개지지 않아야
   PDF 에서 선택·검색이 되고 한글도 깨지지 않는다.
   화면 DOM 은 건드리지 않고 #printdoc 을 따로 채워 그것만 인쇄한다. */
@media print{
  @page{margin:14mm 12mm}
  html,body{height:auto;overflow:visible;display:block;background:#fff}
  aside,main,#gate{display:none!important}
  #printdoc{display:block!important;max-width:none;padding:0}
  /* 뱃지·표 헤더 배경이 빠지면 읽기 어렵다 */
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}

  /* 표지 */
  /* 표지에 break-after 를 걸고 다음 섹션에 break-before 를 걸면 강제 개행이
     두 번 겹쳐 빈 장이 생긴다. 개행은 섹션 쪽 한 곳에서만 낸다. */
  .pcover{display:flex;flex-direction:column;justify-content:center;
    min-height:88vh;text-align:center}
  .pcv-marks{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:26px}
  .pcv-marks img{height:46px;width:auto;object-fit:contain}
  .pcv-sep{width:1px;height:30px;background:var(--line-2)}
  .pcover h1{font-size:26px;font-weight:600;letter-spacing:-.03em}
  .pcv-d{font-size:13px;color:var(--tx-2);margin-top:10px}
  .pcv-m{font-size:12.5px;color:var(--tx-3);margin-top:22px}

  /* 섹션마다 새 장에서 시작한다. 맨 앞(표지 없는 「현재 화면」)은 예외다 */
  .psec{break-before:page;padding:0}
  .psec:first-child{break-before:auto}
  .psec>h2{font-size:16px;font-weight:600;letter-spacing:-.02em;margin-bottom:12px;
    padding-bottom:7px;border-bottom:1px solid var(--line-2);
    break-after:avoid}                          /* 제목만 남기고 넘기지 않는다 */
  .psec>h2+*{break-before:avoid}                /* 제목 바로 다음 것도 붙여 둔다 */
  .psec .vh{display:none}                       /* 섹션 제목이 대신한다 */

  /* 표는 길면 페이지를 넘어가며 이어지는 게 맞다. 통짜로 밀어내지 않는다.
     .card 에 break-inside: avoid 를 걸면 표를 품은 카드째 다음 장으로 넘어가
     제목만 남은 빈 장이 생긴다. */
  table{break-inside:auto}
  thead{display:table-header-group}             /* 장이 넘어가면 헤더 반복 */
  tr{break-inside:avoid}                        /* 행 하나가 잘리지 않게 */
  .notice,.k1,.evl .e{break-inside:avoid}
  .card{box-shadow:none;break-inside:auto}

  /* ── 요약 리포트 — A4 한두 장에 들어가도록 전체를 한 단계 줄인다.
        섹션 사이에 개행을 넣지 않고 이어서 흐르게 둔다 ── */
  .psum{font-size:10px;line-height:1.5}
  .psum .sh{display:flex;align-items:center;gap:12px;
    padding-bottom:9px;margin-bottom:12px;border-bottom:1.5px solid var(--line-2)}
  .psum .sh-m{display:flex;align-items:center;gap:8px;flex:none}
  .psum .sh-m img{height:26px;width:auto;object-fit:contain}
  .psum .sh-t{display:flex;flex-direction:column;gap:1px}
  .psum .sh-t b{font-size:14px;font-weight:600;letter-spacing:-.02em}
  .psum .sh-t span{font-size:9.5px;color:var(--tx-2)}
  .psum .ssec{margin-bottom:11px;break-inside:auto}
  .psum .ssec>h2{font-size:12px;font-weight:600;letter-spacing:-.015em;
    margin-bottom:5px;break-after:avoid}
  .psum .skpi{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .psum .skpi>div{border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;
    display:flex;flex-direction:column;gap:1px}
  .psum .skpi .k{font-size:9px;color:var(--tx-2)}
  .psum .skpi .v{font-size:14px;font-weight:600;letter-spacing:-.02em}
  .psum .skpi .s{font-size:8.5px;color:var(--tx-3)}
  .psum table{width:100%;border-collapse:collapse}
  .psum th{font-size:9px;padding:5px 6px;background:var(--panel-2);
    border-bottom:1px solid var(--line-2)}
  .psum td{font-size:10px;padding:6px;border-bottom:1px solid var(--line);
    vertical-align:middle}
  .psum tbody tr:last-child td{border-bottom:none}
  .psum .snote{font-size:9.5px;color:var(--tx-3);margin-top:5px}
  .psum .ck>li{font-size:10px;line-height:1.5;padding:2px 0 2px 18px}
  .psum .ck li.chk::before{top:8px}
  .psum .ck li.chk.on::before{top:5.5px}
  .psum .ck>li.ord::before{top:2px;width:12px;font-size:9.5px;line-height:1.5}
  /* 인용은 왼쪽에 붙인다. 위의 `.psum .ck>li` 가 들여쓰기를 되돌려 놓아
     여기서 다시 짚지 않으면 세로줄과 글이 멀찍이 떨어진다 */
  .psum .ck>li.qt{padding-left:9px}
  .psum .ck>li.tg0::before{line-height:2.1}
  .psum .empty{font-size:9.5px}

  /* 화면 전용 장치는 뺀다 */
  .chips,.more,.emore,.tw,.rpt,.tgl,.top{display:none!important}
  /* 접기는 화면에서만이다. 종이에는 전부 펼쳐 나가야 한다 */
  .notice>.bd,.ck li.tg>ul{display:block!important}
  .notice>h3{cursor:auto}
  /* 일정은 달력을 빼고 목록만 — 종이에서 달력은 자리만 차지한다 */
  .cal-w{display:block}
  .cal{display:none}
  .evl{border-left:none;padding-left:0}
  /* 소통 내역은 목록만 낸다 — 본문은 인쇄 문서에 아예 싣지 않는다 */
  .kpi{grid-template-columns:repeat(4,1fr)}
  .view{padding:0;max-width:none}
}
/* ── 조달현황 화면 ──────────────────────────────────────
   시안 kcos-performance-v8 에서 옮겼다. 셸과 겹치는 이름이 많아
   (.card .item .grp .two .legend .axis .n .lg .dot) 전부 .perf- 로 갈랐다.
   색은 셸 토큰을 그대로 쓴다 — 다크 모드도 같이 따라간다.
   body·.wrap·.page-title 은 옮기지 않는다. 셸 레이아웃이 깨진다. */
.perf{--perf-c1:var(--accent);
      --perf-c2:#9DBAFF;
      --perf-c2:color-mix(in srgb, var(--accent) 38%, var(--panel));
      --perf-grid:var(--line)}
.perf-card{background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:26px 28px;margin-bottom:12px}
.perf-nums{display:grid;grid-template-columns:repeat(3,1fr)}
.perf-n{padding:0 24px;border-left:1px solid var(--line)}
.perf-n:first-child{padding-left:0;border-left:none}
.perf-n-val{font-size:32px;font-weight:800;letter-spacing:-.04em;
  line-height:1.05;color:var(--tx)}
.perf-n-val .perf-u{font-size:14px;font-weight:600;margin-left:1px}
.perf-n-lbl{font-size:12px;color:var(--tx-3);margin-top:7px}
.perf-n:first-child .perf-n-val{color:var(--perf-c1)}
.perf-blk-t{font-size:13px;font-weight:600;color:var(--tx)}
.perf-blk-s{font-size:11px;color:var(--tx-3);margin-top:2px;margin-bottom:14px}
.perf-two{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:start}
.perf-col-r{border-left:1px solid var(--line);padding-left:30px}
.perf-axis{font-size:11px;fill:var(--tx-3)}
.perf-ylab{font-weight:600;fill:var(--tx-2)}
.perf-bval{font-weight:700;letter-spacing:-.02em}
.perf-legend{display:flex;gap:14px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.perf-lg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx-2)}
.perf-lg i{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
/* 분류 필터 — 조달현황 화면 전용. 칩 모양은 소통 내역 탭과 같은 것을 쓴다.
   구분은 하나만, 연도는 여러 개 고를 수 있다 */
/* 필터는 분야별 조달 현황 카드 안, 머리글 바로 밑이다 */
.perf-filters{display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin:-6px 0 16px}
.perf-fgrp{display:flex;align-items:center;gap:8px;min-width:0}
.perf-flbl{font-size:11.5px;font-weight:600;color:var(--tx-3);flex:none}
.perf-filters .chips{margin-bottom:0}
/* 분야별 조달 현황 — 시안 procurement-rev3 에서 옮겼다. 셸과 겹치는 이름이
   많아(.card .hd .split .rw .unit .sub .si .axis) 전부 .pv- 로 갈랐다.
   분야 색만 고정값이다 — 같은 분야가 두 테마에서 같은 색이어야 읽힌다 */
.pv-hd{display:flex;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:6px}
.pv-hd-s{font-size:11.5px;color:var(--tx-3);margin-left:8px}
.pv-seg{margin-left:auto;display:inline-flex;background:var(--panel-2);border-radius:9px;padding:3px}
.pv-seg button{border:none;background:none;font-family:inherit;cursor:pointer;font-size:12px;
  font-weight:600;color:var(--tx-3);padding:6px 15px;border-radius:7px;transition:all .14s}
.pv-seg button.on{background:var(--panel);color:var(--tx);box-shadow:0 1px 3px rgba(20,24,35,.10)}
.pv-split{display:grid;grid-template-columns:300px 1fr;gap:34px;align-items:center}
.pv-viz{display:flex;justify-content:center}
.pv-axis{font-size:11px;fill:var(--tx-3)}
.pv-blab{font-size:12.5px;font-weight:600;fill:var(--tx-2)}
.pv-bval{font-size:12.5px;font-weight:800;letter-spacing:-.02em}
.pv-rw{display:flex;align-items:center;gap:11px;width:100%;padding:11px 0 10px;border:none;
  background:none;font-family:inherit;text-align:left;cursor:pointer;transition:opacity .12s}
.pv-rw:hover{opacity:.66}
.pv-rw.off,.pv-rw.off:hover{cursor:default;opacity:1}
.pv-rw i{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.pv-rw .pv-nm{font-size:13px;color:var(--tx-2);flex:1;font-weight:500}
.pv-rw .pv-ct{font-size:11px;color:var(--tx-3)}
.pv-rw .pv-am{font-size:13.5px;font-weight:800;letter-spacing:-.02em;color:var(--tx)}
.pv-cv{width:0;height:0;flex:none;margin-left:4px;border-left:5px solid var(--tx-3);
  border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
.pv-rw.on .pv-cv{transform:rotate(90deg)}
.pv-rw.on .pv-nm{font-weight:700;color:var(--tx)}
.pv-rw.off .pv-nm,.pv-rw.off .pv-am{color:var(--tx-3)}
.pv-rw.off .pv-cv{display:none}
.pv-unit{border-bottom:1px solid var(--line)}
.pv-unit:last-child{border-bottom:none}
.pv-sub{padding:2px 0 14px 21px}
.pv-si{display:flex;align-items:center;gap:10px;padding:6px 0}
.pv-yr{font-size:10.5px;color:var(--tx-3);width:34px;flex:none;font-variant-numeric:tabular-nums}
.pv-si .pv-nm{font-size:12.5px;color:var(--tx-2);flex:1}
.pv-si .pv-am{font-size:12.5px;font-weight:700;color:var(--tx)}
.pv-list{margin-top:18px;padding-top:4px;border-top:1px solid var(--line)}
@media(max-width:760px){ .pv-split{grid-template-columns:1fr;gap:18px} }
.perf-grp{margin-bottom:16px}
.perf-grp:last-child{margin-bottom:0}
.perf-grp-head{display:flex;align-items:baseline;padding-bottom:6px;
  border-bottom:1px solid var(--line);margin-bottom:4px}
.perf-grp-nm{font-size:12.5px;font-weight:700;color:var(--tx);letter-spacing:-.02em}
.perf-grp-sum{font-size:11.5px;font-weight:600;margin-left:auto;color:var(--perf-c1)}
.perf-item{display:flex;align-items:center;gap:9px;padding:5px 0}
.perf-it-dot{width:7px;height:7px;border-radius:2px;flex:none}
.perf-it-nm{font-size:11.5px;color:var(--tx-2);flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.perf-it-amt{font-size:11.5px;font-weight:600;color:var(--tx);flex:none}
.perf-tl{position:relative;padding-top:4px;overflow-x:auto}
.perf-tl-line{position:absolute;left:0;right:0;top:18px;height:2px;background:var(--line)}
.perf-tl-row{display:flex;position:relative;min-width:100%}
.perf-tl-i{text-align:center;flex:1 0 96px}
.perf-tl-dot{width:13px;height:13px;border-radius:50%;background:var(--perf-c1);
  border:3px solid var(--panel);box-shadow:0 0 0 1.5px var(--perf-c1);margin:6px auto 12px}
.perf-tl-nm{font-size:11px;font-weight:600;color:var(--tx-2);line-height:1.3;padding:0 4px}
.perf-tl-dt{font-size:10.5px;color:var(--tx-3);margin-top:3px}
@media(max-width:800px){
  .perf-two{grid-template-columns:1fr;gap:24px}
  .perf-col-r{border-left:none;padding-left:0;
    border-top:1px solid var(--line);padding-top:22px}
  .perf-nums{grid-template-columns:1fr 1fr;gap:18px 0}
  .perf-n:nth-child(3){padding-left:0;border-left:none}
}

/* ── 기업 정보 2단 — 조달현황 · 공지사항 ────────────────────────────
   시안 company-2col-layout-v3 에서 옮겼다. 셸에 .card .pad .hd .tot .lgs
   .nt 가 모두 이미 있어 바깥 껍데기는 .p2- 로 갈랐다. 조달현황 안쪽은
   앞서 쓰던 .psum- 을 그대로 이어 쓴다.
   색은 하드코딩 대신 셸 토큰이다 — 다크 모드를 따라가야 한다
   (시안 #3F4BA8 ≈ --accent). 카드 껍데기·여백·글자 크기는 시안 그대로다.
   두 카드 바닥선은 stretch + .p2pad{flex:1} + .psum-lgs{margin-top:auto}
   로 맞춘다. 범례가 카드 바닥에 붙어 옆 카드와 높이가 같아진다. */
.p2row{display:grid;grid-template-columns:1fr 1fr;gap:14px;
  align-items:stretch;margin:16px 0}
.p2c{display:flex;flex-direction:column;background:var(--panel);
  border:1px solid var(--line);border-radius:10px}
.p2hd{display:flex;align-items:center;gap:8px;padding:18px 22px 0}
.p2hd-t{font-size:13.5px;font-weight:700;color:var(--tx)}
.p2hd-d{font-size:11.5px;color:var(--tx-3)}
.p2hd-a{margin-left:auto;font-size:12px;font-weight:600;
  color:var(--accent);text-decoration:none}
.p2hd-a:hover{text-decoration:underline}
.p2pad{padding:0 22px 20px;flex:1;display:flex;flex-direction:column}

/* 조달현황 — 세로 구성이다: 누적 확보금액 → 차트 → 범례.
   카드 폭이 절반이라 SVG 는 width:100% 만으로 꽉 찬다.
   max-width·max-height 를 걸지 말 것 — 걸면 다시 여백이 남는다 */
.psum-card{--psum-c1:var(--accent);
           --psum-c2:#B3BCE3;
           --psum-c2:color-mix(in srgb, var(--accent) 38%, var(--panel));
           --psum-grid:var(--line)}
/* 요약 카드 — 시안 company-summary-v3. 도넛이 아니라 가로 막대다 */
.psum-tot{display:flex;align-items:baseline;gap:9px}
.psum-tot-v{font-size:30px;font-weight:800;letter-spacing:-.045em;
  line-height:1;color:var(--psum-c1)}
.psum-tot-v .psum-u{font-size:14px;font-weight:600;margin-left:1px}
.psum-tot-l{font-size:11.5px;color:var(--tx-3)}
.psum-ax{font-size:10.5px;fill:var(--tx-3)}
.psum-bl{font-size:11.5px;font-weight:600;fill:var(--tx-2)}
.psum-bv{font-size:11.5px;font-weight:800;letter-spacing:-.02em}

/* 공지 — 섹션을 접는다. 기본은 전부 접힘.
   화살표는 ::before 로 직접 그리므로 브라우저 기본 마커를 반드시 지운다.
   크롬은 ::-webkit-details-marker, 파이어폭스는 list-style, 그 밖은 ::marker */
.p2nt{margin-top:14px}
.p2nt details{border-bottom:1px solid var(--line)}
.p2nt details:last-of-type{border-bottom:none}
.p2nt summary{list-style:none;cursor:pointer;padding:12px 0;display:flex;
  align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--tx-2)}
.p2nt summary::-webkit-details-marker{display:none}
.p2nt summary::marker{content:''}
.p2nt summary:hover{color:var(--tx)}
.p2nt summary::before{content:'';width:0;height:0;flex:none;
  border-left:5px solid var(--tx-3);border-top:4px solid transparent;
  border-bottom:4px solid transparent;transition:transform .15s}
.p2nt details[open] summary::before{transform:rotate(90deg)}
.p2nt details[open] summary{color:var(--accent)}
.p2nt-b{padding:0 0 12px 13px}
.p2l1{list-style:none}
.p2l1>li{font-size:12px;color:var(--tx-2);padding:3px 0 3px 13px;position:relative}
.p2l1>li::before{content:'';position:absolute;left:0;top:11px;
  width:4px;height:4px;border-radius:50%;background:var(--tx-3)}
.p2l2{list-style:none;padding-left:13px;margin-top:2px}
.p2l2>li{font-size:11.5px;color:var(--tx-3);padding:2px 0 2px 12px;
  position:relative;line-height:1.55}
.p2l2>li::before{content:'';position:absolute;left:0;top:10px;
  width:5px;height:1px;background:var(--line-2)}

@media(max-width:860px){ .p2row{grid-template-columns:1fr} }
/* 인쇄는 한 단으로 편다. 인쇄용 화면은 공지를 접지 않고 전문을 쓴다 */
@media print{ .p2row{grid-template-columns:1fr} }
</style>
</head>

<script>
/* ══════════════════════════════════════════════════════════════════
   데이터는 전부 build_client.py 가 만든 c/{슬러그}.enc 에서 온다.
   하드코딩된 값은 없다. 화면에 쓰이는 표현(단계 라벨·구분명)만 여기 남는다.

   file:// 로 열면 CORS 때문에 fetch 가 막힌다. 레포 루트에서
     python -m http.server 8000 --bind 127.0.0.1
   으로 띄운 뒤 http://localhost:8000/{슬러그}/ 로 열 것.
   --bind 를 빼면 0.0.0.0 이라 이 디렉터리가 같은 네트워크에 통째로 열린다.

   슬러그는 두 경로로 들어온다.
     경로형  /{슬러그}/  → 빌드가 만든 사본에 window.__SLUG__ 가 주입돼 있다
     쿼리형  /?c={슬러그} → 하위호환
   둘 다 없으면 특정 클라이언트로 기본값을 두지 않는다. 루트를 연 사람에게
   거래처 이름이 새면 안 되기 때문이다.
   ══════════════════════════════════════════════════════════════════ */

const Q = new URLSearchParams(location.search);
const BASE = (typeof window.__BASE__ === 'string') ? window.__BASE__ : '';
/* 슬러그는 파일 경로에 들어가므로 허용 문자만 남긴다 */
const clean = s => String(s || '').replace(/[^A-Za-z0-9_-]/g, '');
const CLIENT = clean(window.__SLUG__) || clean(Q.get('c') || Q.get('client')) || null;
/* 아래 슬러그는 가짜 데이터로 만든 공개 데모라 암호화하지 않는다. 확장자만 갈린다.
   봉투가 enc:false 라 아래 boot() 에서 비밀번호 게이트를 그냥 지나간다.
   그 밖의 슬러그는 지금까지처럼 .enc + 게이트다.
   샘플을 늘리면 여기에 슬러그를 더한다 — 빠뜨리면 게이트가 뜨고 .enc 를 찾는다. */
const SAMPLES = ['sample', 'game', 'it'];
const SAMPLE = SAMPLES.includes(CLIENT);
const SRC  = CLIENT ? `${BASE}c/${CLIENT}${SAMPLE ? '.json' : '.enc'}` : null;
const SKEY = CLIENT ? `gh:client:${CLIENT}` : null;

/* 담당자가 공지를 고칠 때만 부르는 중계 서버. 노션 열쇠는 저쪽에만 있다.
   여기 주소가 새어도 담당자 비밀번호 없이는 아무것도 못 한다. */
const RELAY = 'https://growthhigh-clientpage-relay.growthhigh-clientpage-worker.workers.dev';
/* 담당자 비밀번호를 담아 두는 자리. 클라이언트 비밀번호(SKEY)와 다른 값이고,
   탭을 닫으면 사라진다. localStorage 에 두지 않는다 — 공용 PC 에 남는다 */
const EKEY = CLIENT ? `gh:editor:${CLIENT}` : null;
/* 편집 스위치는 ?edit 를 달고 들어온 사람에게만 보인다.
   클라이언트에게는 편집이라는 것이 있다는 사실조차 보이지 않아야 한다 —
   비밀번호로 막혀 있어도, 버튼이 보이면 눌러 보게 되고 물어보게 된다.
   담당자는 이 주소를 즐겨찾기에 둔다: /{슬러그}/?edit */
const EDITQ = Q.has('edit');

/* ── 표현 계층 상수 (JSON 의 stage 인덱스로 참조) ── */
const LABELS = {
  fund:['검토','서류','작성','평가','결과'],
  cert:['진단','서류','접수','심사','취득'],
  proj:['착수','분석','작성','검토','완료'],
};
/* fund 에는 (런웨이)정책자금도 들어온다. 사이드바·본문 제목·breadcrumb 이 모두 이 값을 쓴다 */
const CATNM = { fund:'정부지원사업·정책자금', cert:'기업인증·지식재산권', proj:'경영자문 프로젝트' };
const BADGE = { run:'진행', ok:'종료', no:'보류', wait:'예정' };
const GL = { info:'▣', perf:'▦', notice:'▤', fund:'◈', cert:'✦', proj:'◇', talk:'✉', open:'◎' };

/* 사이드바·헤더 마크는 복호화한 뒤에야 기업 로고로 채운다 (init 참고).
   잠금 화면(루트·404 안내 포함)은 그로스하이 로고만 쓴다. */
const BRAND_LOGO = `${BASE}assets/growthhigh-logo.png`;

/* 파비콘은 <head> 에 절대 주소로 박아 둔다 — 여기서 손대지 않는다.
   경로를 스크립트로 고치면 JS 를 실행하지 않는 미리보기 크롤러에서 깨진다 */

/* 노션 텍스트가 그대로 들어오므로 <, & 등을 이스케이프한다 */
const esc = v => String(v ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const pad2 = n => String(n).padStart(2,'0');
const TODAY = (d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`)(new Date());

/* 날짜 표기: 빈 값은 —, 9999-12-31/상시는 상시 */
const fmt = d => {
  if(!d) return '—';
  if(d === '상시' || d === '9999-12-31') return '상시';
  return /^\d{4}-\d{2}-\d{2}$/.test(d) ? d.slice(2).replace(/-/g,'.') : esc(d);
};

/* ── 부팅 · 비밀번호 게이트 ──
   .enc 는 AES-GCM 봉투다. 비밀번호를 URL·로그·localStorage 어디에도 남기지 않는다.
   복호화된 JSON 은 sessionStorage 에만 둔다 — 탭을 닫으면 사라진다. */
const $ = id => document.getElementById(id);
$('mk-g').innerHTML = `<img src="${encodeURI(BRAND_LOGO)}" alt="그로스하이">`;
/* 상단 바·사이드바 하단 제공자 마크. 잠금 화면에서도 그대로 보인다.
   alt 를 비워 둔다 — 바로 옆에 GROWTH'HIGH 글자가 있어 읽으면 두 번 읽힌다 */
for (const id of ['gh-top', 'gh-side']) {
  const el = $(id);
  if (el) el.innerHTML = `<img src="${encodeURI(BRAND_LOGO)}" alt="">`;
}

const b64bytes = b64 => Uint8Array.from(atob(b64), ch => ch.charCodeAt(0));

async function decryptEnvelope(env, password){
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:b64bytes(env.salt),
      iterations:env.iterations || 200000, hash:'SHA-256' },
    await crypto.subtle.importKey('raw', new TextEncoder().encode(password),
      'PBKDF2', false, ['deriveKey']),
    { name:'AES-GCM', length:256 }, false, ['decrypt']);
  /* 비밀번호가 틀리면 GCM 인증 태그 검증에서 예외가 난다 */
  const plain = await crypto.subtle.decrypt(
    { name:'AES-GCM', iv:b64bytes(env.iv) }, key, b64bytes(env.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

/* 폼을 감추고 안내 문구만 남긴다. 제목도 함께 바꿀 수 있다 */
function fatal(html, heading){
  $('gform').style.display = 'none';
  $('gmsg').style.display = 'none';
  if(heading) document.querySelector('.gt h1').textContent = heading;
  document.querySelector('.gt .sub').innerHTML = html;
}
function setBusy(on, msg){
  $('gbtn').disabled = on;
  $('pw').disabled = on;
  $('gmsg').textContent = msg;
  $('gmsg').classList.toggle('busy', on);
}
function unlock(data){
  document.body.classList.remove('locked');
  init(data);
}

let ENV = null;

(async function boot(){
  /* 슬러그가 없으면 어떤 클라이언트도 지목하지 않는다.
     여기서 기본값을 두면 루트를 연 사람에게 거래처 이름이 새어 나간다 */
  if(!CLIENT){
    return fatal('담당 컨설턴트에게 전달받은<br>링크로 접속해 주세요.',
                 '클라이언트 전용 페이지입니다');
  }

  if(!(window.crypto && crypto.subtle)){
    return fatal('이 브라우저에서는 열 수 없습니다.<br>' +
      (location.protocol === 'http:' && location.hostname !== 'localhost'
        ? 'https 주소로 접속해 주세요.' : '최신 브라우저로 다시 시도해 주세요.'));
  }

  let res;
  try { res = await fetch(SRC, {cache:'no-store'}); }
  catch(e){
    return fatal(location.protocol === 'file:'
      ? '파일을 직접 열면 데이터를 읽을 수 없습니다.<br>' +
        '<code>python -m http.server 8000</code> 로 띄운 뒤 접속해 주세요.'
      : '데이터를 불러오지 못했습니다.');
  }
  /* 있는지 없는지를 알려주지 않는 중립 문구 */
  if(!res.ok) return fatal('주소를 다시 확인해 주세요.', '페이지를 찾을 수 없습니다');

  try { ENV = await res.json(); }
  catch(e){ return fatal('데이터 형식이 올바르지 않습니다.'); }

  if(ENV.enc === false) return unlock(ENV.data);   /* 비밀번호 미설정 — 개발용 평문 */

  const cached = sessionStorage.getItem(SKEY);
  if(cached){
    try { return unlock(JSON.parse(cached)); }
    catch(e){ sessionStorage.removeItem(SKEY); }
  }
  $('pw').focus();
})();

$('gform').addEventListener('submit', async e => {
  e.preventDefault();                        /* 비밀번호가 쿼리스트링으로 새지 않게 한다 */
  const pw = $('pw').value;
  if(!pw || !ENV) return;

  setBusy(true, '확인 중…');                  /* PBKDF2 20만회는 기기에 따라 1~2초 */
  await new Promise(r => setTimeout(r, 30));  /* 로딩 표시가 그려질 틈을 준다 */
  try {
    const data = await decryptEnvelope(ENV, pw);
    try { sessionStorage.setItem(SKEY, JSON.stringify(data)); } catch(_){}
    setBusy(false, '');
    $('pw').value = '';
    unlock(data);
  } catch(err){
    setBusy(false, '비밀번호가 올바르지 않습니다.');
    $('pw').select();
  }
});

/* ── 렌더 ── */
function init(D){
  const CO = D.company || {};
  const rows = Array.isArray(D.progress) ? D.progress : [];
  /* 샘플 전용 — 노션 「인증 유효기간」 자리에 들어갈 값을 손으로 넣는다.
     여기서 데이터에 한 번 채우고 나면 그리는 길은 루트와 똑같다.
     기업부설연구소는 유효기간이 없는 인증이라 넣지 않는다 → 「기한 없음」 */
  const CERT_VALID = {
    '벤처기업인증(갱신)': ['2026-01-28', '2029-01-27'],
    '이노비즈':          ['2025-06-04', '2028-06-03'],
    '메인비즈':          ['2025-05-15', '2028-05-14'],
  };
  rows.forEach(r => {
    if(r.cat === 'cert' && !r.valid)
      r.valid = CERT_VALID[String(r.title||'').trim()] || null;
  });
  const events = Array.isArray(D.events) ? D.events : [];
  const recommend = Array.isArray(D.recommend) ? D.recommend : [];
  /* 공백뿐인 본문은 없는 것으로 본다 — 아래 검사가 모두 이 값을 쓴다.
     body 는 평문(메일), body_html 은 회의록 HTML(미팅·통화)이다. */
  const talks = (Array.isArray(D.talks) ? D.talks : [])
    .map(t => ({ ...t,
      body: (t.body || '').trim() || null,
      body_html: (t.body_html || '').trim() || null,
      preview: (t.preview || '').trim() || null }))
    /* major 는 노션 「주요」 체크다. 옛 산출물에는 이 칸이 없으므로 없으면 거짓이다 */
    .map(t => ({ ...t, hasBody: !!(t.body || t.body_html), major: t.major === true }));

  /* ── 기업인증·지식재산권 ────────────────────────────────────────

  const CERT_LIB = {

      facts: [['인증 유형','혁신성장유형'],

    },

  /* 인증명 표기가 갈린다 — 「이노비즈」·「이노비즈인증」, 「벤처기업인증」·

     지우고 부분일치로 묶는다. 먼저 걸리는 것이 이긴다 */
  const CERT_KEY = [['기업부설연구소','기업부설연구소'],
                    ['벤처기업인증','벤처기업확인'], ['벤처기업확인','벤처기업확인'],

  function certLib(title){
    const t = String(title||'').replace(/\s+/g,'');
    const hit = CERT_KEY.find(([pat])=>t.includes(pat));
    return hit ? CERT_LIB[hit[1]] : null;
  }

  /* 상태와 잔여 기간은 「인증 유효기간」 종료일과 오늘로 그때그때 센다.
     하드코딩하면 날짜가 지나도 「유효」로 남아 갱신을 놓치는 화면이 된다. */
  const DAY = 86400000;
  const dleft = end => Math.round((Date.parse(end) - Date.parse(TODAY)) / DAY);
  const SOON = 60;                                   /* 이 안에 들면 갱신 알림 */
  /* 취득한 인증만 유효 상태를 따진다. 진행 중·보류 건은 진행 상태를 그대로
     둔다 — 아직 받지도 않은 인증을 「기한 없음」이라 부를 수는 없다 */
  /* 선정되지 않은 건은 인증이 아니다. 프로젝트 상태가 완료여도 최신로그에

     조달현황도 이 규칙으로 거른다 — 한쪽만 고치지 말 것 */
  const DROP_LOG = /미선정|탈락|미신청/;

    if(r.badge !== 'ok') return tag(r);
    if(DROP_LOG.test(r.log_text || '')) return `<span class="tag g-no">미선정</span>`;
    const end = (r.valid || [])[1] || '';
    if(!end) return `<span class="tag g-none">기한 없음</span>`;
    const d = dleft(end);
    if(d < 0)     return `<span class="tag g-no">만료</span>`;
    if(d <= SOON) return `<span class="tag g-run">갱신 D-${d}</span>`;
    return          `<span class="tag g-ok">유효</span>`;
  }
  /* 「잔여 2년 5개월」. 달 수로 세고 날짜가 모자라면 한 달 뺀다 —
     8/14 에서 6/3 까지는 아직 한 달이 덜 찼다 */
  function certRemain(end){
    const t = new Date(TODAY), e = new Date(end);
    if(isNaN(e)) return '';
    let m = (e.getFullYear()-t.getFullYear())*12 + (e.getMonth()-t.getMonth());
    if(e.getDate() < t.getDate()) m--;
    if(m < 0)   return '';
    if(m === 0) return `잔여 ${Math.max(dleft(end),0)}일`;
    const y = Math.floor(m/12), mo = m%12;
    return '잔여 ' + (y ? `${y}년${mo?` ${mo}개월`:''}` : `${mo}개월`);
  }
  const ymd = d => String(d||'').replace(/-/g,'.');

  function certTable(){
    const list = rows.filter(r=>r.cat==='cert');
    if(!list.length) return emptyBox('등록된 내용이 없습니다.');
    return `<div class="card"><div class="ct-tbl">
      <div class="ct-cols ct-hd">
       <span>인증·권리</span><span>단계</span><span>상태</span>
       <span>진행 기간</span><span>유효기간</span></div>
      ${list.map(r=>{
        /* 유효기간은 취득한 건에만 쓴다. 진행 중인 건의 유효기간은
           아직 존재하지 않는 값이다 */
        const v = r.badge === 'ok' ? (r.valid || null) : null;
        const end = (v || [])[1] || '';
        const rem = end ? certRemain(end) : '';
        const lib = certLib(r.title);
        /* 펼칠 것이 없으면 <details> 를 쓰지 않는다. 눌러도 아무것도 안
           나오는 화살표는 고장으로 읽힌다 */
        /* 기업별 값은 데이터에서, 공통 정보와 혜택은 라이브러리에서 온다.
           셋 다 없으면 <details> 를 쓰지 않는다 */
        const info = Array.isArray(r.info) ? r.info : [];
        const has = !!(info.length || (lib && ((lib.facts||[]).length || (lib.ben||[]).length)));
        const head = `<div class="ct-cols">
          <div><div class="ct-nm">${esc(r.title)}${r.joint?'<span class="co">공동</span>':''}</div>
            ${logLine(r).replace('class="t-sub"','class="ct-sub"')}</div>
          <div>${steps(r)}</div>
          <div>${certTag(r)}</div>
          <div class="ct-per">${fmt(r.start)} – ${fmt(r.end)}</div>
          <div class="ct-val">${v && (v[0] || end)
              ? `${ymd(v[0]) || '―'} ~ ${ymd(end) || '―'}` : '―'}
            ${rem ? `<span class="ct-rem">${esc(rem)}</span>` : ''}</div>
        </div>`;
        if(!has) return `<div class="ct-row">${head}</div>`;
        return `<details>
        <summary>${head}</summary>
        <div class="ct-body"><div class="ct-g2">
          <div>${info.map(x=>`<div class="ct-f">
            <span class="ct-k">${esc(x.k)}</span><span class="ct-v">${esc(x.v)}</span></div>`).join('')
          }${((lib && lib.facts) || []).map(([k,val])=>`<div class="ct-f">
            <span class="ct-k">${esc(k)}</span><span class="ct-v">${val}</span></div>`).join('')}</div>
          ${(lib && (lib.ben||[]).length) ? `<div class="ct-ben">
            <div class="ct-ben-t">${esc(lib.ben_t||'')}</div>
            <ul>${lib.ben.map(b=>`<li>${b}</li>`).join('')}</ul>
            ${lib.note?`<div class="ct-note">${esc(lib.note)}</div>`:''}
          </div>` : ''}
        </div></div>
       </details>`;
      }).join('')}
    </div></div>`;
  }

  function table(cat){
    const list = rows.filter(r=>r.cat===cat);
    if(!list.length) return emptyBox('등록된 내용이 없습니다.');
    return `<div class="card"><table><thead><tr>
      <th style="width:38%">${cat==='cert'?'인증·권리':'사업명'}</th>
      <th style="width:18%">단계</th><th style="width:10%">상태</th>
      <th style="width:13%">기간</th>
      <th class="num" style="width:21%">지원내용</th></tr></thead>
    <tbody>${list.map(r=>`<tr>
      <td class="lead"><div class="t-nm">${esc(r.title)}${r.joint?'<span class="co">공동</span>':''}</div>
          ${logLine(r)}</td>
      <td>${steps(r)}</td><td>${tag(r)}</td>
      <td class="dtc">${fmt(r.start)} – ${fmt(r.end)}</td>
      <td class="num sup">${support(r)}</td></tr>`).join('')}
    </tbody></table></div>`;
  }

  /* 공지 — notice 가 null 이면 빈 상태로 레이아웃 유지.
     item.html 은 build_client.py 가 이스케이프해서 만든 HTML 이므로 그대로 넣는다. */
  /* 공지 속 그림은 빌드가 레포에 저장한 상대경로다. /{슬러그}/ 에서는 한 단계
     위가 기준이라 로고와 같이 BASE 를 붙인다 */
  const noticeHtml = h => String(h || '').replace(/\bsrc="assets\//g, `src="${BASE}assets/`);
  /* 표·그림·코드·구분선·첨부는 글줄이 아니라 내용 자체다. 깊이 제한은 체크리스트를
     읽기 좋게 접으려는 것이므로 이런 블록은 제한과 무관하게 끝까지 그린다 */
  /* edit 가 참일 때만 항목 자기 글을 .nx 로 감싸고 주소를 붙인다.
     평소에는 지금까지와 완전히 같은 DOM 이라 클라이언트 화면은 달라지지 않는다.
     .nx 로 감싸는 이유는 한 줄을 고칠 때 하위 항목까지 지우지 않기 위해서다 */
  /* 항목의 종류 → 줄 앞에 그릴 표시 */
  const KIND_CLS = { bullet:'plain', number:'ord', paragraph:'para',
                     quote:'qt', toggle:'tg0',
                     heading1:'hd1', heading2:'hd2', heading3:'hd3',
                     code:'cd', table:'tbl', cell:'cel' };

  /** 표 한 줄에 놓을 수 있는 칸의 수. 중계 서버의 MAX_COLS 와 같아야 한다 */
  const MAX_COLS = 8;

  /**
   * 표 한 덩어리.
   *
   * 문서에는 **칸이 한 줄로 늘어서 있고** 몇 칸마다 줄을 바꾸는지가 `cols` 다.
   * 행을 따로 두지 않는 것은 행이 아무것도 지니지 않기 때문이다 — 여기서
   * `cols` 개씩 끊어 `<tr>` 로 묶는다.
   */
  function noticeTable(it, edit, mark){
    const cells = it.children || [];
    const cols = Math.max(1, Math.min(MAX_COLS, it.cols || cells.length || 1));
    let rows = '';
    for(let at = 0; at < cells.length; at += cols){
      rows += '<tr>' + cells.slice(at, at + cols).map(c => {
        const body = noticeHtml(c.html);
        return edit && c.id
          ? `<td data-nid="${esc(c.id)}"><span class="nx">${body}</span></td>`
          : `<td>${body}</td>`;
      }).join('') + '</tr>';
    }
    /* 넓은 표는 제 안에서 가로로 흐른다. 본문이 가로로 밀리지 않게 한다 */
    return `<li class="tbl"${mark}>${edit ? '<span class="nx" hidden></span>' : ''}
      <div class="ntbw"><table class="ntb"><tbody>${rows}</tbody></table></div>${
      edit ? `<div class="ntbc">
        <button data-tb="row+" title="아래에 행 하나">＋ 행</button>
        <button data-tb="col+" title="오른쪽에 열 하나">＋ 열</button>
        <button data-tb="row-" title="마지막 행 지우기">− 행</button>
        <button data-tb="col-" title="마지막 열 지우기">− 열</button></div>` : ''}</li>`;
  }

  function noticeItem(it, depth, edit){
    const c = it.checked;
    /* 종류는 저장소에서 온 봉투에만 실린다. 노션에서 읽은 봉투에는 없어,
       그때는 지금까지처럼 할 일과 그 밖 둘로만 그린다 — 노션 경로를 걷는
       #39 가 이 갈래도 함께 지운다 */
    const cls = it.type === 'todo' ? (c === true ? 'chk on' : 'chk')
      : it.type ? (KIND_CLS[it.type] || 'plain')
      : c === true ? 'chk on' : c === false ? 'chk' : 'plain';
    /* 적은 만큼 다 낸다. depth 상한은 깊이를 제한하려는 것이 아니라 봉투가
       망가져 순환이 생겼을 때 멈추는 자리다 — 저장 쪽 상한과 같은 값이다 */
    const kids = depth < 50 ? (it.children || []) : [];
    const sub = kids.length
      ? `<ul>${kids.map(k=>noticeItem(k, depth+1, edit)).join('')}</ul>` : '';

    const body = noticeHtml(it.html);
    let mark = '', text = body;
    /* 주소와 종류만 싣는다. 편집 모드는 봉투로 그린 이 화면을 고치지 않는다 —
       저장소의 공지 문서를 받아 화면을 다시 그린 뒤에야 고칠 수 있게 된다 */
    if(edit && it.id){
      mark = ` data-nid="${esc(it.id)}"`;
      text = `<span class="nx">${body}</span>`;
    }

    /* 표는 글줄이 아니라 격자다. 안에 든 줄도 두지 않는다 */
    if(it.type === 'table') return noticeTable(it, edit, mark);
    /* 코드는 서식 없는 글 한 덩어리다. 줄바꿈과 공백이 그대로 보여야 한다 */
    if(it.type === 'code'){
      return `<li class="cd"${mark}><span class="${edit && it.id ? 'nx' : 'cdb'}"
        >${body}</span></li>`;
    }

    /* 노션에서 접어 둔 항목은 접힌 채로 시작한다 — 접어 둔 의도를 따른다 */
    if(it.toggle && sub){
      return `<li class="tg"${mark}><span class="tgh"><i class="tw">▸</i>
        ${edit && it.id ? text : `<span>${body}</span>`}</span>${sub}</li>`;
    }
    return `<li class="${cls}"${mark}>${text}${sub}</li>`;
  }
  /* edit 는 부르는 쪽이 정한다. `ED.on()` 을 여기서 보면 인쇄 화면까지
     편집용 DOM 이 되어, 담당자가 뽑은 종이에 편집 흔적이 섞여 나간다 */
  function noticeFeed(edit){
    const sections = (notice && Array.isArray(notice.sections)) ? notice.sections : [];

    /* 갓 만든 공지가 여기다. 칸이 하나도 없어도 편집 모드에서는 빈 칸 하나를
       세워 준다 — 안 그러면 「＋ 새 공지」로 만들어 놓고 첫 줄을 적을 곳도,
       칸에 이름을 붙일 곳도 없다. 클라이언트에게는 지금까지와 같은 빈 상자다 */
    const boxes = sections.length ? sections
      : edit ? [{id: '', heading: null, items: []}] : [];

    if(!boxes.length){
      return `<div class="notice open"><div class="bd" style="padding-top:13px">
        <p class="empty">등록된 내용이 없습니다.</p></div></div>`;
    }

    /* 기본은 첫 칸만 열어 둔다. 분량이 많아 다 펼치면 한눈에 안 들어온다.
       클라이언트 화면에서 제목 없는 칸은 늘 열어 둔다 — 접으면 다시 펼
       손잡이가 없어 그 줄들이 통째로 사라진다. 편집 모드에는 제목이 비어도
       손잡이가 있으므로(이름을 붙일 자리라 늘 그린다) 그 예외가 필요 없다 */
    /* **편집 모드에서는 칸이 접히지 않는다.** 접는 것은 읽는 사람을 위한
       것이지 고치는 사람을 위한 것이 아니다 — 고치는 동안에는 다 보여야
       하고, 접힌 칸에 커서를 두면 보이지 않는 곳에서 글이 써진다 */
    const opened = (s,si) => edit || si===0 || !(s.heading_html || s.heading);

    return boxes.map((s,si)=>`
      <div class="notice${opened(s,si)?' open':''}"${
        edit ? ` data-nsec="${esc(s.id || '')}"` : ''}>${secHead(s, edit)}<div class="bd">
       ${(s.items||[]).length
         ? `<ul class="ck">${s.items.map(i=>noticeItem(i,1,edit)).join('')}</ul>`
         /* 편집 모드에서 빈 칸은 「등록된 내용이 없습니다」가 아니라 빈 목록이다.
            곧 빈 줄 하나가 세워지고 커서가 그리로 간다 */
         : edit ? `<ul class="ck"></ul>`
         : `<p class="empty">등록된 내용이 없습니다.</p>`}
       ${edit ? `<div class="ntail" data-ntail></div>` : ''}
      </div></div>`).join('')
      + (edit ? `<div class="nsadd"><button class="nadd-b" data-nsadd>＋ 새 섹션</button></div>`
              + saveBar() : '');
  }

  /**
   * 칸의 머리말.
   *
   * 편집 모드에서는 **제목이 비어 있어도 그린다.** 이름을 붙일 자리가
   * 거기뿐이기 때문이다 — 클라이언트 화면에서는 지금까지처럼 이름 없는 칸에
   * 머리말을 두지 않는다.
   */
  function secHead(s, edit){
    const has = !!(s.heading_html || s.heading);
    if(!edit && !has) return '';
    const body = has ? (s.heading_html ? noticeHtml(s.heading_html) : esc(s.heading)) : '';
    if(!edit) return `<h3><i class="tw">▸</i><span>${body}</span></h3>`;
    /* 접기 손잡이(▸)를 그리지 않는다. 편집 모드에서는 접을 일이 없다 */
    return `<h3><span class="nsx" data-nsx>${body}</span>
      <span class="ns-mv">
        <button data-nsmv="up" title="칸을 위로">↑</button>
        <button data-nsmv="down" title="칸을 아래로">↓</button>
        <button data-nsdel title="이 칸 지우기">✕</button>
      </span></h3>`;
  }

  /* 저장 창구. 고친 줄이 몇인지, 무엇이 나갔는지가 여기 한 곳에만 뜬다 */
  function saveBar(){
    return `<div class="ed-bar" id="edbar">
      <button class="save" data-edsave disabled>저장</button>
      <button data-edundo disabled>되돌리기</button>
      <button data-edrev>지난 판</button>
      <span class="cnt" data-edcnt>공지를 불러오는 중…</span>
      <span class="msg" data-edmsg></span></div>` + edGuide();
  }

  /**
   * 손놀림 안내. 저장 창구 밑에 접어 둔다.
   *
   * **클라이언트에게는 이 화면이 보이지 않는다.** 편집 모드에서만 그려지므로
   * 여기에 무엇을 적어도 클라이언트가 보는 것은 달라지지 않는다 — 담당자가
   * 쓰다 막혔을 때 찾아갈 곳이 화면 안에 있어야 한다.
   */
  function edGuide(){
    const rows = [
      ['글 쓰기', [
        ['Enter', '줄 나누기 · 줄 끝이면 새 줄'],
        ['Shift + Enter', '줄 안에서 줄바꿈'],
        ['Backspace', '줄 처음에서 — 종류 벗기 → 내어쓰기 → 윗줄과 합치기'],
        ['Ctrl + Z', '한 걸음 되돌리기'],
        ['Ctrl + Shift + Z', '다시 앞으로'],
        ['Ctrl + D', '이 줄 하나 더'],
      ]],
      ['줄 종류 — 줄 앞에서 치기', [
