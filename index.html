<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>클라이언트 페이지 · 그로스하이</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--sans:'Pretendard',-apple-system,system-ui,sans-serif;--r:6px;--accent:#5E6AD2;
  --run:#D9A441;--run-bg:rgba(217,164,65,.14);--ok:#4CAF7D;--ok-bg:rgba(76,175,125,.14);
  --no:#C0645F;--no-bg:rgba(192,100,95,.14)}
[data-theme="dark"]{--bg:#1A1A1E;--panel:#212127;--panel-2:#26262D;--hover:#2C2C34;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);
  --tx:#E4E4E8;--tx-2:#9A9AA6;--tx-3:#6E6E7C}
/* 라이트는 다크의 반전이 아니라 별도 팔레트다. 패널을 흰색으로 두고 테두리로 구분한다 */
[data-theme="light"]{--bg:#FFFFFF;--panel:#FFFFFF;--panel-2:#F4F5F7;--hover:#F0F1F4;
  --line:#E3E5EA;--line-2:#C9CDD5;--tx:#16181D;--tx-2:#4A4F5A;--tx-3:#8A909C;
  --accent:#3D4BA8;
  --run:#8F5F0D;--run-bg:#FDF3E0;--ok:#1F7A52;--ok-bg:#E6F4EC;
  --no:#A34B45;--no-bg:#FBEAE8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);font-size:13px;
  line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:1px;border-radius:3px}

aside{width:238px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;height:100vh}
.ws{padding:13px 12px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center}
.ws .mk{width:28px;height:28px;border-radius:7px;flex:none;background:#123027;
  display:grid;place-items:center;overflow:hidden}
/* 로고 — 이미지는 투명 배경이 많아 마크 배경을 중립으로 바꾼다 */
.ws .mk.img,.hero .mk.img{background:var(--panel-2);border:1px solid var(--line)}
.mk .lg{width:100%;height:100%;object-fit:contain;border-radius:inherit;display:block}
.mk .lg-e{line-height:1}
.mk .lg-t{line-height:1;color:#5DCAA5;font-weight:700;letter-spacing:-.02em}
.ws .nm{font-size:13px;font-weight:600;letter-spacing:-.015em;line-height:1.25;display:block}
.ws .sb{font-size:10.5px;color:var(--tx-3)}
nav{flex:1;overflow-y:auto;padding:9px 8px}
.grp{margin-bottom:13px}
.grp h3{font-size:10px;font-weight:500;color:var(--tx-3);letter-spacing:.06em;
  padding:0 8px;margin-bottom:4px;text-transform:uppercase}
.nv{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:var(--r);
  font-size:13px;color:var(--tx-2);text-align:left;line-height:1.4}
.nv:hover{background:var(--hover);color:var(--tx)}
.nv.on{background:var(--panel-2);color:var(--tx);font-weight:500}
[data-theme="light"] .nv.on{background:var(--hover)}
.nv .g{width:13px;flex:none;opacity:.7;font-size:12px;text-align:center}
.nv .ct{margin-left:auto;font-size:11px;color:var(--tx-3);font-variant-numeric:tabular-nums}
.nv .ex{margin-left:auto;font-size:10px;color:var(--tx-3)}

main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh}
.top{height:48px;flex:none;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:10px;padding:0 16px}
.crumb{font-size:13px;font-weight:600;letter-spacing:-.01em}
.crumb i{font-style:normal;color:var(--tx-3);font-weight:400;margin:0 7px}
.top .rt{margin-left:auto;display:flex;align-items:center;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--tx-2);
  padding:3px 10px;border-radius:99px;background:var(--panel-2);
  border:1px solid var(--line);white-space:nowrap}
.pill b{font-weight:500;color:var(--tx)}
.tgl{width:28px;height:28px;border-radius:var(--r);display:grid;place-items:center;
  color:var(--tx-2);font-size:14px}
.tgl:hover{background:var(--hover);color:var(--tx)}
.scroll{flex:1;overflow-y:auto}
.view{padding:26px 24px 90px;max-width:1010px}
.vh{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.vh h1{font-size:19px;font-weight:600;letter-spacing:-.025em}
.vh .n{font-size:12px;color:var(--tx-3);font-variant-numeric:tabular-nums}

.hero{border:1px solid var(--line);border-radius:10px;background:var(--panel);
  padding:20px 22px;margin-bottom:16px;display:flex;gap:16px;align-items:flex-start}
.hero .mk{width:52px;height:52px;border-radius:12px;flex:none;background:#123027;
  display:grid;place-items:center}
.hero h2{font-size:21px;font-weight:600;letter-spacing:-.03em;line-height:1.25}
.hero .biz{font-size:13px;color:var(--tx-2);margin-top:5px;line-height:1.55;max-width:52ch}
.hero .tags{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.mini{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--panel-2);color:var(--tx-2)}
[data-theme="light"] .mini{background:var(--hover)}

.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:9px;margin-bottom:16px}
.k1{border:1px solid var(--line-2);border-radius:10px;padding:13px 15px;background:var(--panel)}
.k1 .k{font-size:11.5px;color:var(--tx-2)}
.k1 .v{font-size:26px;font-weight:600;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.k1 .v small{font-size:12px;font-weight:400;color:var(--tx-2);margin-left:2px}
.k1 .s{font-size:11px;color:var(--tx-3);margin-top:2px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.card>.ch{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.card>.ch h2{font-size:12.5px;font-weight:600;letter-spacing:-.01em}
.card>.ch .d{font-size:11.5px;color:var(--tx-3);font-variant-numeric:tabular-nums}
.card>.ch .more{margin-left:auto;font-size:11.5px;color:var(--tx-3)}
.card>.cb{padding:15px}

.notice{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:11px}
.notice>h3{font-size:13px;font-weight:600;padding:12px 15px 10px;letter-spacing:-.01em}
.notice>.bd{padding:0 15px 13px}
.ck{list-style:none}
.ck>li{padding:3px 0 3px 22px;position:relative;font-size:13px;line-height:1.65}
.ck>li>b{font-weight:600}
/* 체크박스(to_do) / 일반 불릿(checked:null) 을 클래스로 구분한다 */
.ck li.chk::before{content:'';position:absolute;left:0;top:6px;width:13px;height:13px;
  border-radius:3.5px;border:1.4px solid var(--line-2)}
.ck li.chk.on::before{background:var(--ok);border-color:var(--ok)}
.ck li.chk.on::after{content:'✓';position:absolute;left:2.4px;top:3.2px;
  font-size:9.5px;color:#0E2A1D;font-weight:700}
/* 라이트의 --ok 는 진한 초록이라 어두운 체크가 묻힌다 */
[data-theme="light"] .ck li.chk.on::after{color:#FFFFFF}
.ck li.plain::before{content:'';position:absolute;left:4px;top:11px;width:4px;height:4px;
  border-radius:50%;background:var(--tx-3)}
.ck ul{list-style:none;margin:2px 0 4px}
.ck ul li{padding:2px 0 2px 18px;position:relative;font-size:12.5px;color:var(--tx-2);line-height:1.6}
.ck ul li.chk::before{width:11px;height:11px;border-radius:3px;top:5px}
.ck ul li.chk.on::after{left:2px;top:2.6px;font-size:8.5px}
.ck ul li.plain::before{left:5px;top:10px;width:3px;height:3px}
.ck s{opacity:.72}
.ck code{background:var(--panel-2);border-radius:3px;padding:1px 5px;font-size:11.5px;color:var(--tx)}
[data-theme="light"] .ck code{background:var(--hover)}
.empty{font-size:12.5px;color:var(--tx-3);padding:2px 0}

.cal-w{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:20px}
.cal h4{font-size:11.5px;font-weight:600;margin-bottom:7px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cal-g span{height:25px;display:grid;place-items:center;font-size:11px;color:var(--tx-2);
  position:relative;border-radius:5px;font-variant-numeric:tabular-nums}
.cal-g span.wk{height:17px;font-size:9.5px;color:var(--tx-3)}
.cal-g span.dim{opacity:.22}
.cal-g span.ev{color:var(--tx);font-weight:600;background:var(--panel-2)}
[data-theme="light"] .cal-g span.ev{background:var(--hover)}
/* 점 색은 일정 종류에 따라 --dot 으로 들어온다 (진행 파랑 / 마감 노랑) */
.cal-g span.ev::after{content:'';position:absolute;bottom:3px;width:3px;height:3px;
  border-radius:50%;background:var(--dot,var(--run))}
.cal-g span.tdy{background:var(--accent);color:#fff;font-weight:600}
.cal-g span.tdy::after{background:#fff}
.evl{border-left:1px solid var(--line);padding-left:20px}
.evl .e{display:flex;gap:11px;padding:0 0 12px}
.evl .e:last-child{padding-bottom:0}
.evl .e.gone{opacity:.55}
.evl .e .dd{width:44px;flex:none;font-size:11.5px;color:var(--run);font-weight:500;
  font-variant-numeric:tabular-nums;padding-top:1px}
.evl .e .t{font-size:12.5px;font-weight:500;line-height:1.45}
.evl .e .t .kd{font-size:10px;font-weight:500;border:1px solid var(--line-2);
  border-radius:3px;padding:0 5px;margin-left:6px;color:var(--tx-3);white-space:nowrap}
.evl .e .m{font-size:11.5px;color:var(--tx-2);margin-top:2px}
@media(max-width:900px){.cal-w{grid-template-columns:1fr}
  .evl{border-left:none;padding-left:0;border-top:1px solid var(--line);padding-top:14px}}

table{width:100%;border-collapse:collapse}
thead tr{background:var(--panel-2)}          /* 헤더를 본문과 분리 */
th{font-size:11.5px;font-weight:600;color:var(--tx-2);text-align:left;padding:9px 13px;
  border-bottom:1px solid var(--line-2);white-space:nowrap}
th:first-child{border-top-left-radius:9px}
th:last-child{border-top-right-radius:9px}
td{padding:13px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}
td.lead{vertical-align:top}                  /* 제목+최신로그 2줄짜리 셀만 위 정렬 */
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--hover)}
.t-nm{font-weight:500;letter-spacing:-.012em;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.t-sub{font-size:11.5px;color:var(--tx-2);margin-top:3px;line-height:1.55}
.dtc{color:var(--tx-2);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-flex;align-items:center;font-size:11.5px;padding:3px 9px;
  border-radius:4px;white-space:nowrap;font-weight:600}
.g-run{background:var(--run-bg);color:var(--run)}
.g-ok{background:var(--ok-bg);color:var(--ok)}
.g-no{background:var(--no-bg);color:var(--no)}
.g-wait{background:var(--panel-2);color:var(--tx-3)}
[data-theme="light"] .g-wait{background:var(--hover);color:var(--tx-2)}
tbody tr.gone{opacity:.55}          /* 마감이 지난 추천 사업 */

/* 소통 내역 아코디언 — 본문이 있는 행만 펼쳐진다 */
tr.tk.has{cursor:pointer}
.tw{display:inline-block;width:11px;font-style:normal;color:var(--tx-3);
  transition:transform .12s;flex:none}
tr.tk.open .tw{transform:rotate(90deg)}
tr.tkb{display:none}
tr.tkb.open{display:table-row}
tr.tkb:hover{background:transparent}
tr.tkb>td{padding:0 13px 13px;border-bottom:1px solid var(--line)}
.tkbd{font-size:11.5px;color:var(--tx-2);line-height:1.75;white-space:pre-wrap;
  word-break:break-word;border-left:2px solid var(--line-2);padding-left:11px}
.co{font-size:10.5px;border:1px solid var(--line-2);border-radius:3px;padding:0 6px;color:var(--tx-3)}
.rv{font-size:10.5px;border:1px solid var(--line-2);border-radius:3px;padding:1px 6px;color:var(--tx-2)}
.rv:hover{background:var(--hover);color:var(--tx);border-color:var(--accent)}
.steps{display:flex;gap:3px;margin-top:2px;max-width:150px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line-2)}
.steps i.f{background:var(--ok)}.steps i.c{background:var(--run)}
.stepnm{font-size:11px;color:var(--tx-2);margin-top:5px}
.stepnm b{color:var(--run);font-weight:600}
.chips{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 11px;border-radius:var(--r);color:var(--tx-2);background:var(--panel-2)}
[data-theme="light"] .chip{background:var(--panel-2)}
.chip:hover{background:var(--hover);color:var(--tx)}
.chip.on{background:var(--accent);color:#fff}
.chip span{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}

/* ── 비밀번호 게이트 ── */
body.locked>aside,body.locked>main{display:none}
#gate{position:fixed;inset:0;display:none;place-items:center;padding:24px;
  background:var(--bg);z-index:60}
body.locked #gate{display:grid}
.gt{width:100%;max-width:340px;text-align:center}
/* 잠금 화면은 그로스하이 로고를 쓴다. 클라이언트 로고를 여기 두면
   비밀번호를 넣기 전에 어느 회사 페이지인지 알 수 있다.
   로고 PNG 는 배경이 검정이라 다크 테마에서 타일 경계가 사라진다 → 테두리를 준다 */
.gt .mk{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:12px;
  background:#000;border:1px solid var(--line-2);overflow:hidden;margin-bottom:15px}
.gt .mk img{width:100%;height:100%;object-fit:contain;border-radius:inherit;display:block}
[data-theme="dark"] .gt .mk{border-color:rgba(255,255,255,.28)}
.gt h1{font-size:16px;font-weight:600;letter-spacing:-.02em}
.gt .sub{font-size:12.5px;color:var(--tx-3);margin-top:6px;line-height:1.65}
.gt form{margin-top:19px;display:flex;flex-direction:column;gap:8px}
.gt input{width:100%;height:42px;padding:0 13px;border-radius:var(--r);
  border:1px solid var(--line-2);background:var(--panel);color:var(--tx);
  font-family:inherit;font-size:16px}  /* 16px 미만이면 iOS 에서 포커스 시 확대된다 */
.gt input:focus{outline:none;border-color:var(--accent)}
.gt button{height:42px;border-radius:var(--r);background:var(--accent);color:#fff;
  font-size:13.5px;font-weight:500}
.gt button[disabled]{opacity:.55;cursor:default}
.gt .msg{font-size:12px;min-height:18px;color:var(--no);line-height:1.5}
.gt .msg.busy{color:var(--tx-3)}

.err{max-width:560px;margin:64px auto;padding:0 20px;text-align:left}
.err h1{font-size:17px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
.err p{font-size:13px;color:var(--tx-2);line-height:1.7}
.err .box{margin-top:14px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);padding:14px 16px;font-size:12.5px;color:var(--tx-2);line-height:1.75}
.err code{background:var(--panel-2);border-radius:3px;padding:2px 6px;font-size:12px;color:var(--tx)}
.err .why{margin-top:10px;font-size:11.5px;color:var(--tx-3);word-break:break-all}

::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px}
@media(max-width:820px){body{overflow:auto}aside{display:none}main{height:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="locked">

<div id="gate">
  <div class="gt">
    <span class="mk" id="mk-g"></span>
    <h1>클라이언트 페이지</h1>
    <p class="sub">담당 컨설턴트에게 받은<br>비밀번호를 입력해 주세요.</p>
    <form id="gform">
      <input id="pw" type="password" autocomplete="current-password"
             placeholder="비밀번호" aria-label="비밀번호" required>
      <button type="submit" id="gbtn">확인</button>
      <p class="msg" id="gmsg" role="status" aria-live="polite"></p>
    </form>
  </div>
</div>

<aside>
  <div class="ws"><span class="mk" id="mk-s"></span>
    <span><span class="nm" id="ws-nm">불러오는 중…</span><span class="sb" id="ws-sb"></span></span></div>
  <nav id="nav"></nav>
</aside>

<main>
  <div class="top"><span class="crumb" id="crumb"></span>
    <span class="rt"><span class="pill" id="asof" style="display:none"></span>
      <button class="tgl" id="tgl" aria-label="밝기 전환">◐</button></span></div>
  <div class="scroll" id="scroll"></div>
</main>

<script>
/* ══════════════════════════════════════════════════════════════════
   데이터는 전부 build_client.py 가 만든 c/{슬러그}.enc 에서 온다.
   하드코딩된 값은 없다. 화면에 쓰이는 표현(단계 라벨·구분명)만 여기 남는다.

   file:// 로 열면 CORS 때문에 fetch 가 막힌다. 레포 루트에서
     python -m http.server 8000 --bind 127.0.0.1
   으로 띄운 뒤 http://localhost:8000/{슬러그}/ 로 열 것.
   --bind 를 빼면 0.0.0.0 이라 이 디렉터리가 같은 네트워크에 통째로 열린다.

   슬러그는 두 경로로 들어온다.
     경로형  /{슬러그}/  → 빌드가 만든 사본에 window.__SLUG__ 가 주입돼 있다
     쿼리형  /?c={슬러그} → 하위호환
   둘 다 없으면 특정 클라이언트로 기본값을 두지 않는다. 루트를 연 사람에게
   거래처 이름이 새면 안 되기 때문이다.
   ══════════════════════════════════════════════════════════════════ */

const Q = new URLSearchParams(location.search);
const BASE = (typeof window.__BASE__ === 'string') ? window.__BASE__ : '';
/* 슬러그는 파일 경로에 들어가므로 허용 문자만 남긴다 */
const clean = s => String(s || '').replace(/[^A-Za-z0-9_-]/g, '');
const CLIENT = clean(window.__SLUG__) || clean(Q.get('c') || Q.get('client')) || null;
const SRC  = CLIENT ? `${BASE}c/${CLIENT}.enc` : null;
const SKEY = CLIENT ? `gh:client:${CLIENT}` : null;

/* ── 표현 계층 상수 (JSON 의 stage 인덱스로 참조) ── */
const LABELS = {
  fund:['검토','서류','작성','평가','결과'],
  cert:['진단','서류','접수','심사','취득'],
  proj:['착수','분석','작성','검토','완료'],
};
const CATNM = { fund:'정부지원사업', cert:'기업인증·지식재산권', proj:'경영자문 프로젝트' };
const BADGE = { run:'진행', ok:'종료', no:'보류', wait:'예정' };
const GL = { info:'▣', notice:'▤', fund:'◈', cert:'✦', proj:'◇', talk:'✉', open:'◎' };

/* 사이드바·헤더 마크는 복호화한 뒤에야 기업 로고로 채운다 (init 참고).
   잠금 화면(루트·404 안내 포함)은 그로스하이 로고만 쓴다. */
const BRAND_LOGO = `${BASE}assets/growthhigh-logo.png`;

/* 노션 텍스트가 그대로 들어오므로 <, & 등을 이스케이프한다 */
const esc = v => String(v ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const pad2 = n => String(n).padStart(2,'0');
const TODAY = (d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`)(new Date());

/* 날짜 표기: 빈 값은 —, 9999-12-31/상시는 상시 */
const fmt = d => {
  if(!d) return '—';
  if(d === '상시' || d === '9999-12-31') return '상시';
  return /^\d{4}-\d{2}-\d{2}$/.test(d) ? d.slice(2).replace(/-/g,'.') : esc(d);
};

/* ── 부팅 · 비밀번호 게이트 ──
   .enc 는 AES-GCM 봉투다. 비밀번호를 URL·로그·localStorage 어디에도 남기지 않는다.
   복호화된 JSON 은 sessionStorage 에만 둔다 — 탭을 닫으면 사라진다. */
const $ = id => document.getElementById(id);
$('mk-g').innerHTML = `<img src="${encodeURI(BRAND_LOGO)}" alt="그로스하이">`;

const b64bytes = b64 => Uint8Array.from(atob(b64), ch => ch.charCodeAt(0));

async function decryptEnvelope(env, password){
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:b64bytes(env.salt),
      iterations:env.iterations || 200000, hash:'SHA-256' },
    await crypto.subtle.importKey('raw', new TextEncoder().encode(password),
      'PBKDF2', false, ['deriveKey']),
    { name:'AES-GCM', length:256 }, false, ['decrypt']);
  /* 비밀번호가 틀리면 GCM 인증 태그 검증에서 예외가 난다 */
  const plain = await crypto.subtle.decrypt(
    { name:'AES-GCM', iv:b64bytes(env.iv) }, key, b64bytes(env.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

/* 폼을 감추고 안내 문구만 남긴다. 제목도 함께 바꿀 수 있다 */
function fatal(html, heading){
  $('gform').style.display = 'none';
  $('gmsg').style.display = 'none';
  if(heading) document.querySelector('.gt h1').textContent = heading;
  document.querySelector('.gt .sub').innerHTML = html;
}
function setBusy(on, msg){
  $('gbtn').disabled = on;
  $('pw').disabled = on;
  $('gmsg').textContent = msg;
  $('gmsg').classList.toggle('busy', on);
}
function unlock(data){
  document.body.classList.remove('locked');
  init(data);
}

let ENV = null;

(async function boot(){
  /* 슬러그가 없으면 어떤 클라이언트도 지목하지 않는다.
     여기서 기본값을 두면 루트를 연 사람에게 거래처 이름이 새어 나간다 */
  if(!CLIENT){
    return fatal('담당 컨설턴트에게 전달받은<br>링크로 접속해 주세요.',
                 '클라이언트 전용 페이지입니다');
  }

  if(!(window.crypto && crypto.subtle)){
    return fatal('이 브라우저에서는 열 수 없습니다.<br>' +
      (location.protocol === 'http:' && location.hostname !== 'localhost'
        ? 'https 주소로 접속해 주세요.' : '최신 브라우저로 다시 시도해 주세요.'));
  }

  let res;
  try { res = await fetch(SRC, {cache:'no-store'}); }
  catch(e){
    return fatal(location.protocol === 'file:'
      ? '파일을 직접 열면 데이터를 읽을 수 없습니다.<br>' +
        '<code>python -m http.server 8000</code> 로 띄운 뒤 접속해 주세요.'
      : '데이터를 불러오지 못했습니다.');
  }
  /* 있는지 없는지를 알려주지 않는 중립 문구 */
  if(!res.ok) return fatal('주소를 다시 확인해 주세요.', '페이지를 찾을 수 없습니다');

  try { ENV = await res.json(); }
  catch(e){ return fatal('데이터 형식이 올바르지 않습니다.'); }

  if(ENV.enc === false) return unlock(ENV.data);   /* 비밀번호 미설정 — 개발용 평문 */

  const cached = sessionStorage.getItem(SKEY);
  if(cached){
    try { return unlock(JSON.parse(cached)); }
    catch(e){ sessionStorage.removeItem(SKEY); }
  }
  $('pw').focus();
})();

$('gform').addEventListener('submit', async e => {
  e.preventDefault();                        /* 비밀번호가 쿼리스트링으로 새지 않게 한다 */
  const pw = $('pw').value;
  if(!pw || !ENV) return;

  setBusy(true, '확인 중…');                  /* PBKDF2 20만회는 기기에 따라 1~2초 */
  await new Promise(r => setTimeout(r, 30));  /* 로딩 표시가 그려질 틈을 준다 */
  try {
    const data = await decryptEnvelope(ENV, pw);
    try { sessionStorage.setItem(SKEY, JSON.stringify(data)); } catch(_){}
    setBusy(false, '');
    $('pw').value = '';
    unlock(data);
  } catch(err){
    setBusy(false, '비밀번호가 올바르지 않습니다.');
    $('pw').select();
  }
});

/* ── 렌더 ── */
function init(D){
  const CO = D.company || {};
  const rows = Array.isArray(D.progress) ? D.progress : [];
  const events = Array.isArray(D.events) ? D.events : [];
  const recommend = Array.isArray(D.recommend) ? D.recommend : [];
  const talks = Array.isArray(D.talks) ? D.talks : [];
  const kpi = D.kpi || {};
  const notice = D.notice;

  const cnt = c => rows.filter(r => r.cat === c).length;
  const running = rows.filter(r => r.badge === 'run');

  /* 기업 로고 — 이미지 > 이모지 > 기업명 이니셜 순으로 대체한다 */
  const markCls = CO.logo ? 'mk img' : 'mk';
  function logoMark(size){
    /* 경로형 URL(/{슬러그}/)에서는 한 단계 위가 기준이라 BASE 를 붙인다 */
    if(CO.logo) return `<img class="lg" src="${encodeURI(BASE + CO.logo)}" alt="">`;
    if(CO.logo_emoji)
      return `<span class="lg-e" style="font-size:${Math.round(size*0.56)}px">${esc(CO.logo_emoji)}</span>`;
    const initials = String(CO.name || CLIENT).replace(/\s/g,'').slice(0,2);
    return `<span class="lg-t" style="font-size:${Math.round(size*0.34)}px">${esc(initials)}</span>`;
  }

  /* 상단·사이드 */
  document.title = `${CO.name || CLIENT} · 그로스하이`;
  document.getElementById('ws-nm').textContent = CO.name || CLIENT;
  const mkS = document.getElementById('mk-s');
  mkS.className = markCls;
  mkS.innerHTML = logoMark(28);
  const sb = document.getElementById('ws-sb');
  if(CO.name_en) sb.textContent = CO.name_en; else sb.style.display = 'none';

  /* company.manager 는 JSON 에 그대로 있지만 화면에는 쓰지 않는다 */
  if(D.generated_at){
    const p = document.getElementById('asof');
    p.innerHTML = `${esc(D.generated_at.slice(0,10).replace(/-/g,'.'))} <b>기준</b>`;
    p.style.display = '';
  }

  /* 메뉴·breadcrumb·요약 카드는 '공지사항' 으로 고정한다.
     몇 월인지는 공지 화면 제목(notice.title)에만 남긴다. */
  const noticeLabel = '공지사항';

  /* 좌측 메뉴 — 공지가 없으면 항목 자체를 만들지 않는다 */
  const NAV = [
    { g:'기업', items:[
      {id:'info',ic:'info',nm:'기업 정보'},
      ...(notice ? [{id:'notice',ic:'notice',nm:noticeLabel}] : [])]},
    { g:'진행 현황', items:[
      {id:'fund',ic:'fund',nm:CATNM.fund,ct:cnt('fund')},
      {id:'cert',ic:'cert',nm:CATNM.cert,ct:cnt('cert')},
      {id:'proj',ic:'proj',nm:CATNM.proj,ct:cnt('proj')},
      /* 주고받은 메일이 없으면 항목 자체를 만들지 않는다 */
      ...(talks.length ? [{id:'talk',ic:'talk',nm:'소통 내역',ct:talks.length}] : [])]},
    /* 추천할 사업이 없으면 「제안」 그룹째 감춘다 */
    ...(recommend.length
      ? [{ g:'제안', items:[{id:'open',ic:'open',nm:'추천 지원사업',ct:recommend.length}]}] : []),
    { g:'자료', items:[
      {id:'x1',nm:'기업자료 드라이브',ext:1},
      {id:'x2',nm:'사업계획서',ext:1},
      {id:'x3',nm:'그로스하이 가이드북',ext:1}]},
  ];
  document.getElementById('nav').innerHTML = NAV.map(g=>`
   <div class="grp"><h3>${g.g}</h3>
   ${g.items.map(i=>`<button class="nv" data-id="${i.id}" ${i.ext?'data-ext="1"':''}>
     <span class="g">${i.ic?GL[i.ic]:'↗'}</span><span>${esc(i.nm)}</span>
     ${i.ext?'<span class="ex">↗</span>':(i.ct!=null?`<span class="ct">${i.ct}</span>`:'')}
   </button>`).join('')}</div>`).join('');

  /* 공통 조각 */
  const steps = r => r.stage < 0 ? '<div class="stepnm">보류</div>' :
    `<div class="steps">${(LABELS[r.cat]||LABELS.proj).map((s,i)=>
      `<i class="${i<r.stage?'f':i===r.stage?'c':''}"></i>`).join('')}</div>
     <div class="stepnm">${r.stage<5?`<b>${esc(r.stage_label)}</b> 단계`:'종료'}</div>`;
  const tag = r => `<span class="tag g-${r.badge}">${BADGE[r.badge]||r.badge}</span>`;
  const emptyBox = msg => `<div class="card"><div class="cb">
    <p class="empty">${esc(msg)}</p></div></div>`;

  function table(cat){
    const list = rows.filter(r=>r.cat===cat);
    if(!list.length) return emptyBox('등록된 내용이 없습니다.');
    return `<div class="card"><table><thead><tr>
      <th style="width:42%">${cat==='cert'?'인증·권리':'사업명'}</th>
      <th style="width:20%">단계</th><th style="width:10%">상태</th>
      <th style="width:16%">기간</th><th style="width:12%">최근</th></tr></thead>
    <tbody>${list.map(r=>`<tr>
      <td class="lead"><div class="t-nm">${esc(r.title)}${r.joint?'<span class="co">공동</span>':''}</div>
          ${r.log_text?`<div class="t-sub">${esc(r.log_text)}</div>`:''}</td>
      <td>${steps(r)}</td><td>${tag(r)}</td>
      <td class="dtc">${fmt(r.start)} – ${fmt(r.end)}</td>
      <td class="dtc">${esc(r.log_date)}</td></tr>`).join('')}
    </tbody></table></div>`;
  }

  /* 공지 — notice 가 null 이면 빈 상태로 레이아웃 유지.
     item.html 은 build_client.py 가 이스케이프해서 만든 HTML 이므로 그대로 넣는다. */
  function noticeItem(it, depth){
    const c = it.checked;
    const cls = c === true ? 'chk on' : c === false ? 'chk' : 'plain';
    const kids = (depth < 2 && (it.children||[]).length)      /* 화면은 2단까지 */
      ? `<ul>${it.children.map(k=>noticeItem(k, depth+1)).join('')}</ul>` : '';
    return `<li class="${cls}">${it.html || ''}${kids}</li>`;
  }
  function noticeFeed(){
    const sections = (notice && Array.isArray(notice.sections)) ? notice.sections : [];
    if(!sections.length){
      return `<div class="notice"><div class="bd" style="padding-top:13px">
        <p class="empty">등록된 내용이 없습니다.</p></div></div>`;
    }
    return sections.map(s=>`
      <div class="notice">${s.heading?`<h3>${esc(s.heading)}</h3>`:''}<div class="bd">
       ${(s.items||[]).length
         ? `<ul class="ck">${s.items.map(i=>noticeItem(i,1)).join('')}</ul>`
         : `<p class="empty">등록된 내용이 없습니다.</p>`}
      </div></div>`).join('');
  }

  /* 공지 요약 — 첫 화면에서는 첫 섹션의 1단 항목만, 최대 5개까지 보여준다 */
  const SUMMARY_MAX = 5;
  function noticeSummary(){
    if(!notice) return '';
    const first = (notice.sections || [])[0];
    const items = (first && first.items) || [];
    const shown = items.slice(0, SUMMARY_MAX);
    const rest = items.length - shown.length;
    return `<div class="card" style="margin-top:24px">
      <div class="ch"><h2>${esc(noticeLabel)}</h2>
        ${notice.date?`<span class="d">${esc(notice.date)}</span>`:''}
        <a class="more" href="#" data-go="notice">전체 보기 →</a></div>
      <div class="cb">
       ${shown.length
         ? `<ul class="ck">${shown.map(i=>noticeItem({...i, children:[]}, 1)).join('')}</ul>
            ${rest > 0 ? `<p class="empty" style="margin-top:6px">외 ${rest}건</p>` : ''}`
         : `<p class="empty">등록된 내용이 없습니다.</p>`}
      </div></div>`;
  }

  /* 일정 — progress 의 종료 예정일과 recommend 의 마감일에서 온다.
     이벤트가 없어도 달력은 그대로 둔다. */
  const KIND = { project:{label:'진행', dot:'var(--accent)'},
                 deadline:{label:'마감', dot:'var(--run)'} };

  function calMonth(y,m){
    const first=new Date(y,m-1,1), last=new Date(y,m,0).getDate(), lead=first.getDay();
    /* 날짜별 점 색. 같은 날 여러 건이면 먼저 오는 건의 종류를 쓴다 */
    const dot=new Map();
    events.filter(e=>String(e.date||'').startsWith(`${y}-${pad2(m)}`))
      .forEach(e=>{ const d=+String(e.date).slice(8);
        if(!dot.has(d)) dot.set(d,(KIND[e.kind]||KIND.deadline).dot); });
    let c=''; ['일','월','화','수','목','금','토'].forEach(w=>c+=`<span class="wk">${w}</span>`);
    for(let i=0;i<lead;i++) c+='<span class="dim"></span>';
    for(let d=1;d<=last;d++){
      const iso=`${y}-${pad2(m)}-${pad2(d)}`;
      const cls=iso===TODAY?'tdy':dot.has(d)?'ev':'';
      const st=(cls==='ev')?` style="--dot:${dot.get(d)}"`:'';
      c+=`<span class="${cls}"${st}>${d}</span>`;
    }
    return `<div class="cal"><h4>${m}월</h4><div class="cal-g">${c}</div></div>`;
  }

  function schedule(){
    const now=new Date(), y=now.getFullYear(), m=now.getMonth()+1;
    const ny=m===12?y+1:y, nm=m===12?1:m+1;
    const list = events.length ? events.map(e=>{
      const k = KIND[e.kind] || KIND.deadline;
      /* 지난 건은 D-day 대신 상태를 쓴다 — 진행은 「종료」, 마감은 「마감」 */
      const left = e.past ? (e.kind==='project'?'종료':'마감') : (e.dday || '');
      return `<div class="e${e.past?' gone':''}">
        <span class="dd"${e.past?' style="color:var(--tx-3)"':''}>${esc(left)}</span><span>
        <span class="t">${esc(e.title)}<span class="kd">${k.label}</span></span>
        <span class="m">${esc(String(e.date||'').slice(5).replace('-','/'))}${
          e.meta?` · ${esc(e.meta)}`:''}</span>
        </span></div>`;
    }).join('') : '<p class="empty">등록된 일정이 없습니다.</p>';
    return `<div class="card"><div class="ch"><h2>일정</h2></div><div class="cb">
      <div class="cal-w">${calMonth(y,m)}${calMonth(ny,nm)}
      <div class="evl">${list}</div></div></div></div>`;
  }

  /* 화면 */
  const V={};
  /* KPI 「다음 일정」 타일은 아직 안 지난 것 중 가장 가까운 건을 쓴다 */
  const nextEv = events.find(e => !e.past) || null;

  V.info=()=>`
   <div class="hero"><span class="${markCls}">${logoMark(52)}</span><div>
     <h2>${esc(CO.name || CLIENT)}</h2>
     ${CO.biz?`<div class="biz">${esc(CO.biz)}</div>`:''}
     ${(CO.tags||[]).length?`<div class="tags">${CO.tags.map(t=>`<span class="mini">${esc(t)}</span>`).join('')}</div>`:''}
   </div></div>

   <div class="kpi">
    <div class="k1"><div class="k">진행 중</div><div class="v">${kpi.running ?? running.length}<small>건</small></div>
      <div class="s">지원사업 ${running.filter(r=>r.cat==='fund').length} · 인증 ${running.filter(r=>r.cat==='cert').length}</div></div>
    <div class="k1"><div class="k">완료</div><div class="v">${kpi.done ?? 0}<small>건</small></div>
      <div class="s">누적</div></div>
    <div class="k1"><div class="k">취득 인증</div><div class="v">${kpi.certs ?? 0}<small>건</small></div>
      <div class="s">기업인증·지식재산권 완료 건</div></div>
    <div class="k1"><div class="k">다음 일정</div>
      <div class="v" style="font-size:19px">${nextEv?esc(String(nextEv.date).slice(5).replace('-','/')):'—'}</div>
      <div class="s">${nextEv?esc(nextEv.title):'예정된 일정이 없습니다'}</div></div>
   </div>

   ${noticeSummary()}
   ${schedule()}

   <div class="card" style="margin-top:24px">
    <div class="ch"><h2>진행 중인 건</h2><a class="more" href="#" data-go="fund">전체 보기 →</a></div>
    ${running.length?`<table><thead><tr><th style="width:42%">건</th><th style="width:14%">구분</th>
     <th style="width:20%">단계</th><th style="width:12%">상태</th><th style="width:12%">최근</th></tr></thead>
    <tbody>${running.map(r=>`<tr>
      <td class="lead"><div class="t-nm">${esc(r.title)}${r.joint?'<span class="co">공동</span>':''}</div>
          ${r.log_text?`<div class="t-sub">${esc(r.log_text)}</div>`:''}</td>
      <td class="dtc">${CATNM[r.cat].split('·')[0]}</td>
      <td>${steps(r)}</td><td>${tag(r)}</td><td class="dtc">${esc(r.log_date)}</td></tr>`).join('')}
    </tbody></table>`:`<div class="cb"><p class="empty">진행 중인 건이 없습니다.</p></div>`}</div>`;

  V.notice=()=>`<div class="vh"><h1>${esc((notice&&notice.title)||'공지사항')}</h1>
    ${notice&&notice.date?`<span class="n">${esc(notice.date)}</span>`:''}</div>
   ${noticeFeed()}`;

  V.fund=()=>`<div class="vh"><h1>${CATNM.fund}</h1><span class="n">${cnt('fund')}건</span></div>${table('fund')}`;
  V.cert=()=>`<div class="vh"><h1>${CATNM.cert}</h1><span class="n">${cnt('cert')}건</span></div>${table('cert')}`;
  V.proj=()=>`<div class="vh"><h1>${CATNM.proj}</h1><span class="n">${cnt('proj')}건</span></div>${table('proj')}`;

  /* 소통 내역 — 노션 소통 DB 에서 「공개」인 것만 온다.
     목록에는 일자·채널·제목만 두고, 본문은 행을 눌렀을 때 펼친다.
     body 가 null 이면 펼칠 것이 없으므로 표시도 하지 않는다. */
  V.talk=()=>`<div class="vh"><h1>소통 내역</h1>
    ${talks.length?`<span class="n">${talks.length}건</span>`:''}</div>
   ${talks.length?`<div class="card"><table><thead><tr>
    <th style="width:14%">일자</th><th style="width:16%">채널</th>
    <th>제목</th></tr></thead>
   <tbody>${talks.map((t,i)=>`<tr class="tk${t.body?' has':''}" data-tk="${i}">
     <td class="dtc">${fmt(t.date)}</td>
     <td class="dtc">${esc(t.channel||'')}${t.direction
        ?`<span class="co" style="margin-left:5px">${esc(t.direction)}</span>`:''}</td>
     <td><div class="t-nm">${t.body?'<i class="tw">▸</i>':''}${esc(t.title||'')}</div></td>
    </tr>${t.body?`<tr class="tkb" data-tkb="${i}"><td colspan="3">
     <div class="tkbd">${esc(t.body)}</div></td></tr>`:''}`).join('')}
   </tbody></table></div>`:emptyBox('등록된 내용이 없습니다.')}`;

  /* 추천 지원사업 — org 는 항상 null 이라 부제에는 마감일을 쓴다.
     검토서는 발행된 HTML 이라 새 탭으로 연다. */
  V.open=()=>`<div class="vh"><h1>추천 지원사업</h1>
    ${recommend.length?`<span class="n">${recommend.length}건</span>`:''}</div>
   ${recommend.length?`<div class="card"><table><thead><tr>
    <th style="width:10%">마감</th><th style="width:62%">사업명</th>
    <th class="num">지원 규모</th></tr></thead>
   <tbody>${recommend.map(o=>`<tr${o.expired?' class="gone"':''}>
    <td class="dtc" style="${o.expired?'':'color:var(--run);'}font-weight:600">${
      o.expired?'마감':esc(o.dday||'상시')}</td>
    <td class="lead"><div class="t-nm">${esc(o.title||'')}${o.review_url
        ?`<a class="rv" href="${encodeURI(o.review_url)}" target="_blank" rel="noopener">검토서</a>`:''}</div>
        ${[o.org, o.deadline?`${esc(o.deadline)} 마감`:''].filter(Boolean).join(' · ')
          ?`<div class="t-sub">${[o.org?esc(o.org):'', o.deadline?`${esc(o.deadline)} 마감`:''].filter(Boolean).join(' · ')}</div>`:''}</td>
    <td class="num">${o.amount?esc(o.amount):'—'}</td></tr>`).join('')}
   </tbody></table></div>`:emptyBox('등록된 내용이 없습니다.')}`;

  const CR={info:'기업 정보',fund:CATNM.fund,cert:CATNM.cert,
    proj:CATNM.proj,talk:'소통 내역',open:'추천 지원사업'};
  if(notice) CR.notice = noticeLabel;
  function go(id){
    if(!V[id])return;
    if(id === 'notice' && !notice) return;      /* 공지가 없으면 이 화면은 없다 */
    /* 푸터 없음 — 클라이언트가 보는 화면에 내부 구현 설명을 남기지 않는다.
       기준일은 상단 우측 pill 에만 표시한다. */
    document.getElementById('scroll').innerHTML=`<div class="view">${V[id]()}</div>`;
    document.getElementById('crumb').innerHTML=`${esc(CO.name||CLIENT)}<i>/</i>${esc(CR[id])}`;
    document.querySelectorAll('.nv').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
    document.getElementById('scroll').scrollTop=0;
    document.querySelectorAll('[data-go]').forEach(b=>b.onclick=e=>{e.preventDefault();go(b.dataset.go)});
    /* 소통 내역 아코디언 */
    document.querySelectorAll('tr.tk.has').forEach(tr=>tr.onclick=()=>{
      const body=document.querySelector(`tr.tkb[data-tkb="${tr.dataset.tk}"]`);
      tr.classList.toggle('open');
      if(body) body.classList.toggle('open');
    });
  }
  document.querySelectorAll('.nv').forEach(b=>{if(!b.dataset.ext)b.onclick=()=>go(b.dataset.id)});
  go('info');
}

document.getElementById('tgl').onclick=()=>{
  const r=document.documentElement;
  r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'};
</script>
</body>
</html>
